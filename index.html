<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICAO RT Trainer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#13202A">
<meta name="description" content="Aviation English radiotelephony trainer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: aeronautical-chart palette; modules presented as flight progress strips; one centered column */
:root{
  --bg:#E8EDF0; --surface:#FAFBFC; --sunk:#DEE5EA; --ink:#13202A; --muted:#556773; --line:#C6D1D8;
  --accent:#A2266E; --blue:#1E5C8D;
  --dep:#D4E4F2; --arr:#F1E4C3; --misc:#E2DAF0; --wx:#D7EBDF;
  --grass:#CBD9BE; --grass2:#C0D0B2; --conc:#D6DBDD; --term:#8E9AA3; --twrwin:#BFE3F2; --twyc:#5E676E; --asph:#3F474E; --mark:#F5F7F8; --yel:#E3B505; --parked:#9AA4AB; --chart:#EEF1E9; --terr:#BFAE8C; --terr2:#A89470; --sky1:#B8D3EC; --sky2:#EAF2F8; --cloud:#FFFFFF;
  --strip:#D3E0C6; --shld:#8A949B;
  --fbg:#ECEDEF; --fpave:#2F3237; --fyel:#E2A500; --fterm:#B9BCC0; --ftermb:#8E9297; --fink:#3A3D42;
  --scene:#E2EAE0; --sky:#E4EEF6; --rwy:#48525A; --rwym:#F4F6F7; --twy:#A3AFB6; --apron:#CDD5DA; --tr:#C27200; --holdl:#D9A800; --scope:#06140D; --scopeg:#45D985;
  --good:#28744A; --good-bg:#DDEFE3; --bad:#B42318; --bad-bg:#F7E1DD; --warn:#9A5F0E; --warn-bg:#F5EAD3;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fbg:#171B1F; --fpave:#353A40; --fyel:#D49B05; --fterm:#4B5057; --ftermb:#646A72; --fink:#D9DDE1;
  --strip:#1C2D21; --shld:#2E373E;
  --grass:#16241A; --grass2:#1B2B1F; --conc:#29323A; --term:#46525C; --twrwin:#5D8FA6; --twyc:#30393F; --asph:#20262C; --mark:#C9D1D6; --yel:#C9A20E; --parked:#56626B; --chart:#121A16; --terr:#3B3426; --terr2:#4A4130; --sky1:#0C1F33; --sky2:#1A2B3C; --cloud:#3A4A58;
  --scene:#13211A; --sky:#0F1B26; --rwy:#2E373E; --rwym:#C7D0D6; --twy:#3B4851; --apron:#22303A; --tr:#F2A93A; --holdl:#E8C23A;
  --bg:#0D151B; --surface:#14202A; --sunk:#0F1A22; --ink:#E1E9EE; --muted:#8EA1AE; --line:#273845;
  --accent:#E46FAF; --blue:#78B5E6;
  --dep:#1A2E40; --arr:#3A3019; --misc:#2B2540; --wx:#18322A;
  --good:#5CC38B; --good-bg:#14301F; --bad:#F1806F; --bad-bg:#3A1C19; --warn:#E5B158; --warn-bg:#382B14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --fbg:#171B1F; --fpave:#353A40; --fyel:#D49B05; --fterm:#4B5057; --ftermb:#646A72; --fink:#D9DDE1;
  --strip:#1C2D21; --shld:#2E373E;
  --grass:#16241A; --grass2:#1B2B1F; --conc:#29323A; --term:#46525C; --twrwin:#5D8FA6; --twyc:#30393F; --asph:#20262C; --mark:#C9D1D6; --yel:#C9A20E; --parked:#56626B; --chart:#121A16; --terr:#3B3426; --terr2:#4A4130; --sky1:#0C1F33; --sky2:#1A2B3C; --cloud:#3A4A58;
  --scene:#13211A; --sky:#0F1B26; --rwy:#2E373E; --rwym:#C7D0D6; --twy:#3B4851; --apron:#22303A; --tr:#F2A93A; --holdl:#E8C23A;
  --bg:#0D151B; --surface:#14202A; --sunk:#0F1A22; --ink:#E1E9EE; --muted:#8EA1AE; --line:#273845;
  --accent:#E46FAF; --blue:#78B5E6;
  --dep:#1A2E40; --arr:#3A3019; --misc:#2B2540; --wx:#18322A;
  --good:#5CC38B; --good-bg:#14301F; --bad:#F1806F; --bad-bg:#3A1C19; --warn:#E5B158; --warn-bg:#382B14;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.lbl{font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:1.35rem;white-space:nowrap}
.brand b{color:var(--accent)}
.brand small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:400}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;font-family:var(--f-disp);font-weight:600;font-size:1rem;letter-spacing:.03em;color:var(--muted)}
nav button:hover{color:var(--ink);background:var(--sunk)}
nav button[aria-current="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}

main{padding-block:22px 60px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-family:var(--f-disp);font-weight:600;font-size:.95rem;letter-spacing:.03em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px;font-family:var(--f-mono);font-size:.95rem}
.check{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:.92rem}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center}
.hero p.lead{color:var(--muted);max-width:52ch;margin-top:10px}
.tx{background:var(--ink);color:var(--bg);border-radius:10px;padding:16px 18px;font-family:var(--f-mono);font-size:.92rem;display:flex;flex-direction:column;gap:10px;min-width:0}
.tx .who{font-family:var(--f-disp);letter-spacing:.1em;text-transform:uppercase;font-size:.75rem;opacity:.7}
.tx .written{opacity:.65;font-size:.8rem}
.tx .freqline{display:flex;justify-content:space-between;font-size:.75rem;opacity:.8;border-bottom:1px dashed currentColor;padding-bottom:8px}

/* flight strips */
.strips{display:flex;flex-direction:column;gap:8px}
.strip{display:grid;grid-template-columns:96px 1fr auto;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;text-align:left;padding:0;overflow:hidden;width:100%}
.strip:hover{border-color:var(--ink)}
.strip .cs{font-family:var(--f-mono);font-weight:600;padding:12px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.strip .cs span{font-size:.7rem;color:var(--muted);font-weight:400}
.strip .bd{padding:12px 14px;min-width:0}
.strip .bd h3{font-size:1.25rem}
.strip .bd p{color:var(--muted);font-size:.9rem;margin-top:2px}
.strip .fx{display:grid;grid-template-columns:repeat(2,minmax(70px,auto));border-left:1px solid var(--line);font-family:var(--f-mono);font-size:.75rem}
.strip .fx div{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.strip .fx div:nth-child(2n){border-right:0}
.strip .fx div:nth-last-child(-n+2){border-bottom:0}
.strip .fx b{display:block;font-size:.85rem;color:var(--ink)}
.strip .fx i{font-style:normal;color:var(--muted);font-size:.65rem;text-transform:uppercase;letter-spacing:.06em}
.s-dep .cs{background:var(--dep)} .s-arr .cs{background:var(--arr)} .s-misc .cs{background:var(--misc)} .s-wx .cs{background:var(--wx)}

/* progress */
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.bar .t{display:flex;justify-content:space-between;font-size:.88rem}
.bar .track{height:6px;background:var(--sunk);border-radius:3px;margin-top:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--blue)}
.mist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mist li{list-style:none;font-size:.88rem;padding:6px 10px;background:var(--sunk);border-radius:6px}
.mist ul{padding:0;margin:0;display:flex;flex-direction:column;gap:6px}

/* radio */
.com{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px 10px 0 0;font-family:var(--f-mono)}
.com .f{font-size:1.6rem;font-weight:600;letter-spacing:.04em}
.com .st{font-family:var(--f-disp);font-size:1.1rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.com .pg{margin-left:auto;font-size:.8rem;opacity:.75}
.radio{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.log{max-height:260px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.log:empty{display:none}
.msg{font-family:var(--f-mono);font-size:.85rem;padding:7px 10px;border-radius:7px;max-width:88%;overflow-wrap:anywhere}
.msg.atc{background:var(--sunk);align-self:flex-start}
.msg.you{background:var(--dep);align-self:flex-end}
.msg .w{display:block;font-family:var(--f-disp);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.turn{padding:16px;display:flex;flex-direction:column;gap:12px}
.sit{background:var(--arr);border-radius:7px;padding:9px 12px;font-size:.92rem}
.sit b{font-family:var(--f-disp);letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;margin-right:6px}
.atcnow{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-family:var(--f-mono);font-size:1rem;overflow-wrap:anywhere}
.atcnow .written{display:block;font-size:.78rem;color:var(--muted);margin-top:3px}
.task{font-weight:600}
.fb{border-radius:7px;padding:10px 12px;font-size:.92rem}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.wa{background:var(--warn-bg);color:var(--warn)}
.fb ul{margin:6px 0 0;padding-left:18px}
.fb .model{display:block;margin-top:6px;font-family:var(--f-mono);color:var(--ink)}
.settings{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.settings input[type=text]{width:120px}

/* quiz */
.q{font-size:1.2rem;font-weight:500}
.q.mono{font-size:1.1rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 13px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.score{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.card{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;padding:26px}
.card .ans{font-size:1.15rem;color:var(--blue);font-weight:500}
.note{font-size:.85rem;background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:6px}
.plist{display:flex;flex-direction:column}
.plist div{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.plist div>*{min-width:0}
.plist .r{color:var(--muted)}

/* weather */
.chips{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-mono)}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 9px;border-radius:5px;cursor:pointer;font-size:.95rem}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.chip.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chip.hl{background:var(--dep)}
.raw{font-family:var(--f-mono);background:var(--sunk);padding:12px;border-radius:7px;overflow-wrap:anywhere}
.dtab{overflow-x:auto}
.dtab table{border-collapse:collapse;width:100%;font-size:.9rem}
.dtab td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.dtab td:first-child{font-family:var(--f-mono);white-space:nowrap;font-weight:600}
.dtab tr.trend td{background:var(--sunk)}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:10px 12px;text-align:left;cursor:pointer;font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.mi.k{font-family:var(--f-mono);font-weight:600}
.mi.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.mi.done{background:var(--good-bg);border-color:var(--good);color:var(--good);cursor:default}
.mi.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mi.bad{animation:none}}
.spellres{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-mono);font-size:.85rem}
.spellres span{padding:4px 7px;border-radius:5px}
.spellres .y{background:var(--good-bg);color:var(--good)} .spellres .n{background:var(--bad-bg);color:var(--bad)}
.big{font-family:var(--f-mono);font-size:2.2rem;font-weight:600;letter-spacing:.06em;text-align:center}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:.9rem}

/* scenes & motion */
.scene{display:block;width:100%;height:auto}
.scenebox{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--scene)}
.scenebox figcaption{display:flex;justify-content:space-between;gap:10px;font-size:.72rem;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.sc-bg{fill:var(--scene)} .sky{fill:var(--sky)} .grid{stroke:var(--line);stroke-width:1;opacity:.6;fill:none}
.rwy{fill:var(--rwy)} .cl{stroke:var(--rwym);stroke-width:2;stroke-dasharray:14 10} .rn{fill:var(--rwym);font:600 12px var(--f-mono)}
.twy{fill:var(--twy)} .apron{fill:var(--apron)} .stand{stroke:var(--twy);stroke-width:2} .stand.mine{stroke:var(--accent);stroke-width:3}
.hold{stroke:var(--holdl);stroke-width:2}
.sl{fill:var(--muted);font:500 12px var(--f-mono);letter-spacing:.04em} .wl{fill:var(--ink);font:600 13px var(--f-mono)} .lvt{fill:var(--accent);font:600 13px var(--f-mono)}
.ac{fill:var(--ink);stroke:var(--scene);stroke-width:1} .tr{fill:var(--tr)} .trt{fill:var(--tr);font:600 12px var(--f-mono)} .trl{stroke:var(--tr);stroke-dasharray:3 3}
.truck{fill:var(--bad)} .truckr{fill:var(--tr)} .tug{fill:var(--warn)} .crossr{fill:var(--bad)}
.route{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 5;opacity:.75}
.rt{fill:none;stroke:var(--accent);stroke-width:2.5} .rt.faint{opacity:.3}
.wp{fill:var(--scene);stroke:var(--ink);stroke-width:1.6}
.aptc{fill:var(--scene);stroke:var(--blue);stroke-width:2} .aptr{stroke:var(--blue);stroke-width:3}
.lvl{stroke:var(--muted);stroke-dasharray:4 4;opacity:.6} .lvl.clr{stroke:var(--accent);stroke-dasharray:none;opacity:1;stroke-width:1.5}
.gnd{stroke:var(--muted);stroke-width:2}
.tag{fill:var(--surface);stroke:var(--line)} .tagt{fill:var(--ink);font:600 12px var(--f-mono)}
.halo{paint-order:stroke;stroke:rgba(246,248,244,.92);stroke-width:4px;stroke-linejoin:round} .warnt{fill:var(--bad);font:700 15px var(--f-disp);letter-spacing:.08em} .goodt{fill:var(--good);font:700 16px var(--f-disp);letter-spacing:.08em}
.ra{fill:var(--good-bg);stroke:var(--good)} .rat{fill:var(--good);font:700 15px var(--f-disp);letter-spacing:.06em}
.cell1{fill:var(--bad);opacity:.14} .cell2{fill:var(--bad);opacity:.24} .cell3{fill:var(--bad);opacity:.45}
.cone{fill:var(--blue);opacity:.12} .loc,.gs{stroke:var(--blue);stroke-width:1.5;stroke-dasharray:8 6}
.rose{fill:var(--surface);stroke:var(--line)} .windarr{stroke:var(--blue);stroke-width:2.5} .windhead{fill:var(--blue)}
.fire{fill:#F26A1B}
.scope{fill:var(--scope)} .ring{fill:none;stroke:var(--scopeg);opacity:.3} .sw{stroke:var(--scopeg);stroke-width:2;opacity:.8}
.sweep{transform-box:view-box;transform-origin:300px 150px;animation:spin 4s linear infinite}
.blip{fill:var(--scopeg)} .dbt{fill:var(--scopeg);font:600 15px var(--f-mono)} .dbt.bad{fill:#FF6B5E}
.ping{fill:none;stroke:var(--scopeg);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.4s ease-out infinite}
.blink{animation:blink 1s steps(2) infinite}
.flick{transform-box:fill-box;transform-origin:center;animation:flick .45s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes flick{to{transform:scale(1.4);opacity:.55}}
.banb{fill:var(--bad)} .bant{fill:#fff;font:700 14px var(--f-disp);letter-spacing:.08em}
.eref{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;font-size:.9rem}
.eref p{margin-top:2px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ecard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s,transform .15s}
.ecard:hover{border-color:var(--ink);transform:translateY(-2px)}
.ecard b{font-family:var(--f-disp);font-size:1.2rem;letter-spacing:.01em}
.ecard .muted{font-size:.88rem}
.emeta{font-size:.75rem;color:var(--muted);margin-top:auto}
.sev{align-self:flex-start;font-family:var(--f-mono);font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:4px;letter-spacing:.05em}
.sev-m{background:var(--bad-bg);color:var(--bad)} .sev-p{background:var(--warn-bg);color:var(--warn)} .sev-n{background:var(--sunk);color:var(--blue)}
@media (prefers-reduced-motion:reduce){.ecard{transition:none}}

/* ---- diagram v2 ---- */
.grass{fill:var(--grass)} .grassl{stroke:var(--grass2);stroke-width:1}
.conc{fill:var(--conc)} .term{fill:var(--term)} .win{fill:var(--twrwin)} .tlab{fill:var(--rwym);font:600 9px var(--f-mono);letter-spacing:.1em}

nd taxiway condition", "e": "RWY 07 is rough in some places.", "r": "ВПП 07 в некоторых местах неровная."}, {"s": "Runway and taxiway condition", "e": "Go around, standard procedure, there's RWY lighting failure.", "r": "Уходите на второй круг по стандартной процедуре, освещение ВПП не работает."}, {"s": "Runway and taxiway condition", "e": "TWY 4 is partly covered with ice.", "r": "Рулежная дорожка 4 частично покрыта льдом."}, {"s": "Runway and taxiway condition", "e": "TWY M blocked by a wrong-turning aircraft.", "r": "Рулежная дорожка M заблокирована самолетом, повернувшим не туда."}, {"s": "Runway and taxiway condition", "e": "Thicker fog patches observed further along the RWY from control tower.", "r": "С вышки наблюдается местами более густой туман вдоль ВПП."}, {"s": "Runway and taxiway condition", "e": "Unofficial observation based on pilot report RWY 34 braking action medium to poor.", "r": "Неофициальное наблюдение на основе доклада пилота: коэффициент сцепления на ВПП 34 среднее до плохого."}, {"s": "Weather and environment", "e": "Heavy hail shower observed, approaching from the North.", "r": "Наблюдаются сильные осадки с градом, приближаются с севера."}, {"s": "Weather and environment", "e": "There is fog in patches on final. Do you need a fog dispersal system (FDS)?", "r": "На посадочной прямой местами туман, нужна ли вам система рассеивания тумана?"}, {"s": "Weather and environment", "e": "By 3 o'clock the fog will get thicker, the aerodrome will be closed for an indefinite time.", "r": "К 3 часам туман станет гуще, аэродром будет закрыт на неопределенное время."}, {"s": "Weather and environment", "e": "Report meteorological conditions observed from your aircraft.", "r": "Сообщите о метеоусловиях, наблюдаемых с вашего борта."}, {"s": "Weather and environment", "e": "Be informed of rain clutters over SL.", "r": "Для вашей информации – грозовые засветы над SL."}, {"s": "Weather and environment", "e": "ATIS Golf is now current.", "r": "ATIS Golf сейчас д e become better?", "r": "Стала ли погода на вашем аэродроме лучше?"}, {"s": "Weather and environment", "e": "Has the fog in the vicinity of your field become (got) thicker?", "r": "Сгустился ли туман вблизи вашего аэродрома?"}, {"s": "Weather and environment", "e": "Be advised of hail hitting in progress in the vicinity of DIPAX till FL 270, radius 10 km.", "r": "Сообщаю, что в районе DIPAX идет град, до эшелона FL 270, радиус 10 км."}, {"s": "Weather and environment", "e": "Be advised airdrome is closed due to hail hitting.", "r": "Сообщаю, что аэродром закрыт из-за града."}, {"s": "Weather and environment", "e": "Where has the thunderstorm moved to?", "r": "Куда сместилась гроза?"}, {"s": "Weather and environment", "e": "Where is the thunderstorm coming from?", "r": "Откуда приближается гроза?"}, {"s": "Weather and environment", "e": "Lightning has struck the aircraft.", "r": "В самолет попала молния."}, {"s": "Weather and environment", "e": "Aerodrome is unsafe due to thick fog. You are allowed to land only at your discretion.", "r": "Аэродром небезопасен из-за густого тумана. Вам разрешается садиться только по собственному усмотрению."}, {"s": "Weather and environment", "e": "I have just avoided CB, now continue climbing FL 270, will advise reaching.", "r": "Я только что обошел кучево-дождевые облака, продолжаю набор до эшелона 270, занятие эшелона доложу."}, {"s": "Communication and identification", "e": "Read you with interference.", "r": "Слышу вас с помехами."}, {"s": "Communication and identification", "e": "Readability is poor. Send words twice.", "r": "Слышу вас плохо. Передавайте слова дважды."}, {"s": "Communication and identification", "e": "You were blocked / blotted out (covered by another station).", "r": "Вас заглушила другая станция. Вы были забиты."}, {"s": "Communication and identification", "e": "Say again, using another headset / Try box 2.", "r": "Повторите, используя другую гарнитуру / Попробуйте вторую радиостанцию."}, {"s": "Communication er of your transmitter.", "r": "Увеличьте мощность вашего передатчика."}, {"s": "Communication and identification", "e": "Squawk Mayday.", "r": "Установите код ответчика 7700.", "n": "Code 7700 = emergency, 7600 = radio failure, 7500 = unlawful interference."}, {"s": "Communication and identification", "e": "Unknown aircraft, unknown aircraft at position 41 North, 65 West, speed 348, heading of 132, Squawk ident", "r": "Неопознанное воздушное судно, неопознанное воздушное судно на позиции 41° северной широты, 65° западной долготы, скорость 348, курс 132, ответчик в режиме Ident."}, {"s": "Taxiway and ground movement", "e": "Broken vehicle on the TWY.", "r": "На рулежной дорожке неисправное транспортное средство."}, {"s": "Taxiway and ground movement", "e": "You have gone too far. You missed TWY D4. Wait there for the follow-me car.", "r": "Вы заехали слишком далеко. Вы пропустили рулежную дорожку D4. Ожидайте на месте машину сопровождения."}, {"s": "Taxiway and ground movement", "e": "Turn in the holding bay, take the first convenient left turn onto TWY Juliet.", "r": "Развернитесь в кармане ВПП, поверните налево на первую удобную рулежную дорожку Джульет."}, {"s": "Taxiway and ground movement", "e": "Stop taxi, a Boeing 737 has taken a wrong turning and is blocking the TWY.", "r": "Остановите руление, Боинг 737 ошибся поворотом и заблокировал рулежную дорожку."}, {"s": "Taxiway and ground movement", "e": "You'll have to wait until a tug pushes him back beyond the next intersection.", "r": "Вам нужно подождать, пока тягач отбуксирует его за следующий перекресток."}, {"s": "Taxiway and ground movement", "e": "Can you move forward under your own power, 50 meters or so until you pass the next intersection?", "r": "Можете ли вы самостоятельно проехать вперед 50 метров, чтобы освободить следующий перекресток?"}, {"s": "Taxiway and ground movement", "e": "Speed up (expedite) taxi.", "r": "Ускорьте руление.", "n": "ICAO: 'Expedite taxi'."}, {"s": "Taxiway and ground movement", "e": "Hold in run-up area.", "r": "Ожидайте в зоне прогрева двигателей."}, {"s": "Taxiway and ground movement", "e": "Go around (make a missed approach procedure).", "r": "Уходите на второй круг (выполняйте процедуру ухода)."}, {"s": "Taxiway and ground movement", "e": "Taxi via TWY C, backtrack, and line up RWY 07.", "r": "Рулите по РД Чарли, затем разворачивайтесь и занимайте исполнительный ВПП 07."}, {"s": "Taxiway and ground movement", "e": "Could you taxi about 15 meters (forward) to keep the taxiway clear for Boeing 737?", "r": "Не могли бы вы прорулить примерно 15 метров вперед, чтобы освободить рулежную дорожку для Боинга 737?"}, {"s": "Taxiway and ground movement", "e": "Bleed-off TWY, by-pass TWY.", "r": "Соединительная РД, обводная РД."}, {"s": "Taxiway and ground movement", "e": "There is a B-747 parking behind you. After him, pushback approved abeam stand B10.", "r": "Позади вас стоит B-747. После него разрешен толчок носом назад напротив стоянки B10."}, {"s": "Taxiway and ground movement", "e": "Pull in to the right; there is an A-320 overtaking you on your left.", "r": "Прижмитесь вправо, вас обгоняет A-320 слева."}, {"s": "Taxiway and ground movement", "e": "Request progressive taxi instructions. (Include step-by-step routing directions (AIM).)", "r": "Просим подробный маршрут по ходу выполнения руления."}, {"s": "Taxiway and ground movement", "e": "We have one passenger missing.", "r": "У нас отсутствует один пассажир."}, {"s": "Taxiway and ground movement", "e": "We wish to delay departure due to passenger baggage identification process.", "r": "Мы хотим отложить вылет из-за процесса идентификации багажа пассажиров."}, {"s": "Taxiway and ground movement", "e": "We are having a problem with a tow bar. We are waiting for another one.", "r": "У нас проблема с буксировочной штангой (водило). Ждем замену."}, {"s": "Taxiway and ground movement", "e": "We are going to be delayed for a while. The tug seems to have broken down.", "r": "У нас будет небольшая задержка. Похоже, тягач вышел из строя."}, {"s": "Taxiway and ground movement", "e": "A large dog has just crossed the TWY ahead of us. Could you send someone to catch it?", "r": "Большая собака только что пересекла рулежную дорожку перед нами. Можете кого-нибудь прислать, чтобы ее поймать?"}, {"s": "Taxiway and ground movement", "e": "Do you need a ladder?", "r": "Вам нужна лестница (стремянка)?"}, {"s": "Taxiway and ground movement", "e": "Revised door-open time 45.", "r": "Скорректированное время открытия дверей: 45 минут."}, {"s": "Taxiway and ground movement", "e": "Could we start up quickly, please? We have live stock in the hold.", "r": "Можем ли мы быстрее начать запуск? У нас живой груз в грузовом отсеке."}, {"s": "Taxiway and ground movement", "e": "Why is our departure delayed?", "r": "Почему наша отправка задерживается?"}, {"s": "Taxiway and ground movement", "e": "Why do I have to expedite taxiing?", "r": "Почему я должен ускорить руление?"}, {"s": "Taxiway and ground movement", "e": "How long is our departure delayed?", "r": "На сколько задерживается наш вылет?"}, {"s": "Taxiway and ground movement", "e": "Delay is not determined for the moment—there seems to be a problem with the generators.", "r": "Задержка пока не определена — похоже, есть проблема с генераторами."}, {"s": "Taxiway and ground movement", "e": "Take the second turn on the right", "r": "На втором повороте направо"}, {"s": "Taxiway and ground movement", "e": "Make next right turn", "r": "На следующем (первом) повороте направо"}, {"s": "Taxiway and ground movement", "e": "We are going to be delayed due to catering (the catering truck has not brought the food).", "r": "Ожидаем задержку из-за недоставки питания на борт."}, {"s": "Taxiway and ground movement", "e": "You will have to wait until the tug pushes him back beyond the next intersection.", "r": "Вам придется подождать пока тягач не отбуксирует его за следующий перекресток."}, {"s": "Taxiway and ground movement", "e": "Approaching holding point RWY 29, request return to stand, brakes are overheating.", "r": "Занимаем предварительный к полосе 29, просим разрешения вернуться на стоянку, тормоза перегреваются."}, {"s": "Taxiway and ground movement", "e": "Clearance void if not off by 35", "r": "Разрешение истекает если не взлетите к 35 минуте"}, {"s": "Runway operations", "e": "Hold short of RWY 02L.", "r": "Остановитесь перед ВПП 02 левая."}, {"s": "Runway operations", "e": "Vacate RWY 16 via high-speed TWY 3 / Main TWY.", "r": "Освободите ВПП 16 через скоростную рулежную дорожку 3 / основную рулежную дорожку."}, {"s": "Runway operations", "e": "Parallel departures now in operation.", "r": "Сейчас действуют параллельные вылеты."}, {"s": "Runway operations", "e": "Due to aggressive RWY operation, departures may be delayed up to 90 min.", "r": "Из-за интенсивной эксплуатации ВПП вылеты могут быть задержаны до 90 минут."}, {"s": "Runway operations", "e": "Disabled aircraft on RWY 23L.", "r": "На ВПП 23L находится неисправное воздушное судно."}, {"s": "Runway operations", "e": "Take the first convenient turn off, then turn right into TWY Bravo.", "r": "Сверните на первую удобную рулежную дорожку, затем поверните направо на РД Браво."}, {"s": "Runway operations", "e": "Stop immediately, I say again stop immediately, there is a vehicle on RWY 26.", "r": "Остановитесь немедленно, повторяю, остановитесь немедленно, на ВПП 26 находится транспортное средство."}, {"s": "Runway operations", "e": "Keep slightly right while taxiing due construction work on left side of the RWY 08R.", "r": "Держитесь немного правее при рулении из-за строительных работ с левой стороны ВПП 08R."}, {"s": "Runway operations", "e": "Single RWY operation.", "r": "В работе одна ВПП."}, {"s": "Runway operations", "e": "TORA (Take-Off Run Available) RWY09L from intersection D 3000m.", "r": "Располагаемая дистанция разбега с ВПП 09 левая от пересечения D составляет 3000 метров."}, {"s": "Runway operations", "e": "Switch off the sequence flashers.", "r": "Выключите бегущие огни."}, {"s": "Runway operations", "e": "Make U-turn RWY 08L, backtrack and vacate via TWY 2.", "r": "Развернитесь на ВПП 08L, рулите с обратным курсом (выруливайте обратно) и освободите через РД 2."}, {"s": "Runway operations", "e": "Cleared for ILS approach RWY 09 left. Sidestep to RWY 09 right.", "r": "Разрешен заход по ИЛС на ВПП 09 левая. Боковой маневр на ВПП 09 правая."}, {"s": "Runway operations", "e": "We left chocks on RWY 02R. Send someone to pick them up.", "r": "Мы оставили колодки на ВПП 02П. Пошлите кого-нибудь забрать их."}, {"s": "Runway operations", "e": "Dim approach lights to 50 per cent.", "r": "Уменьшите яркость посадочных огней до 50 процентов."}, {"s": "Runway operations", "e": "Your time of departure expires at 12:30.", "r": "Ваше время отбытия истекает в 12:30."}, {"s": "Runway operations", "e": "Take off denied / clearance void (USA) if not airborne at 17.", "r": "Взлет запрещается, если не взлетите в 17 минут."}, {"s": "Runway operations", "e": "Why have you delayed our departure?", "r": "Почему вы задержали наш вылет?"}, {"s": "Runway operations", "e": "What is the usable length of RWY 27?", "r": "Какова доступная длина ВПП 27?"}, {"s": "Runway operations", "e": "Request returning to stand, unable to start-up engine.", "r": "Запрашиваем возвращение на стоянку, не можем запустить двигатель."}, {"s": "Runway operations", "e": "Permission for your flight is not granted.", "r": "Разрешение на ваш полет не выдано."}, {"s": "Runway operations", "e": "There is a 55 min delay due to computer failure. Your slot time is 09.45.", "r": "Задержка на 55 минут из-за сбоя компьютера. Ваш слот на 09:45."}, {"s": "Runway operations", "e": "Request departure RWY 08L intersection M.", "r": "Прошу взлет с перекрестка М ВПП 08 левая."}, {"s": "Runway operations", "e": "Take off aborted due to tyre blow out. We slid slightly off the RWY 10.", "r": "Взлет прерван из-за лопнувшей шины. Мы немного съехали с ВПП."}, {"s": "Runway operations", "e": "Stopping, take off abandoned due to engine failure.", "r": "Останавливаемся, взлет прерван из-за отказа двигателя."}, {"s": "Runway operations", "e": "Why did you reject take-off?", "r": "Почему вы прервали взлет?"}, {"s": "Runway operations", "e": "We seem to have a nose gear tyre blow out on landing. Request a tug to tow us to the apron.", "r": "Кажется, на посадке лопнула покрышка на носовой стойке шасси. Запрашиваем тягач для буксировки на перрон."}, {"s": "Runway operations", "e": "We aquaplaned after touchdown and have at least 2 tyres blown out on right main gear.", "r": "После касания произошло гидроглиссирование, и на правой основной стойке шасси лопнули как минимум 2 покрышки."}, {"s": "Runway operations", "e": "Large flock of birds (bird congestion) observed crossing left to right at the upwind end of RWY 24.", "r": "При взлете с ВПП 24 на начальном этапе набора наблюдалась большая стая птиц, пересекавшая слева направо."}, {"s": "Navigation and ATC instructions", "e": "Report your position over AMDAR, which is mandatory (CRP- compulsory reporting point).", "r": "Доложите ваше место над точкой AMDAR, которая является точкой обязательного донесения.", "n": "Waypoint names like AMDAR are pronounced as words, not spelled."}, {"s": "Navigation and ATC instructions", "e": "Offset track 2 miles left is approved.", "r": "Разрешено следовать 2 мили параллельно заданному маршруту."}, {"s": "Navigation and ATC instructions", "e": "Verify your assigned altitude (pilots should check and confirm assigned altitude).", "r": "Проверьте и подтвердите вашу заданную высоту."}, {"s": "Navigation and ATC instructions", "e": "Unable clearance into RVSM airspace, maintain (or descend to, or climb to) FL...", "r": "Нет разрешения на вход в воздушное пространство RVSM, сохраняйте (или снижайтесь, или поднимайтесь до) эшелона…"}, {"s": "Navigation and ATC instructions", "e": "For the time being maintain (remain) FL ............", "r": "Пока оставайтесь на этом эшелоне."}, {"s": "Navigation and ATC instructions", "e": "Level off (at) FL 150.", "r": "Перейдите в горизонтальный полет на эшелоне 150.", "n": "'Level off' is US usage. ICAO: 'Stop climb (descent) at FL150' or 'Maintain FL150'."}, {"s": "Navigation and ATC instructions", "e": "You are released on frequency.............", "r": "Вы переводитесь на частоту............."}, {"s": "Navigation and ATC instructions", "e": "Maintain FL 370 proceed to OGODA, hold north-west, inbound radial 288, all turns right, legs at your discretion.", "r": "Сохраняйте эшелон 370, следуйте в точку OGODA, ждите северо-западнее, на радиале 288, все развороты правые, длина участков на ваше усмотрение."}, {"s": "Navigation and ATC instructions", "e": "Expect radar vector across the final approach course, fly heading 340 for spacing.", "r": "Ожидайте векторение с пересечением посадочного курса, выдерживайте курс 340 для создания интервала."}, {"s": "Navigation and ATC instructions", "e": "You have crossed the final approach course. Turn right immediately heading 240 to join the localizer.", "r": "Вы пересекли посадочный курс. Разворачивайтесь вправо на курс 240 немедленно, чтобы захватить курсовой луч ИЛС."}, {"s": "Navigation and ATC instructions", "e": "Will it suit you to align 5 NM? (Arrival procedure)", "r": "Устроит ли вас спрямление на 5 морских миль?"}, {"s": "Navigation and ATC instructions", "e": "Can you slope down?", "r": "Можете ли вы ускорить снижение?", "n": "Not ICAO phraseology. Use 'Expedite descent' or 'Advise if able to descend…'."}, {"s": "Navigation and ATC instructions", "e": "Do not exceed speed 250 knots (not greater/or less).", "r": "Не превышайте скорость 250 узлов (не больше/или меньше)."}, {"s": "Navigation and ATC instructions", "e": "Make a right-hand orbit for spacing / orbit right for spacing.", "r": "Выполните правую орбиту для создания интервала."}, {"s": "Navigation and ATC instructions", "e": "Turn right 90° for identification.", "r": "Поверните направо на 90° для опознования."}, {"s": "Navigation and ATC instructions", "e": "Maintain present heading until FIR boundary.", "r": "Сохраняйте текущий курс до границы РПИ."}, {"s": "Navigation and ATC instructions", "e": "Reduce to approach (circuit) speed.", "r": "Уменьшите скорость до посадочной (или схемной)."}, {"s": "Navigation and ATC instructions", "e": "Continue / fly RWY heading for 4 min.", "r": "Продолжайте/летите по курсу ВПП в течение 4 минут."}, {"s": "Navigation and ATC instructions", "e": "Resume own navigation.", "r": "Возвращайтесь к самостоятельной навигации."}, {"s": "Navigation and ATC instructions", "e": "Request 10° heading change to avoid build-up.", "r": "Запрашиваем изменение курса на 10°, чтобы обойти грозовое образование."}, {"s": "Navigation and ATC instructions", "e": "Could we have slightly lower level? We are experiencing moderate turbulence at FL 340.", "r": "Можно нам занять эшелон ниже? На эшелоне 340 умеренная турбулентность."}, {"s": "Navigation and ATC instructions", "e": "We have just passed through some severe turbulence. What kind of traffic is there ahead of us?", "r": "Мы только что прошли через сильную турбулентность. Какой самолет впереди нас?"}, {"s": "Navigation and ATC instructions", "e": "It must have been wake turbulence, there is a 747 ahead, although normal separation was provided.", "r": "Это, должно быть, спутный след. Впереди Боинг 747, хотя установленный интервал был соблюден."}, {"s": "Navigation and ATC instructions", "e": "VOR approach is not available due to equipment failure.", "r": "Заход по VOR недоступен из-за отказа оборудования."}, {"s": "Navigation and ATC instructions", "e": "Continue visually or go around.", "r": "Продолжайте визуально или уходите на второй круг."}, {"s": "Navigation and ATC instructions", "e": "Advisory to all concerned.", "r": "Сообщение всем, кого касается."}, {"s": "Navigation and ATC instructions", "e": "Report RWY in sight (ground contact).", "r": "Доложите, как увидите ВПП (или контакт с землей)."}, {"s": "Navigation and ATC instructions", "e": "Keep the plane ahead of you in sight.", "r": "Удерживайте самолет перед вами в поле зрения."}, {"s": "Navigation and ATC instructions", "e": "Glide slope below 300 m is unreliable. You have to make a visual approach RWY 16.", "r": "Глиссада ниже 300 м ненадежна. Вам необходимо выполнить визуальный заход на ВПП 16."}, {"s": "Navigation and ATC instructions", "e": "Confirm your heading and continue further descent to FL 190.", "r": "Подтвердите курс и продолжайте снижение до эшелона 190."}, {"s": "Navigation and ATC instructions", "e": "FL 330 is unavailable.", "r": "Эшелон 330 недоступен."}, {"s": "Navigation and ATC instructions", "e": "Is FL 300 acceptable for you?", "r": "Подходит ли вам эшелон 300?"}, {"s": "Navigation and ATC instructions", "e": "Remain outside the controlled airspace. Expect clearance at 35.", "r": "Оставайтесь вне контролируемого пространства. Ожидайте разрешение в 35 минут."}, {"s": "Navigation and ATC instructions", "e": "Turn left heading 160°. It will take you to LT, 25 miles to run.", "r": "Развернитесь влево, курс 160°. Это выведет вас на точку LT, удаление 25 миль."}, {"s": "Navigation and ATC instructions", "e": "Leveling FL 150.", "r": "Сохраняю эшелон 150.", "n": "ICAO standard: 'Maintaining FL150' or, at level-off, 'Reaching FL150'."}, {"s": "Navigation and ATC instructions", "e": "Do not stray away.", "r": "Не отклоняйтесь от трассы.", "n": "Not ICAO phraseology. Use 'Maintain the route' or 'Report back on route'."}, {"s": "Navigation and ATC instructions", "e": "FL 330 is not available due to restrictions. Alternatives are FL 350 and FL 310. Advise your decision.", "r": "Эшелон 330 недоступен из-за ограничений. Доступны эшелоны 350 и 310. Сообщите ваше решение."}, {"s": "Navigation and ATC instructions", "e": "Overfly the hazardous area at flight level 390 not lower.", "r": "Перелетайте опасную зону на эшелоне 390, не ниже."}, {"s": "Navigation and ATC instructions", "e": "Request level change due to severe turbulence (icing).", "r": "Запрашиваем смену эшелона из-за сильной турбулентности (обледенения)."}, {"s": "Navigation and ATC instructions", "e": "Request level change due to clear air turbulence.", "r": "Запрашиваем смену эшелона из-за турбулентности в ясном небе."}, {"s": "Navigation and ATC instructions", "e": "There is severe turbulence at FL 300. Request FL 250 instead of 300.", "r": "На эшелоне FL 300 сильная турбулентность. Запрашиваем FL 250 вместо FL 300."}, {"s": "Navigation and ATC instructions", "e": "Request a left turn out.", "r": "Запрашиваем левый разворот после взлета."}, {"s": "Navigation and ATC instructions", "e": "Are there any restrictions on our heading?", "r": "Есть ли ограничения на наш курс?"}, {"s": "Navigation and ATC instructions", "e": "What is the lowest safe level?", "r": "Каков минимальный безопасный эшелон?"}, {"s": "Navigation and ATC instructions", "e": "Cleared to avoid weather only within the route (гроза).", "r": "Разрешается обходить грозу только в пределах маршрута."}, {"s": "Navigation and ATC instructions", "e": "What heading must I set to come back on track?", "r": "Какой курс мне установить, чтобы вернуться на маршрут?"}, {"s": "Navigation and ATC instructions", "e": "Penetrating top of clouds.", "r": "Входим в верхнюю кромку облачности."}, {"s": "Navigation and ATC instructions", "e": "Coordinate transfer of control with ATC units.", "r": "Согласуйте передачу управления с подразделениями УВД."}, {"s": "Navigation and ATC instructions", "e": "For your information, drone (UAV - Unmanned Aerial Vehicle) in the vicinity of SR, radius 10 km, height 350 m from 4:00 till 15:00.", "r": "Для информации: в районе SR дрон (БПЛА), радиус 10 км, высота 350 м, с 4:00 до 15:00."}, {"s": "Navigation and ATC instructions", "e": "For your information, paragliding in the vicinity of Yusufxona/Beldersay, height 30 m from 4:00 till 15:00.", "r": "Для информации: в районе Yusufxona/Beldersay проходят полеты на парапланах, высота 30 м, с 4:00 до 15:00."}, {"s": "Navigation and ATC instructions", "e": "For your information. Light firing available.", "r": "Для вашей информации, возможна стрельба из легкого вида оружия."}, {"s": "Navigation and ATC instructions", "e": "Why are you losing altitude so rapidly?", "r": "Почему вы теряете высоту так стремительно?"}, {"s": "Navigation and ATC instructions", "e": "Why didn’t you report passing MIRZO?", "r": "Почему не доложили прохождение MIRZO?"}, {"s": "Navigation and ATC instructions", "e": "Spell position where we shall proceed to.", "r": "Назовите по буквам точку (пункт), куда мы должны следовать.", "n": "Spell a point only when asked or when the name is unclear. Five-letter waypoint names are normally said as one word."}, {"s": "Traffic, separation, TCAS", "e": "Traffic crossing left to right at FL 300.", "r": "Борт пересекает слева направо на эшелоне 300."}, {"s": "Traffic, separation, TCAS", "e": "Traffic same direction 32 miles behind you, moving faster. FL 120.", "r": "Попутный борт на 32 мили позади вас, движется быстрее. Эшелон 120."}, {"s": "Traffic, separation, TCAS", "e": "Longitudinal separation will be 16 miles.", "r": "Продольное эшелонирование составит 16 миль."}, {"s": "Traffic, separation, TCAS", "e": "Lateral separation will be 11 miles.", "r": "Боковое эшелонирование составит 11 миль."}, {"s": "Traffic, separation, TCAS", "e": "Traffic will be climbing through your level, distance 20 miles.", "r": "Борт будет набирать высоту через ваш эшелон, расстояние 20 миль."}, {"s": "Traffic, separation, TCAS", "e": "Traffic 12 o'clock.", "r": "Борт прямо по курсу (12 часов)."}, {"s": "Traffic, separation, TCAS", "e": "Traffic 6 o'clock.", "r": "Борт сзади (6 часов)."}, {"s": "Traffic, separation, TCAS", "e": "Traffic 10 o’clock crossing left to right, height unknown. If not in sight/ negative contact turn left heading 270.", "r": "Борт на 10 часов (60 градусов слева) пересекает слева направо, высота неизвестна. Если борт не наблюдаете, поверните влево курсом 270.", "n": "10 o'clock = 60° left of the nose (each hour = 30°)."}, {"s": "Traffic, separation, TCAS", "e": "Unknown traffic, opposite direction 11 o'clock, 9 miles FL 150.", "r": "Неизвестное воздушное движение, встречное направление, на 11 часов, расстояние 9 миль, эшелон 150."}, {"s": "Traffic, separation, TCAS", "e": "Lose time to arrive at 50.", "r": "Затяните время, чтобы прибыть в точку в 50 минут."}, {"s": "Traffic, separation, TCAS", "e": "Avoiding action: a left turn of 30 degrees will take you well clear.", "r": "Маневр расхождения: левый разворот на 30 градусов обеспечит расхождение."}, {"s": "Traffic, separation, TCAS", "e": "Reduce speed for the benefit of preceding aircraft.", "r": "Уменьшите скорость для создания благоприятных условий следующему впереди самолету."}, {"s": "Traffic, separation, TCAS", "e": "Reduced separation. Cleared to land after the preceding aircraft.", "r": "Сокращенный интервал. Разрешена посадка за предыдущим самолетом."}, {"s": "Traffic, separation, TCAS", "e": "Where are we identified?", "r": "Где мы идентифицированы?"}, {"s": "Traffic, separation, TCAS", "e": "We have just had to dive to avoid colliding with converging traffic. It was a very close thing. I'll check if the passengers are OK.", "r": "Мы только что были вынуждены уйти в снижение (поднырнуть), чтобы избежать столкновения с сближающимся бортом. Это было очень близко. Проверю состояние пассажиров."}, {"s": "Traffic, separation, TCAS", "e": "Unable to comply, TCAS resolution advisory.", "r": "Не можем выполнить, рекомендации TCAS по разрешению угрозы столкновения.", "n": "ICAO standard short form: 'UNABLE, TCAS RA'."}, {"s": "Traffic, separation, TCAS", "e": "TCAS RA (resolution advisory). Clear of traffic. Request climb to FL 150.", "r": "Набрал высоту по TCAS (или снизился), с бортом разошлись. Прошу вернуться на эшелон 150."}, {"s": "Traffic, separation, TCAS", "e": "Now clear of traffic. Resume own navigation.", "r": "С бортом разошлись. Возвращайтесь к самостоятельной навигации."}, {"s": "Traffic, separation, TCAS", "e": "Maintain 10 min separation from Airbus 320.", "r": "Сохраняйте 10 минутный интервал от Airbus 320."}, {"s": "Traffic, separation, TCAS", "e": "We had a near miss with a low-flying fighter.", "r": "У нас было опасное сближение с истребителем, летящим на малой высоте."}, {"s": "Traffic, separation, TCAS", "e": "We have had a dangerous near miss with converging traffic. The safety separation has not been provided. We intend to file an air miss report.", "r": "Произошло опасное сближение с другим бортом. Безопасный интервал не был обеспечен. Планируем подать донесение об опасном сближении."}, {"s": "Traffic, separation, TCAS", "e": "We were forced to dive to avoid colliding with converging traffic.", "r": "Мы были вынуждены уйти в резкое снижение, чтобы избежать столкновения с встречным бортом."}, {"s": "Traffic, separation, TCAS", "e": "An aircraft has just overtaken us. There was no necessary separation.", "r": "Борт только что обогнал нас. Не было необходимого интервала."}, {"s": "Traffic, separation, TCAS", "e": "Could you see identification and type of near-missing aircraft?", "r": "Увидели ли вы идентификацию и тип сближающегося борта?"}, {"s": "Approach and landing", "e": "I'll keep you advised.", "r": "Я буду держать вас в курсе."}, {"s": "Approach and landing", "e": "You are steady on the glide path.", "r": "Вы стабилизировались на глиссаде."}, {"s": "Approach and landing", "e": "Samarkand cannot be used as alternate.", "r": "Самарканд не может использоваться в качестве запасного аэродрома."}, {"s": "Approach and landing", "e": "Why are we directed to alternate?", "r": "Почему нас направляют на запасной?"}, {"s": "Approach and landing", "e": "Do you expect any difficulties on landing?", "r": "Ожидаете ли вы какие-либо трудности при посадке?"}, {"s": "Approach and landing", "e": "Are you familiar with NDB/ILS/VOR DME approach to RWY 08L?", "r": "Вы знакомы с заходом на посадку на ВПП 08L по NDB/ILS/VOR DME?"}, {"s": "Approach and landing", "e": "In case of going around, climb on RWY heading to altitude 1300 ft.", "r": "В случае ухода на второй круг выполняйте набор по курсу ВПП до высоты 1300 футов."}, {"s": "Approach and landing", "e": "Cleared low pass, minimum descent height 165 ft, after passing Tower climb on RWY heading 4000 ft, at 660 ft change to RADAR 119.4.", "r": "Разрешен низкий пролет, минимальная высота снижения 165 футов, после пролета вышки наберите высоту по курсу ВПП 4000 футов, на 660 футах работайте с Подходом на 119.4."}, {"s": "Approach and landing", "e": "You are landing on the wrong RWY.", "r": "Вы заходите на неправильную ВПП."}, {"s": "Approach and landing", "e": "Circle to land.", "r": "Заход с круга."}, {"s": "Approach and landing", "e": "Request touch and go.", "r": "Запрашиваем посадку с последующим взлетом."}, {"s": "Approach and landing", "e": "When shall we expect approach clearance?", "r": "Когда нам ожидать разрешение на заход?"}, {"s": "Approach and landing", "e": "Request RWY condition", "r": "Каково состояние ВПП?"}, {"s": "Approach and landing", "e": "Established on ILS, RWY 08L in sight.", "r": "На курсовом маяке, ВПП 08L в поле зрения."}, {"s": "Approach and landing", "e": "At what altitude do we have to intercept the glide slope?", "r": "На какой высоте мы должны войти в глиссаду?"}, {"s": "Approach and landing", "e": "Unable to land due to high approach.", "r": "Не можем посадить самолет из-за высокого захода."}, {"s": "Approach and landing", "e": "Belly landing (Wheels-up landing; Landing with retracted wheels).", "r": "Посадка \"на брюхо\" (с убранными шасси)."}, {"s": "Approach and landing", "e": "Show (use, switch on, turn up) the approach lights on 100 per cent.", "r": "Установите яркость посадочных огней на 100 процентов."}, {"s": "Approach and landing", "e": "Go around, I say again go around, the weather is below minima.", "r": "Уходите на второй круг, повторяю, уходите на второй круг, погода ниже минимума."}, {"s": "Approach and landing", "e": "Report the reason for going around.", "r": "Сообщите причину ухода на второй круг."}, {"s": "Approach and landing", "e": "Make a missed approach procedure.", "r": "Выполните процедуру ухода на второй круг."}, {"s": "Approach and landing", "e": "You will not hit RWY 18 from your present position.", "r": "Вы не попадете на ВПП 18 с вашего текущего положения."}, {"s": "Approach and landing", "e": "ILS localizer is inoperative due (to) maintenance work.", "r": "Система ИЛС не работает из-за ремонтных работ."}, {"s": "Approach and landing", "e": "Reduce your speed to avoid holding.", "r": "Уменьшите скорость, чтобы избежать зоны ожидания."}, {"s": "Approach and landing", "e": "Due to traffic congestion make one right hand orbit in your present position and leave on heading 180.", "r": "Из-за большого скопления бортов выполните вираж вправо с вашего текущего местоположения и покиньте курсом 180."}, {"s": "Approach and landing", "e": "Blink your landing lights.", "r": "Помигайте вашими посадочными огнями."}, {"s": "Emergencies and alerts", "e": "Your aircraft engine is trailing smoke.", "r": "От двигателя вашего самолета идет дым."}, {"s": "Emergencies and alerts", "e": "Execute instructions immediately upon receipt.", "r": "Выполняйте указания сразу после получения."}, {"s": "Emergencies and alerts", "e": "Left engine is on fire. Request radar vectors for backcourse landing.", "r": "Левый двигатель в огне. Прошу векторение на обратный заход."}, {"s": "Emergencies and alerts", "e": "Your company has informed us you may have a bomb on board.", "r": "Ваша авиакомпания сообщила нам, что у вас на борту может быть бомба."}, {"s": "Emergencies and alerts", "e": "Unable RVSM due equipment.", "r": "Выдерживать RVSM не могу из-за неисправности оборудования."}, {"s": "Emergencies and alerts", "e": "Negative RVSM state aircraft.", "r": "Самолет государственного воздушного судна без допуска к RVSM."}, {"s": "Emergencies and alerts", "e": "Left engine is losing power.", "r": "Левый двигатель теряет мощность."}, {"s": "Emergencies and alerts", "e": "Smoke of unknown origin in passengers' compartment.", "r": "Дым неизвестного происхождения в пассажирском салоне."}, {"s": "Emergencies and alerts", "e": "We are low on fuel (short of fuel). Is it possible to make a straight-in approach?", "r": "У нас мало топлива. Возможен ли прямой заход на посадку?"}, {"s": "Emergencies and alerts", "e": "We have engine failure, have to make forced landing. Where shall we dump fuel?", "r": "У нас отказ двигателя, вынуждены совершить аварийную посадку. Где можно слить топливо?"}, {"s": "Emergencies and alerts", "e": "We have severe fuel leak, have to return to base.", "r": "У нас сильная утечка топлива, вынуждены вернуться на базу."}, {"s": "Emergencies and alerts", "e": "Mayday, Mayday, Mayday, Tashkent Tower, UZB 120 have intercepted Mayday from Lufthansa 8390, engine failure forced landing at your aerodrome. 8 miles west of TKT VOR FL 250 descending heading 120.", "r": "Мэйдэй, Мэйдэй, Мэйдэй, Ташкент Вышка, UZB 120 перехватил сигнал бедствия от Lufthansa 8390, отказ двигателя, аварийная посадка на вашем аэродроме. 8 миль к западу от TKT VOR, эшелон 250, снижается, курс 120."}, {"s": "Emergencies and alerts", "e": "Request emergency landing, the cabin is decompressed (due to depressurization).", "r": "Запрашиваем аварийную посадку, разгерметизация кабины."}, {"s": "Emergencies and alerts", "e": "Unable to extinguish fire, ditching.", "r": "Не можем потушить пожар, вынуждены сесть на воду (приводняемся)."}, {"s": "Emergencies and alerts", "e": "We have fire in the rear (forward) toilets, descending FL 310, request emergency landing.", "r": "Пожар в заднем (переднем) туалете, снижаемся с эшелона FL 310, запрашиваем аварийную посадку."}, {"s": "Emergencies and alerts", "e": "Engine No.1 has failed at take-off. Engine is dead (has failed).", "r": "Отказ двигателя №1 при взлете."}, {"s": "Emergencies and alerts", "e": "We need a fire brigade (guard) upon (on; by) arrival.", "r": "Нам нужна пожарная команда по прибытии."}, {"s": "Emergencies and alerts", "e": "Bird has struck left engine.", "r": "Птица попала в левый двигатель."}, {"s": "Emergencies and alerts", "e": "We are forced by armed men to a new destination.", "r": "Вооруженные люди заставляют нас лететь в другой пункт назначения."}, {"s": "Emergencies and alerts", "e": "Mayday, Mayday, Mayday, UZB 767 engine is burning, forced landing, unable to extinguish fire.", "r": "Майдей, Майдей, Майдей, UZB 767, горит двигатель, вынужденная посадка, пожар не можем потушить."}, {"s": "Emergencies and alerts", "e": "Activating escape slides / chutes, request emergency services.", "r": "Активируем аварийные трапы, запрашиваем экстренные службы."}, {"s": "Emergencies and alerts", "e": "Declare emergency on board.", "r": "Сообщаю об аварийной ситуации на борту."}, {"s": "Emergencies and alerts", "e": "Fire extinguished, cancel distress.", "r": "Пожар потушен, отменяем сигнал бедствия."}, {"s": "Emergencies and alerts", "e": "Unable to control pressurization, cabin altitude is rising fast, request immediate descent to FL 100.", "r": "Не можем контролировать герметизацию, высота в кабине быстро увеличивается, запрашиваем немедленное снижение до эшелона 100."}, {"s": "Emergencies and alerts", "e": "We have lost all electrical power, except the emergency circuit. Request to divert immediately to Newbridge.", "r": "У нас полное обесточивание за исключением аварийной цепи. Прошу немедленную посадку в Ньюбридже."}, {"s": "Emergencies and alerts", "e": "We need urgent assistance.", "r": "Нам нужна срочная помощь."}, {"s": "Emergencies and alerts", "e": "Emergency services alerted.", "r": "Аварийные службы оповещены."}, {"s": "Emergencies and alerts", "e": "We want to send a message to your Government. Are you ready to copy?", "r": "Мы хотим передать сообщение вашему правительству. Вы готовы записыват    .replace(/\balpha\b/g,'alfa').replace(/\bjuliett\b/g,'juliet').replace(/\bpob\b/g,'persons on board')

   .replace(/(\d)([a-z])/g,'$1 $2').replace(/([a-z])(\d)/g,'$1 $2')
   .replace(/-/g,' ').replace(/[,;:!?]|\.(?!\d)/g,' zzsep ').replace(/[^a-z0-9.\s]/g,' ');

        if(q&&q.num&&!q.big&&!q.t.includes('.')){q.t+='.'+d.replace('.','');continue}
        out.push({t:'.'+d,num:true});continue}
      if(p&&p.tens&&/^\d$/.test(d)){p.t=String(+p.t+ +d);p.tens=false;continue}
      if(p&&p.num&&!p.big&&/^\d+$/.test(d)){p.t+=d;continue}
      out.push({t:d,num:true});continue}
    out.push({t:t==='zzsep'?'':t});
  }
  return ' '+out.map(o=>o.t).filter(Boolean).join(' ')+' ';
}

/* taxi graph */
function buildGraph(L){

const planCache={};

const PTS=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
/* clean aerodrome chart: runways, taxiways, apron, stands; signs only where they matter */

let RD={sc:null,i:0,log:[],tries:0,res:[],fb:'',done:false};
const csText=()=>S.cs.name.trim()+' '+S.cs.num.trim();
function V(){const d=S.ads[S.dep]||S.ads[0],a=S.ads[S.dst]||S.ads[1]||d,h=r=>(parseInt(r)||36)*10,w=x=>pad(((x+719)%360)+1,3);let P={};try{P=groundPlan(d)}catch(e){}return{CS:csText(),DEP:d.n,DST:a.n,DR:d.r,AR:a.r,DW1:w(h(d.r)-20),DW2:w(h(d.r)-10),AW:w(h(a.r)+10),STD:P.std||'4',TXR:P.txr||'the apron',FACE:P.facing||'west',HPS:P.hpn?P.hpn+' ':''}}
const fill=t=>{const v=V();return t.replace(/\{(\w+)\}/g,(m,k)=>v[k]!==undefined?v[k]:m)};
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const nameRe=n=>reEsc(norm(n).trim()).replace(/\s+/g,'\\s+');
function rwyRe(r){const m=String(r).toUpperCase().match(/^(\d{1,2})([LRC])?$/);if(!m)return 'runway';const n=+m[1];return 'runway '+(n<10?'0?'+n:n)+(m[2]?' '+{L:'left',R:'right',C:'centre'}[m[2]]:'')+'\\b'}
function fillRe(p){const d=S.ads[S.dep]||S.ads[0],a=S.ads[S.dst]||S.ads[1]||d;let P={};try{P=groundPlan(d)}catch(e){}p=p.replace(/\{HPX\}/g,P.hp&&P.hp.n?nameRx(P.hp.n):'').replace(/\{TXRX\}/g,P.txrx||'').replace(/\{STDX\}/g,reEsc(norm(String(P.std||'4')).trim())).replace(/\{FACEX\}/g,P.facing||'west');return p.replace(/\{DRX\}/g,rwyRe(d.r)).replace(/\{ARX\}/g,rwyRe(a.r)).replace(/\{DEPN\}/g,nameRe(d.n)).replace(/\{DSTN\}/g,nameRe(a.n))}
const showAtc=t=>S.spoken?spoken(fill(t)):fill(t);
function csRe(){return new RegExp(norm(csText()).trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'\\b')}
function checkTx(step,raw){
  const n=norm(raw),miss=[],warn=[];
  if(!csRe().test(n)){const first=norm(S.cs.name).trim();miss.push(n.includes(first)?'Complete call sign "'+csText()+'" (it was cut off)':'Your call sign "'+csText()+'"')}
  step.need.forEach(([p,l])=>{const pp=/^\d+$/.test(p)?'\\b'+p+'\\b':p;if(!new RegExp(fillRe(pp)).test(n))miss.push(fill(l))});
  if(/\b(three|four|five|nine)\b/i.test(raw))warn.push('ICAO digits: tree, fower, fife, niner.');
  if(/\b(ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\b/i.test(raw))warn.push('Say numbers digit by digit (whole thousands and hundreds excepted).');
  if(/\b(good ?bye|good (morning|afternoon|evening|day)|thank(s| you)|bye)\b/i.test(raw))warn.push('No greetings or thanks on frequency.');
  if(/\b(okay|ok|yes)\b/i.test(raw))warn.push('Use standard words: Affirm, Negative, Roger, Wilco.');
  return {miss,warn};
}

      <div class="row"><button class="btn pri" id="again">Fly it again</button><button class="btn" id="back">${RD.from==='emergency'?'Choose another emergency':'Choose another flight'}</button></div></div></div>`;
    $('#again').onclick=()=>{RD={sc,i:0,log:[],tries:0,res:[],fb:'',done:false,st:sc.steps[0].st,from:RD.from};vRadio();speakStep()};
    $('#back').onclick=leave;
    scrollLog();return;
  }
  const step=sc.steps[RD.i];
  if(step.st)RD.st=step.st;
  const atcTxt=step.atc?showAtc(step.atc):'';

/* ---------- weather: decode ---------- */
const WXD={MI:'shallow',BC:'patches of',PR:'partial',DR:'low drifting',BL:'blowing',DZ:'drizzle',RA:'rain',SN:'snow',SG:'snow grains',PL:'ice pellets',GR:'hail',GS:'small hail',IC:'ice crystals',UP:'unknown precipitation',BR:'mist',FG:'fog',FU:'smoke',VA:'volcanic ash',DU:'widespread dust',SA:'sand',HZ:'haze',PO:'dust/sand whirls',SQ:'squalls',FC:'funnel cloud',SS:'sandstorm',DS:'duststorm'};

const dh=(d,h,m)=>'day '+d+' '+h+':'+(m||'00')+' UTC';

function decode(str){
  const G=str.trim().toUpperCase().replace(/=+$/,'').split(/\s+/).filter(Boolean);
  const out=[];let sec='main',isTaf=G[0]==='TAF',seenId=false,seenTime=false,rmk=false,prev='',seenValid=false;
  for(const g of G){let c='other',t='Not recognised',m;
    if(rmk){out.push({g,c:'rmk',t:'Remark (national use)',sec:'rmk'});continue}
    if(g==='METAR'||g==='SPECI'||g==='TAF'){c='type';t=g==='TAF'?'Terminal Aerodrome Forecast':g==='SPECI'?'Special weather report':'Routine aerodrome weather report'}
    else if(g==='AMD'){c='type';t='Amended forecast'}else if(g==='COR'){c='type';t='Corrected report'}else if(g==='AUTO'){c='type';t='Fully automated observation'}else if(g==='NIL'){c='type';t='Missing report'}

    else if(g==='BECMG'){c='change';sec='trend';t='Becoming: gradual, permanent change'}

const tf=v=>(v<0?'M':'')+pad(Math.abs(v));

function condGroups(kind){const x=wxSet(kind),w=wGroup(kind);return [w.g,...(x.cav?['CAVOK']:[x.vis,...x.wx,...x.cl])]}

function tafChanges(dec){

const HQ_M=[
 {q:'the observation time',f:x=>x.c==='time'},{q:'the surface wind',f:x=>x.c==='wind'&&x.sec==='main'},{q:'the wind gusts',f:x=>x.c==='wind'&&/G\d/.test(x.g)},
 {q:'the variation in wind direction',f:x=>x.c==='windvar'},{q:'the prevailing visibility',f:x=>(x.c==='vis'||x.c==='cavok')&&x.sec==='main'},{q:'the runway visual range',f:x=>x.c==='rvr'},
 {q:'the present weather',f:x=>x.c==='wx'&&x.sec==='main'},{q:'the lowest cloud layer',f:(x,a)=>x===a.find(y=>y.sec==='main'&&(y.c==='cloud'||y.c==='vv'))},
 {q:'the ceiling (lowest broken or overcast layer)',f:(x,a)=>x===a.find(y=>y.sec==='main'&&/^(BKN|OVC|VV)/.test(y.g))},{q:'the cumulonimbus or towering cumulus',f:x=>x.c==='cloud'&&/(CB|TCU)$/.test(x.g)&&x.sec==='main'},
 {q:'the dew point',f:x=>x.c==='temp'},{q:'the QNH',f:x=>x.c==='press'},{q:'the trend forecast indicator',f:x=>x.c==='trend'||x.c==='change'},{q:'the recent weather',f:x=>x.c==='recent'},{q:'the wind shear warning',f:x=>x.g==='WS'}];
const HQ_T=[
 {q:'the issue time',f:x=>x.c==='time'},{q:'the validity period',f:x=>x.c==='valid'},{q:'the base forecast wind',f:x=>x.c==='wind'&&x.sec==='main'},{q:'the base forecast visibility',f:x=>(x.c==='vis'||x.c==='cavok')&&x.sec==='main'},
 {q:'the start of a gradual change',f:x=>x.g==='BECMG'},{q:'a temporary change indicator',f:x=>x.g==='TEMPO'},{q:'the probability group',f:x=>x.c==='prob'},{q:'the "from" group (complete change)',f:x=>x.c==='fm'},
 {q:'the forecast maximum temperature',f:x=>x.c==='tx'&&x.g[1]==='X'},{q:'a cumulonimbus forecast',f:x=>x.c==='cloud'&&/CB$/.test(x.g)}];
let WX={mode:'hunt',kind:'metar',cur:null,q:null,pick:null,score:[0,0],input:''};
function wxNew(){
  const gen=()=>WX.kind==='taf'?genTaf():genMetar();WX.pick=null;
  if(WX.mode==='hunt'){let tries=0;do{WX.cur=gen();WX.dec=decode(WX.cur.txt);const qs=(WX.kind==='taf'?HQ_T:HQ_M).filter(q=>WX.dec.some(x=>q.f(x,WX.dec)));WX.q=pick(qs)}while(!WX.q&&tries++<10)}
  else if(WX.mode==='quiz'){WX.cur=gen();WX.dec=decode(WX.cur.txt);const good=['wind','windvar','vis','rvr','wx','cloud','vv','temp','press','cavok','valid','period','change','prob','fm','tx','trend','recent','nocloud'];
    const c=pick(WX.dec.filter(x=>good.includes(x.c)));let pool=[];for(let i=0;i<8;i++)pool.push(...decode(gen().txt).filter(y=>y.c===c.c&&y.t!==c.t).map(y=>y.t));
    pool=uniq(pool);if(pool.length<3)pool=uniq([...pool,...WX.dec.filter(y=>y.t!==c.t&&y.c!=='type').map(y=>y.t)]);
    WX.q={item:c,opts:shuffle([c.t,...shuffle(pool).slice(0,3)])}}
  else if(WX.mode==='pilot'){WX.kind='metar';WX.cur=genMetar();WX.dec=decode(WX.cur.txt);WX.q=pilotQ(WX.cur,WX.dec)}
  else if(WX.mode==='taf'){let t=0;do{WX.cur=genTaf();WX.dec=decode(WX.cur.txt);WX.ch=tafChanges(WX.dec)}while(WX.ch.length<3&&t++<10);
    const cand=WX.ch.slice(1).filter(c=>c.when&&c.items.length);const c=pick(cand);const sum=x=>x.items.join('; ');
    WX.q={text:'Which conditions does the forecast give '+c.when+' ('+c.kind+')?',opts:shuffle(uniq([sum(c),...WX.ch.filter(o=>o!==c&&o.items.length).map(sum)])).slice(0,4),a:sum(c)};if(!WX.q.opts.includes(WX.q.a))WX.q.opts[0]=WX.q.a;WX.q.opts=shuffle(WX.q.opts)}
}
function pilotQ(m,dec){
  const main=dec.filter(x=>x.sec==='main');const qs=[];
  const ceil=main.filter(x=>/^(BKN|OVC|VV)\d{3}/.test(x.g)).map(x=>+x.g.match(/\d{3}/)[0]*100);
  const low=main.filter(x=>/^(FEW|SCT)\d{3}/.test(x.g)).map(x=>+x.g.match(/\d{3}/)[0]*100);
  const cv=ceil.length?Math.min(...ceil):null;
  const opt=a=>a.map(v=>typeof v==='number'?v.toLocaleString('en-US')+' ft':v);
  {const a=cv===null?'No ceiling':cv.toLocaleString('en-US')+' ft';const d=uniq([a,...opt([...low,cv?cv*10:5000,cv?cv+500:1500,cv?Math.max(100,cv/2):800]),'No ceiling']).filter(v=>v!=='0 ft');
   qs.push({text:'What is the ceiling?',a,opts:shuffle(uniq([a,...shuffle(d.filter(x=>x!==a)).slice(0,3)])),why:'Ceiling = height of the lowest layer that is broken (BKN), overcast (OVC) or obscured (VV). FEW and SCT layers are not a ceiling.'})}
  if(m.w.d&&m.w.s>=5){const r=pick(m.rw),rh=parseInt(r)*10,diff=(m.w.d-rh)*Math.PI/180,xw=Math.round(Math.abs(Math.sin(diff))*m.w.s),hw=Math.round(Math.cos(diff)*m.w.s);
    const a=xw+' kt';qs.push({text:'Runway '+r+' (heading '+pad(rh,3)+'°): what is the crosswind component (mean wind)?',a,opts:shuffle(uniq([a,m.w.s+' kt',Math.round(m.w.s/2)+' kt',(xw+6)+' kt',Math.max(0,xw-4)+' kt']).slice(0,4).concat([]).filter((v,i,arr)=>arr.indexOf(v)===i)),why:'Crosswind = wind speed × sin(angle between wind and runway). Here '+m.w.s+' kt × sin '+Math.abs(Math.round(((m.w.d-rh+540)%360)-180))+'°.'});
    const ha=(hw>=0?'Headwind ':'Tailwind ')+Math.abs(hw)+' kt';qs.push({text:'Runway '+r+': head- or tailwind component?',a:ha,opts:shuffle(uniq([ha,(hw>=0?'Tailwind ':'Headwind ')+Math.abs(hw)+' kt',(hw>=0?'Headwind ':'Tailwind ')+m.w.s+' kt','No along-runway component'])),why:'Headwind = wind speed × cos(angle). A negative result means tailwind.'})}
  const tg=main.find(x=>x.c==='temp');if(tg){const mm=tg.g.match(/^(M?\d{2})\/(M?\d{2})/);if(mm){const sp=tmp(mm[1])-tmp(mm[2]);const a=sp+' °C';qs.push({text:'What is the temperature / dew point spread?',a,opts:shuffle(uniq([a,(sp+2)+' °C',Math.abs(tmp(mm[1])+tmp(mm[2]))+' °C',Math.max(0,sp-3)+' °C',(sp+5)+' °C'])).slice(0,4),why:'Spread = temperature − dew point. A spread of 0–2 °C warns of fog or mist.'})}}
  const vg=main.find(x=>x.c==='vis'||x.c==='cavok');const vis=vg?(vg.c==='cavok'?10000:+vg.g.slice(0,4)):10000;
  const mv=pick([550,800,1200,1600]),mc=pick([200,250,400]),ok=vis>=mv&&(cv===null||cv>=mc);
  qs.push({text:'Your minima: visibility '+mv+' m, ceiling '+mc+' ft. Is the reported weather at or above minima?',a:ok?'Yes, at or above minima':'No, below minima',opts:['Yes, at or above minima','No, below minima'],why:'Visibility '+vis.toLocaleString('en-US')+' m, ceiling '+(cv===null?'none':cv+' ft')+'. Both must meet the minima.'});
  const q=pick(qs);if(!q.opts.includes(q.a))q.opts[0]=q.a;return q;
}

     <p class="muted" style="font-size:.85rem">METAR order: type · aerodrome · time · wind · visibility · RVR · weather · cloud · temperature/dew point · QNH · supplementary · trend. Grey rows are trend or forecast changes.</p></div>`;

let MT={set:'Standard words',pairs:[],L:[],R:[],sel:null,done:[],err:0,t0:0,fin:0};
