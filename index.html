<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ICAO RT Trainer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#13202A">
<meta name="description" content="Aviation English radiotelephony trainer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: aeronautical-chart palette; modules presented as flight progress strips; one centered column */
:root{
  --bg:#E8EDF0; --surface:#FAFBFC; --sunk:#DEE5EA; --ink:#13202A; --muted:#556773; --line:#C6D1D8;
  --accent:#A2266E; --blue:#1E5C8D;
  --dep:#D4E4F2; --arr:#F1E4C3; --misc:#E2DAF0; --wx:#D7EBDF;
  --grass:#CBD9BE; --grass2:#C0D0B2; --conc:#D6DBDD; --term:#8E9AA3; --twrwin:#BFE3F2; --twyc:#5E676E; --asph:#3F474E; --mark:#F5F7F8; --yel:#E3B505; --parked:#9AA4AB; --chart:#EEF1E9; --terr:#BFAE8C; --terr2:#A89470; --sky1:#B8D3EC; --sky2:#EAF2F8; --cloud:#FFFFFF;
  --strip:#D3E0C6; --shld:#8A949B;
  --fbg:#ECEDEF; --fpave:#2F3237; --fyel:#E2A500; --fterm:#B9BCC0; --ftermb:#8E9297; --fink:#3A3D42;
  --scene:#E2EAE0; --sky:#E4EEF6; --rwy:#48525A; --rwym:#F4F6F7; --twy:#A3AFB6; --apron:#CDD5DA; --tr:#C27200; --holdl:#D9A800; --scope:#06140D; --scopeg:#45D985;
  --good:#28744A; --good-bg:#DDEFE3; --bad:#B42318; --bad-bg:#F7E1DD; --warn:#9A5F0E; --warn-bg:#F5EAD3;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fbg:#171B1F; --fpave:#353A40; --fyel:#D49B05; --fterm:#4B5057; --ftermb:#646A72; --fink:#D9DDE1;
  --strip:#1C2D21; --shld:#2E373E;
  --grass:#16241A; --grass2:#1B2B1F; --conc:#29323A; --term:#46525C; --twrwin:#5D8FA6; --twyc:#30393F; --asph:#20262C; --mark:#C9D1D6; --yel:#C9A20E; --parked:#56626B; --chart:#121A16; --terr:#3B3426; --terr2:#4A4130; --sky1:#0C1F33; --sky2:#1A2B3C; --cloud:#3A4A58;
  --scene:#13211A; --sky:#0F1B26; --rwy:#2E373E; --rwym:#C7D0D6; --twy:#3B4851; --apron:#22303A; --tr:#F2A93A; --holdl:#E8C23A;
  --comb:#1F2F3B; --comf:#E1E9EE;
  --bg:#0D151B; --surface:#14202A; --sunk:#0F1A22; --ink:#E1E9EE; --muted:#8EA1AE; --line:#273845;
  --accent:#E46FAF; --blue:#78B5E6;
  --dep:#1A2E40; --arr:#3A3019; --misc:#2B2540; --wx:#18322A;
  --good:#5CC38B; --good-bg:#14301F; --bad:#F1806F; --bad-bg:#3A1C19; --warn:#E5B158; --warn-bg:#382B14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --fbg:#171B1F; --fpave:#353A40; --fyel:#D49B05; --fterm:#4B5057; --ftermb:#646A72; --fink:#D9DDE1;
  --strip:#1C2D21; --shld:#2E373E;
  --grass:#16241A; --grass2:#1B2B1F; --conc:#29323A; --term:#46525C; --twrwin:#5D8FA6; --twyc:#30393F; --asph:#20262C; --mark:#C9D1D6; --yel:#C9A20E; --parked:#56626B; --chart:#121A16; --terr:#3B3426; --terr2:#4A4130; --sky1:#0C1F33; --sky2:#1A2B3C; --cloud:#3A4A58;
  --scene:#13211A; --sky:#0F1B26; --rwy:#2E373E; --rwym:#C7D0D6; --twy:#3B4851; --apron:#22303A; --tr:#F2A93A; --holdl:#E8C23A;
  --comb:#1F2F3B; --comf:#E1E9EE;
  --bg:#0D151B; --surface:#14202A; --sunk:#0F1A22; --ink:#E1E9EE; --muted:#8EA1AE; --line:#273845;
  --accent:#E46FAF; --blue:#78B5E6;
  --dep:#1A2E40; --arr:#3A3019; --misc:#2B2540; --wx:#18322A;
  --good:#5CC38B; --good-bg:#14301F; --bad:#F1806F; --bad-bg:#3A1C19; --warn:#E5B158; --warn-bg:#382B14;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.lbl{font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:1.35rem;white-space:nowrap}
.brand b{color:var(--accent)}
.brand small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:400}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;font-family:var(--f-disp);font-weight:600;font-size:1rem;letter-spacing:.03em;color:var(--muted)}
nav button:hover{color:var(--ink);background:var(--sunk)}
nav button[aria-current="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}

main{padding-block:22px 60px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-family:var(--f-disp);font-weight:600;font-size:.95rem;letter-spacing:.03em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px;font-family:var(--f-mono);font-size:.95rem}
.check{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:.92rem}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center}
.hero p.lead{color:var(--muted);max-width:52ch;margin-top:10px}
.tx{background:var(--ink);color:var(--bg);border-radius:10px;padding:16px 18px;font-family:var(--f-mono);font-size:.92rem;display:flex;flex-direction:column;gap:10px;min-width:0}
.tx .who{font-family:var(--f-disp);letter-spacing:.1em;text-transform:uppercase;font-size:.75rem;opacity:.7}
.tx .written{opacity:.65;font-size:.8rem}
.tx .freqline{display:flex;justify-content:space-between;font-size:.75rem;opacity:.8;border-bottom:1px dashed currentColor;padding-bottom:8px}

/* flight strips */
.strips{display:flex;flex-direction:column;gap:8px}
.strip{display:grid;grid-template-columns:96px 1fr auto;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;text-align:left;padding:0;overflow:hidden;width:100%}
.strip:hover{border-color:var(--ink)}
.strip .cs{font-family:var(--f-mono);font-weight:600;padding:12px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.strip .cs span{font-size:.7rem;color:var(--muted);font-weight:400}
.strip .bd{padding:12px 14px;min-width:0}
.strip .bd h3{font-size:1.25rem}
.strip .bd p{color:var(--muted);font-size:.9rem;margin-top:2px}
.strip .fx{display:grid;grid-template-columns:repeat(2,minmax(70px,auto));border-left:1px solid var(--line);font-family:var(--f-mono);font-size:.75rem}
.strip .fx div{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.strip .fx div:nth-child(2n){border-right:0}
.strip .fx div:nth-last-child(-n+2){border-bottom:0}
.strip .fx b{display:block;font-size:.85rem;color:var(--ink)}
.strip .fx i{font-style:normal;color:var(--muted);font-size:.65rem;text-transform:uppercase;letter-spacing:.06em}
.s-dep .cs{background:var(--dep)} .s-arr .cs{background:var(--arr)} .s-misc .cs{background:var(--misc)} .s-wx .cs{background:var(--wx)}

/* progress */
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.bar .t{display:flex;justify-content:space-between;font-size:.88rem}
.bar .track{height:6px;background:var(--sunk);border-radius:3px;margin-top:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--blue)}
.mist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mist li{list-style:none;font-size:.88rem;padding:6px 10px;background:var(--sunk);border-radius:6px}
.mist ul{padding:0;margin:0;display:flex;flex-direction:column;gap:6px}

/* radio */
.com{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;background:var(--comb,#13202A);color:var(--comf,#E8EDF0);padding:10px 14px;border-radius:10px 10px 0 0;font-family:var(--f-mono)}
.com .f{font-size:1.6rem;font-weight:600;letter-spacing:.04em}
.com .st{font-family:var(--f-disp);font-size:1.1rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.com .pg{margin-left:auto;font-size:.8rem;opacity:.75}
.radio{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.log{max-height:260px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.log:empty{display:none}
.msg{font-family:var(--f-mono);font-size:.85rem;padding:7px 10px;border-radius:7px;max-width:88%;overflow-wrap:anywhere}
.msg.atc{background:var(--sunk);align-self:flex-start}
.msg.you{background:var(--dep);align-self:flex-end}
.msg .w{display:block;font-family:var(--f-disp);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.turn{padding:16px;display:flex;flex-direction:column;gap:12px}
.sit{background:var(--arr);border-radius:7px;padding:9px 12px;font-size:.92rem}
.sit b{font-family:var(--f-disp);letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;margin-right:6px}
.atcnow{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-family:var(--f-mono);font-size:1rem;overflow-wrap:anywhere}
.atcnow .written{display:block;font-size:.78rem;color:var(--muted);margin-top:3px}
.task{font-weight:600}
.fb{border-radius:7px;padding:10px 12px;font-size:.92rem}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.wa{background:var(--warn-bg);color:var(--warn)}
.fb ul{margin:6px 0 0;padding-left:18px}
.fb .model{display:block;margin-top:6px;font-family:var(--f-mono);color:var(--ink)}
.settings{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.settings input[type=text]{width:120px}

/* quiz */
.q{font-size:1.2rem;font-weight:500}
.q.mono{font-size:1.1rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 13px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.score{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.card{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;padding:26px}
.card .ans{font-size:1.15rem;color:var(--blue);font-weight:500}
.note{font-size:.85rem;background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:6px}
.plist{display:flex;flex-direction:column}
.plist div{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.plist div>*{min-width:0}
.plist .r{color:var(--muted)}

/* weather */
.chips{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-mono)}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 9px;border-radius:5px;cursor:pointer;font-size:.95rem}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.chip.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chip.hl{background:var(--dep)}
.raw{font-family:var(--f-mono);background:var(--sunk);padding:12px;border-radius:7px;overflow-wrap:anywhere}
.dtab{overflow-x:auto}
.dtab table{border-collapse:collapse;width:100%;font-size:.9rem}
.dtab td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.dtab td:first-child{font-family:var(--f-mono);white-space:nowrap;font-weight:600}
.dtab tr.trend td{background:var(--sunk)}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:10px 12px;text-align:left;cursor:pointer;font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.mi.k{font-family:var(--f-mono);font-weight:600}
.mi.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.mi.done{background:var(--good-bg);border-color:var(--good);color:var(--good);cursor:default}
.mi.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mi.bad{animation:none}}
.spellres{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-mono);font-size:.85rem}
.spellres span{padding:4px 7px;border-radius:5px}
.spellres .y{background:var(--good-bg);color:var(--good)} .spellres .n{background:var(--bad-bg);color:var(--bad)}
.big{font-family:var(--f-mono);font-size:2.2rem;font-weight:600;letter-spacing:.06em;text-align:center}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:.9rem}

/* scenes & motion */
.scene{display:block;width:100%;height:auto}
.scenebox{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--scene)}
.scenebox figcaption{display:flex;justify-content:space-between;gap:10px;font-size:.72rem;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.sc-bg{fill:var(--scene)} .sky{fill:var(--sky)} .grid{stroke:var(--line);stroke-width:1;opacity:.6;fill:none}
.rwy{fill:var(--rwy)} .cl{stroke:var(--rwym);stroke-width:2;stroke-dasharray:14 10} .rn{fill:var(--rwym);font:600 12px var(--f-mono)}
.twy{fill:var(--twy)} .apron{fill:var(--apron)} .stand{stroke:var(--twy);stroke-width:2} .stand.mine{stroke:var(--accent);stroke-width:3}
.hold{stroke:var(--holdl);stroke-width:2}
.sl{fill:var(--muted);font:500 12px var(--f-mono);letter-spacing:.04em} .wl{fill:var(--ink);font:600 13px var(--f-mono)} .lvt{fill:var(--accent);font:600 13px var(--f-mono)}
.ac{fill:var(--ink);stroke:var(--scene);stroke-width:1} .tr{fill:var(--tr)} .trt{fill:var(--tr);font:600 12px var(--f-mono)} .trl{stroke:var(--tr);stroke-dasharray:3 3}
.truck{fill:var(--bad)} .truckr{fill:var(--tr)} .tug{fill:var(--warn)} .crossr{fill:var(--bad)}
.route{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 5;opacity:.75}
.rt{fill:none;stroke:var(--accent);stroke-width:2.5} .rt.faint{opacity:.3}
.wp{fill:var(--scene);stroke:var(--ink);stroke-width:1.6}
.aptc{fill:var(--scene);stroke:var(--blue);stroke-width:2} .aptr{stroke:var(--blue);stroke-width:3}
.lvl{stroke:var(--muted);stroke-dasharray:4 4;opacity:.6} .lvl.clr{stroke:var(--accent);stroke-dasharray:none;opacity:1;stroke-width:1.5}
.gnd{stroke:var(--muted);stroke-width:2}
.tag{fill:var(--surface);stroke:var(--line)} .tagt{fill:var(--ink);font:600 12px var(--f-mono)}
.halo{paint-order:stroke;stroke:rgba(246,248,244,.92);stroke-width:4px;stroke-linejoin:round} .warnt{fill:var(--bad);font:700 15px var(--f-disp);letter-spacing:.08em} .goodt{fill:var(--good);font:700 16px var(--f-disp);letter-spacing:.08em}
.ra{fill:var(--good-bg);stroke:var(--good)} .rat{fill:var(--good);font:700 15px var(--f-disp);letter-spacing:.06em}
.cell1{fill:var(--bad);opacity:.14} .cell2{fill:var(--bad);opacity:.24} .cell3{fill:var(--bad);opacity:.45}
.cone{fill:var(--blue);opacity:.12} .loc,.gs{stroke:var(--blue);stroke-width:1.5;stroke-dasharray:8 6}
.rose{fill:var(--surface);stroke:var(--line)} .windarr{stroke:var(--blue);stroke-width:2.5} .windhead{fill:var(--blue)}
.fire{fill:#F26A1B}
.scope{fill:var(--scope)} .ring{fill:none;stroke:var(--scopeg);opacity:.3} .sw{stroke:var(--scopeg);stroke-width:2;opacity:.8}
.sweep{transform-box:view-box;transform-origin:300px 150px;animation:spin 4s linear infinite}
.blip{fill:var(--scopeg)} .dbt{fill:var(--scopeg);font:600 15px var(--f-mono)} .dbt.bad{fill:#FF6B5E}
.ping{fill:none;stroke:var(--scopeg);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.4s ease-out infinite}
.blink{animation:blink 1s steps(2) infinite}
.flick{transform-box:fill-box;transform-origin:center;animation:flick .45s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes flick{to{transform:scale(1.4);opacity:.55}}
.banb{fill:var(--bad)} .bant{fill:#fff;font:700 14px var(--f-disp);letter-spacing:.08em}
.eref{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;font-size:.9rem}
.eref p{margin-top:2px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ecard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s,transform .15s}
.ecard:hover{border-color:var(--ink);transform:translateY(-2px)}
.ecard b{font-family:var(--f-disp);font-size:1.2rem;letter-spacing:.01em}
.ecard .muted{font-size:.88rem}
.emeta{font-size:.75rem;color:var(--muted);margin-top:auto}
.sev{align-self:flex-start;font-family:var(--f-mono);font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:4px;letter-spacing:.05em}
.sev-m{background:var(--bad-bg);color:var(--bad)} .sev-p{background:var(--warn-bg);color:var(--warn)} .sev-n{background:var(--sunk);color:var(--blue)}
@media (prefers-reduced-motion:reduce){.ecard{transition:none}}

/* ---- diagram v2 ---- */
.grass{fill:var(--grass)} .grassl{stroke:var(--grass2);stroke-width:1}

<script>
const PHR=[{"s": "Runway and taxiway condition", "e": "Rime ice on RWY 26R.", "r": "Лед с инеем на полосе 26R."}, {"s": "Runway and taxiway condition", "e": "Snow drifts on the RWY edges.", "r": "Снежные заносы на кромках ВПП."}, {"s": "Runway and taxiway condition", "e": "RWY is ploughed and swept.", "r": "Полоса очищена от снега и подметена."}, {"s": "Runway and taxiway condition", "e": "RWY is sprayed with sand.", "r": "ВПП посыпана песком."}, {"s": "Runway and taxiway condition", "e": "Caution, uneven surface at the entrance to TWY A.", "r": "Внимание, неровная поверхность в начале рулежной дорожки А."}, {"s": "Runway and taxiway condition", "e": "Large water patches full length of the RWY 08L, no appreciable depth.", "r": "Большие лужи воды по всей длине ВПП 08L – глубина не измерена."}, {"s": "Runway and taxiway condition", "e": "Runway 08L is damp, dry snow patches, depth not significant. Apron and taxiways are snowed and slippery.", "r": "Полоса 08L влажная, покрыта участками сухого снега, глубина не существенна. Перрон и рулежные дорожки покрыты снегом и скользкие."}, {"s": "Runway and taxiway condition", "e": "Be advised of snow clearance at the aerodrome.", "r": "Для вашей информации - расчистка снега на аэродроме."}, {"s": "Runway and taxiway condition", "e": "RWY 08L is flooded to a depth of 2 inches at the intersection of TWY A.", "r": "ВПП 08L затоплена водой, глубиной до 2 дюймов у перекрестка рулежки А."}, {"s": "Runway and taxiway condition", "e": "Grass mowing in progress near RWY 24.", "r": "Производится покос травы около ВПП 24."}, {"s": "Runway and taxiway condition", "e": "RWY is blocked by debris of crashed plane.", "r": "Полоса заблокирована обломками разбившегося самолета."}, {"s": "Runway and taxiway condition", "e": "Foam carpet completed.", "r": "Покрытие пенным ковром завершено."}, {"s": "Runway and taxiway condition", "e": "Patches (pools) of standing water on the RWY.", "r": "На ВПП есть участки (лужи) стоячей воды."}, {"s": "Runway and taxiway condition", "e": "RWY 07 is rough in some places.", "r": "ВПП 07 в некоторых местах неровная."}, {"s": "Runway and taxiway condition", "e": "Go around, standard procedure, there's RWY lighting failure.", "r": "Уходите на второй круг по стандартной процедуре, освещение ВПП не работает."}, {"s": "Runway and taxiway condition", "e": "TWY 4 is partly covered with ice.", "r": "Рулежная дорожка 4 частично покрыта льдом."}, {"s": "Runway and taxiway condition", "e": "TWY M blocked by a wrong-turning aircraft.", "r": "Рулежная дорожка M заблокирована самолетом, повернувшим не туда."}, {"s": "Runway and taxiway condition", "e": "Thicker fog patches observed further along the RWY from control tower.", "r": "С вышки наблюдается местами более густой туман вдоль ВПП."}, {"s": "Runway and taxiway condition", "e": "Unofficial observation based on pilot report RWY 34 braking action medium to poor.", "r": "Неофициальное наблюдение на основе доклада пилота: коэффициент сцепления на ВПП 34 среднее до плохого."}, {"s": "Weather and environment", "e": "Heavy hail shower observed, approaching from the North.", "r": "Наблюдаются сильные осадки с градом, приближаются с севера."}, {"s": "Weather and environment", "e": "There is fog in patches on final. Do you need a fog dispersal system (FDS)?", "r": "На посадочной прямой местами туман, нужна ли вам система рассеивания тумана?"}, {"s": "Weather and environment", "e": "By 3 o'clock the fog will get thicker, the aerodrome will be closed for an indefinite time.", "r": "К 3 часам туман станет гуще, аэродром будет закрыт на неопределенное время."}, {"s": "Weather and environment", "e": "Report meteorological conditions observed from your aircraft.", "r": "Сообщите о метеоусловиях, наблюдаемых с вашего борта."}, {"s": "Weather and environment", "e": "Be informed of rain clutters over SL.", "r": "Для вашей информации – грозовые засветы над SL."}, {"s": "Weather and environment", "e": "ATIS Golf is now current.", "r": "ATIS Golf сейчас действует."}, {"s": "Weather and environment", "e": "The weather is getting worse, delay is expected for the next 3 hours.", "r": "Погода ухудшается, ожидается задержка на следующие 3 часа."}, {"s": "Weather and environment", "e": "Caution, wind shear reported at 600 feet 2-mile final.", "r": "Внимание, на высоте 600 футов на удалении 2 миль зафиксирован сдвиг ветра."}, {"s": "Weather and environment", "e": "Can you accept a crosswind of 18 knots gusting to 25?", "r": "Подходит ли вам боковой ветер 18 узлов с порывами до 25?"}, {"s": "Weather and environment", "e": "Suggest you hold there for a few minutes; the thunderstorm is rapidly approaching the far end of the RWY 26.", "r": "Рекомендуем оставаться на месте несколько минут, гроза быстро приближается к дальнему концу ВПП 26."}, {"s": "Weather and environment", "e": "Be informed of a sounding balloon in the vicinity of the aerodrome.", "r": "Будьте информированы о зондирующем шаре вблизи аэродрома."}, {"s": "Weather and environment", "e": "Obstacles obscured in the vicinity of the field.", "r": "Препятствия скрыты вблизи аэродрома."}, {"s": "Weather and environment", "e": "Tower observes heavy hail and downdraught at 2 miles final RWY 24.", "r": "На посадочной прямой ВПП 24, на удалении 2 миль, наблюдаются сильный град и нисходящие потоки."}, {"s": "Weather and environment", "e": "There is severe line squall on course.", "r": "Сильный шквал прямо по курсу."}, {"s": "Weather and environment", "e": "Tower, we encountered wind shear at 900 feet on approach to RWY 06. Airspeed loss 20 knots, strong starboard drift.", "r": "При заходе на ВПП 06 на высоте 900 футов столкнулись со сдвигом ветра. Потеря скорости 20 узлов, сильный снос вправо."}, {"s": "Weather and environment", "e": "The weather is below your aircraft category minimum. What are your intentions?", "r": "Погодные условия ниже минимальных для вашей категории ВС. Каковы ваши намерения?"}, {"s": "Weather and environment", "e": "Has the weather at your aerodrome become better?", "r": "Стала ли погода на вашем аэродроме лучше?"}, {"s": "Weather and environment", "e": "Has the fog in the vicinity of your field become (got) thicker?", "r": "Сгустился ли туман вблизи вашего аэродрома?"}, {"s": "Weather and environment", "e": "Be advised of hail hitting in progress in the vicinity of DIPAX till FL 270, radius 10 km.", "r": "Сообщаю, что в районе DIPAX идет град, до эшелона FL 270, радиус 10 км."}, {"s": "Weather and environment", "e": "Be advised airdrome is closed due to hail hitting.", "r": "Сообщаю, что аэродром закрыт из-за града."}, {"s": "Weather and environment", "e": "Where has the thunderstorm moved to?", "r": "Куда сместилась гроза?"}, {"s": "Weather and environment", "e": "Where is the thunderstorm coming from?", "r": "Откуда приближается гроза?"}, {"s": "Weather and environment", "e": "Lightning has struck the aircraft.", "r": "В самолет попала молния."}, {"s": "Weather and environment", "e": "Aerodrome is unsafe due to thick fog. You are allowed to land only at your discretion.", "r": "Аэродром небезопасен из-за густого тумана. Вам разрешается садиться только по собственному усмотрению."}, {"s": "Weather and environment", "e": "I have just avoided CB, now continue climbing FL 270, will advise reaching.", "r": "Я только что обошел кучево-дождевые облака, продолжаю набор до эшелона 270, занятие эшелона доложу."}, {"s": "Communication and identification", "e": "Read you with interference.", "r": "Слышу вас с помехами."}, {"s": "Communication and identification", "e": "Readability is poor. Send words twice.", "r": "Слышу вас плохо. Передавайте слова дважды."}, {"s": "Communication and identification", "e": "You were blocked / blotted out (covered by another station).", "r": "Вас заглушила другая станция. Вы были забиты."}, {"s": "Communication and identification", "e": "Say again, using another headset / Try box 2.", "r": "Повторите, используя другую гарнитуру / Попробуйте вторую радиостанцию."}, {"s": "Communication and identification", "e": "Negative altitude readout.", "r": "Нет данных о высоте."}, {"s": "Communication and identification", "e": "I have not identified you.", "r": "Я вас не идентифицировал."}, {"s": "Communication and identification", "e": "Your transmitter has a background noise.", "r": "От вашего передатчика идет фоновый шум."}, {"s": "Communication and identification", "e": "The communication is interrupted by statics.", "r": "Связь прерывается помехами. (треск и шумы в наушниках)"}, {"s": "Communication and identification", "e": "Squawk standby.", "r": "Установите код ответчика в режим ожидания."}, {"s": "Communication and identification", "e": "Do you have a transponder on board? Are you squawking?", "r": "На борту есть ответчик? Вы используете ответчик?"}, {"s": "Communication and identification", "e": "Mode \"C\" wrong indication.", "r": "Неправильный ответ по высоте."}, {"s": "Communication and identification", "e": "I am lost (unsure of my position), request my position.", "r": "Потеря ориентировки (не уверен в своем местоположении), прошу текущее местоположение."}, {"s": "Communication and identification", "e": "I read you fits and starts (now and then).", "r": "Слышу вас временами (с перебоями)."}, {"s": "Communication and identification", "e": "Shall I transmit in full or in part?", "r": "Передавать полностью или частично?"}, {"s": "Communication and identification", "e": "Permanent interference on 123.5.", "r": "Постоянные помехи на частоте 123.5."}, {"s": "Communication and identification", "e": "For Tashkent actual monitor 126.8.", "r": "Для текущей метеоинформации аэропорта Ташкент прослушайте частоту 126,8."}, {"s": "Communication and identification", "e": "Transmitting blind due to receiver failure.", "r": "Передаю блиндом (вслепую) из-за отказа приемника."}, {"s": "Communication and identification", "e": "Remain this / my frequency.", "r": "Оставайтесь на этой / моей частоте."}, {"s": "Communication and identification", "e": "Increase the power of your transmitter.", "r": "Увеличьте мощность вашего передатчика."}, {"s": "Communication and identification", "e": "Squawk Mayday.", "r": "Установите код ответчика 7700.", "n": "Code 7700 = emergency, 7600 = radio failure, 7500 = unlawful interference."}, {"s": "Communication and identification", "e": "Unknown aircraft, unknown aircraft at position 41 North, 65 West, speed 348, heading of 132, Squawk ident", "r": "Неопознанное воздушное судно, неопознанное воздушное судно на позиции 41° северной широты, 65° западной долготы, скорость 348, курс 132, ответчик в режиме Ident."}, {"s": "Taxiway and ground movement", "e": "Broken vehicle on the TWY.", "r": "На рулежной дорожке неисправное транспортное средство."}, {"s": "Taxiway and ground movement", "e": "You have gone too far. You missed TWY D4. Wait there for the follow-me car.", "r": "Вы заехали слишком далеко. Вы пропустили рулежную дорожку D4. Ожидайте на месте машину сопровождения."}, {"s": "Taxiway and ground movement", "e": "Turn in the holding bay, take the first convenient left turn onto TWY Juliet.", "r": "Развернитесь в кармане ВПП, поверните налево на первую удобную рулежную дорожку Джульет."}, {"s": "Taxiway and ground movement", "e": "Stop taxi, a Boeing 737 has taken a wrong turning and is blocking the TWY.", "r": "Остановите руление, Боинг 737 ошибся поворотом и заблокировал рулежную дорожку."}, {"s": "Taxiway and ground movement", "e": "You'll have to wait until a tug pushes him back beyond the next intersection.", "r": "Вам нужно подождать, пока тягач отбуксирует его за следующий перекресток."}, {"s": "Taxiway and ground movement", "e": "Can you move forward under your own power, 50 meters or so until you pass the next intersection?", "r": "Можете ли вы самостоятельно проехать вперед 50 метров, чтобы освободить следующий перекресток?"}, {"s": "Taxiway and ground movement", "e": "Speed up (expedite) taxi.", "r": "Ускорьте руление.", "n": "ICAO: 'Expedite taxi'."}, {"s": "Taxiway and ground movement", "e": "Hold in run-up area.", "r": "Ожидайте в зоне прогрева двигателей."}, {"s": "Taxiway and ground movement", "e": "Go around (make a missed approach procedure).", "r": "Уходите на второй круг (выполняйте процедуру ухода)."}, {"s": "Taxiway and ground movement", "e": "Taxi via TWY C, backtrack, and line up RWY 07.", "r": "Рулите по РД Чарли, затем разворачивайтесь и занимайте исполнительный ВПП 07."}, {"s": "Taxiway and ground movement", "e": "Could you taxi about 15 meters (forward) to keep the taxiway clear for Boeing 737?", "r": "Не могли бы вы прорулить примерно 15 метров вперед, чтобы освободить рулежную дорожку для Боинга 737?"}, {"s": "Taxiway and ground movement", "e": "Bleed-off TWY, by-pass TWY.", "r": "Соединительная РД, обводная РД."}, {"s": "Taxiway and ground movement", "e": "There is a B-747 parking behind you. After him, pushback approved abeam stand B10.", "r": "Позади вас стоит B-747. После него разрешен толчок носом назад напротив стоянки B10."}, {"s": "Taxiway and ground movement", "e": "Pull in to the right; there is an A-320 overtaking you on your left.", "r": "Прижмитесь вправо, вас обгоняет A-320 слева."}, {"s": "Taxiway and ground movement", "e": "Request progressive taxi instructions. (Include step-by-step routing directions (AIM).)", "r": "Просим подробный маршрут по ходу выполнения руления."}, {"s": "Taxiway and ground movement", "e": "We have one passenger missing.", "r": "У нас отсутствует один пассажир."}, {"s": "Taxiway and ground movement", "e": "We wish to delay departure due to passenger baggage identification process.", "r": "Мы хотим отложить вылет из-за процесса идентификации багажа пассажиров."}, {"s": "Taxiway and ground movement", "e": "We are having a problem with a tow bar. We are waiting for another one.", "r": "У нас проблема с буксировочной штангой (водило). Ждем замену."}, {"s": "Taxiway and ground movement", "e": "We are going to be delayed for a while. The tug seems to have broken down.", "r": "У нас будет небольшая задержка. Похоже, тягач вышел из строя."}, {"s": "Taxiway and ground movement", "e": "A large dog has just crossed the TWY ahead of us. Could you send someone to catch it?", "r": "Большая собака только что пересекла рулежную дорожку перед нами. Можете кого-нибудь прислать, чтобы ее поймать?"}, {"s": "Taxiway and ground movement", "e": "Do you need a ladder?", "r": "Вам нужна лестница (стремянка)?"}, {"s": "Taxiway and ground movement", "e": "Revised door-open time 45.", "r": "Скорректированное время открытия дверей: 45 минут."}, {"s": "Taxiway and ground movement", "e": "Could we start up quickly, please? We have live stock in the hold.", "r": "Можем ли мы быстрее начать запуск? У нас живой груз в грузовом отсеке."}, {"s": "Taxiway and ground movement", "e": "Why is our departure delayed?", "r": "Почему наша отправка задерживается?"}, {"s": "Taxiway and ground movement", "e": "Why do I have to expedite taxiing?", "r": "Почему я должен ускорить руление?"}, {"s": "Taxiway and ground movement", "e": "How long is our departure delayed?", "r": "На сколько задерживается наш вылет?"}, {"s": "Taxiway and ground movement", "e": "Delay is not determined for the moment—there seems to be a problem with the generators.", "r": "Задержка пока не определена — похоже, есть проблема с генераторами."}, {"s": "Taxiway and ground movement", "e": "Take the second turn on the right", "r": "На втором повороте направо"}, {"s": "Taxiway and ground movement", "e": "Make next right turn", "r": "На следующем (первом) повороте направо"}, {"s": "Taxiway and ground movement", "e": "We are going to be delayed due to catering (the catering truck has not brought the food).", "r": "Ожидаем задержку из-за недоставки питания на борт."}, {"s": "Taxiway and ground movement", "e": "You will have to wait until the tug pushes him back beyond the next intersection.", "r": "Вам придется подождать пока тягач не отбуксирует его за следующий перекресток."}, {"s": "Taxiway and ground movement", "e": "Approaching holding point RWY 29, request return to stand, brakes are overheating.", "r": "Занимаем предварительный к полосе 29, просим разрешения вернуться на стоянку, тормоза перегреваются."}, {"s": "Taxiway and ground movement", "e": "Clearance void if not off by 35", "r": "Разрешение истекает если не взлетите к 35 минуте"}, {"s": "Runway operations", "e": "Hold short of RWY 02L.", "r": "Остановитесь перед ВПП 02 левая."}, {"s": "Runway operations", "e": "Vacate RWY 16 via high-speed TWY 3 / Main TWY.", "r": "Освободите ВПП 16 через скоростную рулежную дорожку 3 / основную рулежную дорожку."}, {"s": "Runway operations", "e": "Parallel departures now in operation.", "r": "Сейчас действуют параллельные вылеты."}, {"s": "Runway operations", "e": "Due to aggressive RWY operation, departures may be delayed up to 90 min.", "r": "Из-за интенсивной эксплуатации ВПП вылеты могут быть задержаны до 90 минут."}, {"s": "Runway operations", "e": "Disabled aircraft on RWY 23L.", "r": "На ВПП 23L находится неисправное воздушное судно."}, {"s": "Runway operations", "e": "Take the first convenient turn off, then turn right into TWY Bravo.", "r": "Сверните на первую удобную рулежную дорожку, затем поверните направо на РД Браво."}, {"s": "Runway operations", "e": "Stop immediately, I say again stop immediately, there is a vehicle on RWY 26.", "r": "Остановитесь немедленно, повторяю, остановитесь немедленно, на ВПП 26 находится транспортное средство."}, {"s": "Runway operations", "e": "Keep slightly right while taxiing due construction work on left side of the RWY 08R.", "r": "Держитесь немного правее при рулении из-за строительных работ с левой стороны ВПП 08R."}, {"s": "Runway operations", "e": "Single RWY operation.", "r": "В работе одна ВПП."}, {"s": "Runway operations", "e": "TORA (Take-Off Run Available) RWY09L from intersection D 3000m.", "r": "Располагаемая дистанция разбега с ВПП 09 левая от пересечения D составляет 3000 метров."}, {"s": "Runway operations", "e": "Switch off the sequence flashers.", "r": "Выключите бегущие огни."}, {"s": "Runway operations", "e": "Make U-turn RWY 08L, backtrack and vacate via TWY 2.", "r": "Развернитесь на ВПП 08L, рулите с обратным курсом (выруливайте обратно) и освободите через РД 2."}, {"s": "Runway operations", "e": "Cleared for ILS approach RWY 09 left. Sidestep to RWY 09 right.", "r": "Разрешен заход по ИЛС на ВПП 09 левая. Боковой маневр на ВПП 09 правая."}, {"s": "Runway operations", "e": "We left chocks on RWY 02R. Send someone to pick them up.", "r": "Мы оставили колодки на ВПП 02П. Пошлите кого-нибудь забрать их."}, {"s": "Runway operations", "e": "Dim approach lights to 50 per cent.", "r": "Уменьшите яркость посадочных огней до 50 процентов."}, {"s": "Runway operations", "e": "Your time of departure expires at 12:30.", "r": "Ваше время отбытия истекает в 12:30."}, {"s": "Runway operations", "e": "Take off denied / clearance void (USA) if not airborne at 17.", "r": "Взлет запрещается, если не взлетите в 17 минут."}, {"s": "Runway operations", "e": "Why have you delayed our departure?", "r": "Почему вы задержали наш вылет?"}, {"s": "Runway operations", "e": "What is the usable length of RWY 27?", "r": "Какова доступная длина ВПП 27?"}, {"s": "Runway operations", "e": "Request returning to stand, unable to start-up engine.", "r": "Запрашиваем возвращение на стоянку, не можем запустить двигатель."}, {"s": "Runway operations", "e": "Permission for your flight is not granted.", "r": "Разрешение на ваш полет не выдано."}, {"s": "Runway operations", "e": "There is a 55 min delay due to computer failure. Your slot time is 09.45.", "r": "Задержка на 55 минут из-за сбоя компьютера. Ваш слот на 09:45."}, {"s": "Runway operations", "e": "Request departure RWY 08L intersection M.", "r": "Прошу взлет с перекрестка М ВПП 08 левая."}, {"s": "Runway operations", "e": "Take off aborted due to tyre blow out. We slid slightly off the RWY 10.", "r": "Взлет прерван из-за лопнувшей шины. Мы немного съехали с ВПП."}, {"s": "Runway operations", "e": "Stopping, take off abandoned due to engine failure.", "r": "Останавливаемся, взлет прерван из-за отказа двигателя."}, {"s": "Runway operations", "e": "Why did you reject take-off?", "r": "Почему вы прервали взлет?"}, {"s": "Runway operations", "e": "We seem to have a nose gear tyre blow out on landing. Request a tug to tow us to the apron.", "r": "Кажется, на посадке лопнула покрышка на носовой стойке шасси. Запрашиваем тягач для буксировки на перрон."}, {"s": "Runway operations", "e": "We aquaplaned after touchdown and have at least 2 tyres blown out on right main gear.", "r": "После касания произошло гидроглиссирование, и на правой основной стойке шасси лопнули как минимум 2 покрышки."}, {"s": "Runway operations", "e": "Large flock of birds (bird congestion) observed crossing left to right at the upwind end of RWY 24.", "r": "При взлете с ВПП 24 на начальном этапе набора наблюдалась большая стая птиц, пересекавшая слева направо."}, {"s": "Navigation and ATC instructions", "e": "Report your position over AMDAR, which is mandatory (CRP- compulsory reporting point).", "r": "Доложите ваше место над точкой AMDAR, которая является точкой обязательного донесения.", "n": "Waypoint names like AMDAR are pronounced as words, not spelled."}, {"s": "Navigation and ATC instructions", "e": "Offset track 2 miles left is approved.", "r": "Разрешено следовать 2 мили параллельно заданному маршруту."}, {"s": "Navigation and ATC instructions", "e": "Verify your assigned altitude (pilots should check and confirm assigned altitude).", "r": "Проверьте и подтвердите вашу заданную высоту."}, {"s": "Navigation and ATC instructions", "e": "Unable clearance into RVSM airspace, maintain (or descend to, or climb to) FL...", "r": "Нет разрешения на вход в воздушное пространство RVSM, сохраняйте (или снижайтесь, или поднимайтесь до) эшелона…"}, {"s": "Navigation and ATC instructions", "e": "For the time being maintain (remain) FL ............", "r": "Пока оставайтесь на этом эшелоне."}, {"s": "Navigation and ATC instructions", "e": "Level off (at) FL 150.", "r": "Перейдите в горизонтальный полет на эшелоне 150.", "n": "'Level off' is US usage. ICAO: 'Stop climb (descent) at FL150' or 'Maintain FL150'."}, {"s": "Navigation and ATC instructions", "e": "You are released on frequency.............", "r": "Вы переводитесь на частоту............."}, {"s": "Navigation and ATC instructions", "e": "Maintain FL 370 proceed to OGODA, hold north-west, inbound radial 288, all turns right, legs at your discretion.", "r": "Сохраняйте эшелон 370, следуйте в точку OGODA, ждите северо-западнее, на радиале 288, все развороты правые, длина участков на ваше усмотрение."}, {"s": "Navigation and ATC instructions", "e": "Expect radar vector across the final approach course, fly heading 340 for spacing.", "r": "Ожидайте векторение с пересечением посадочного курса, выдерживайте курс 340 для создания интервала."}, {"s": "Navigation and ATC instructions", "e": "You have crossed the final approach course. Turn right immediately heading 240 to join the localizer.", "r": "Вы пересекли посадочный курс. Разворачивайтесь вправо на курс 240 немедленно, чтобы захватить курсовой луч ИЛС."}, {"s": "Navigation and ATC instructions", "e": "Will it suit you to align 5 NM? (Arrival procedure)", "r": "Устроит ли вас спрямление на 5 морских миль?"}, {"s": "Navigation and ATC instructions", "e": "Can you slope down?", "r": "Можете ли вы ускорить снижение?", "n": "Not ICAO phraseology. Use 'Expedite descent' or 'Advise if able to descend…'."}, {"s": "Navigation and ATC instructions", "e": "Do not exceed speed 250 knots (not greater/or less).", "r": "Не превышайте скорость 250 узлов (не больше/или меньше)."}, {"s": "Navigation and ATC instructions", "e": "Make a right-hand orbit for spacing / orbit right for spacing.", "r": "Выполните правую орбиту для создания интервала."}, {"s": "Navigation and ATC instructions", "e": "Turn right 90° for identification.", "r": "Поверните направо на 90° для опознования."}, {"s": "Navigation and ATC instructions", "e": "Maintain present heading until FIR boundary.", "r": "Сохраняйте текущий курс до границы РПИ."}, {"s": "Navigation and ATC instructions", "e": "Reduce to approach (circuit) speed.", "r": "Уменьшите скорость до посадочной (или схемной)."}, {"s": "Navigation and ATC instructions", "e": "Continue / fly RWY heading for 4 min.", "r": "Продолжайте/летите по курсу ВПП в течение 4 минут."}, {"s": "Navigation and ATC instructions", "e": "Resume own navigation.", "r": "Возвращайтесь к самостоятельной навигации."}, {"s": "Navigation and ATC instructions", "e": "Request 10° heading change to avoid build-up.", "r": "Запрашиваем изменение курса на 10°, чтобы обойти грозовое образование."}, {"s": "Navigation and ATC instructions", "e": "Could we have slightly lower level? We are experiencing moderate turbulence at FL 340.", "r": "Можно нам занять эшелон ниже? На эшелоне 340 умеренная турбулентность."}, {"s": "Navigation and ATC instructions", "e": "We have just passed through some severe turbulence. What kind of traffic is there ahead of us?", "r": "Мы только что прошли через сильную турбулентность. Какой самолет впереди нас?"}, {"s": "Navigation and ATC instructions", "e": "It must have been wake turbulence, there is a 747 ahead, although normal separation was provided.", "r": "Это, должно быть, спутный след. Впереди Боинг 747, хотя установленный интервал был соблюден."}, {"s": "Navigation and ATC instructions", "e": "VOR approach is not available due to equipment failure.", "r": "Заход по VOR недоступен из-за отказа оборудования."}, {"s": "Navigation and ATC instructions", "e": "Continue visually or go around.", "r": "Продолжайте визуально или уходите на второй круг."}, {"s": "Navigation and ATC instructions", "e": "Advisory to all concerned.", "r": "Сообщение всем, кого касается."}, {"s": "Navigation and ATC instructions", "e": "Report RWY in sight (ground contact).", "r": "Доложите, как увидите ВПП (или контакт с землей)."}, {"s": "Navigation and ATC instructions", "e": "Keep the plane ahead of you in sight.", "r": "Удерживайте самолет перед вами в поле зрения."}, {"s": "Navigation and ATC instructions", "e": "Glide slope below 300 m is unreliable. You have to make a visual approach RWY 16.", "r": "Глиссада ниже 300 м ненадежна. Вам необходимо выполнить визуальный заход на ВПП 16."}, {"s": "Navigation and ATC instructions", "e": "Confirm your heading and continue further descent to FL 190.", "r": "Подтвердите курс и продолжайте снижение до эшелона 190."}, {"s": "Navigation and ATC instructions", "e": "FL 330 is unavailable.", "r": "Эшелон 330 недоступен."}, {"s": "Navigation and ATC instructions", "e": "Is FL 300 acceptable for you?", "r": "Подходит ли вам эшелон 300?"}, {"s": "Navigation and ATC instructions", "e": "Remain outside the controlled airspace. Expect clearance at 35.", "r": "Оставайтесь вне контролируемого пространства. Ожидайте разрешение в 35 минут."}, {"s": "Navigation and ATC instructions", "e": "Turn left heading 160°. It will take you to LT, 25 miles to run.", "r": "Развернитесь влево, курс 160°. Это выведет вас на точку LT, удаление 25 миль."}, {"s": "Navigation and ATC instructions", "e": "Leveling FL 150.", "r": "Сохраняю эшелон 150.", "n": "ICAO standard: 'Maintaining FL150' or, at level-off, 'Reaching FL150'."}, {"s": "Navigation and ATC instructions", "e": "Do not stray away.", "r": "Не отклоняйтесь от трассы.", "n": "Not ICAO phraseology. Use 'Maintain the route' or 'Report back on route'."}, {"s": "Navigation and ATC instructions", "e": "FL 330 is not available due to restrictions. Alternatives are FL 350 and FL 310. Advise your decision.", "r": "Эшелон 330 недоступен из-за ограничений. Доступны эшелоны 350 и 310. Сообщите ваше решение."}, {"s": "Navigation and ATC instructions", "e": "Overfly the hazardous area at flight level 390 not lower.", "r": "Перелетайте опасную зону на эшелоне 390, не ниже."}, {"s": "Navigation and ATC instructions", "e": "Request level change due to severe turbulence (icing).", "r": "Запрашиваем смену эшелона из-за сильной турбулентности (обледенения)."}, {"s": "Navigation and ATC instructions", "e": "Request level change due to clear air turbulence.", "r": "Запрашиваем смену эшелона из-за турбулентности в ясном небе."}, {"s": "Navigation and ATC instructions", "e": "There is severe turbulence at FL 300. Request FL 250 instead of 300.", "r": "На эшелоне FL 300 сильная турбулентность. Запрашиваем FL 250 вместо FL 300."}, {"s": "Navigation and ATC instructions", "e": "Request a left turn out.", "r": "Запрашиваем левый разворот после взлета."}, {"s": "Navigation and ATC instructions", "e": "Are there any restrictions on our heading?", "r": "Есть ли ограничения на наш курс?"}, {"s": "Navigation and ATC instructions", "e": "What is the lowest safe level?", "r": "Каков минимальный безопасный эшелон?"}, {"s": "Navigation and ATC instructions", "e": "Cleared to avoid weather only within the route (гроза).", "r": "Разрешается обходить грозу только в пределах маршрута."}, {"s": "Navigation and ATC instructions", "e": "What heading must I set to come back on track?", "r": "Какой курс мне установить, чтобы вернуться на маршрут?"}, {"s": "Navigation and ATC instructions", "e": "Penetrating top of clouds.", "r": "Входим в верхнюю кромку облачности."}, {"s": "Navigation and ATC instructions", "e": "Coordinate transfer of control with ATC units.", "r": "Согласуйте передачу управления с подразделениями УВД."}, {"s": "Navigation and ATC instructions", "e": "For your information, drone (UAV - Unmanned Aerial Vehicle) in the vicinity of SR, radius 10 km, height 350 m from 4:00 till 15:00.", "r": "Для информации: в районе SR дрон (БПЛА), радиус 10 км, высота 350 м, с 4:00 до 15:00."}, {"s": "Navigation and ATC instructions", "e": "For your information, paragliding in the vicinity of Yusufxona/Beldersay, height 30 m from 4:00 till 15:00.", "r": "Для информации: в районе Yusufxona/Beldersay проходят полеты на парапланах, высота 30 м, с 4:00 до 15:00."}, {"s": "Navigation and ATC instructions", "e": "For your information. Light firing available.", "r": "Для вашей информации, возможна стрельба из легкого вида оружия."}, {"s": "Navigation and ATC instructions", "e": "Why are you losing altitude so rapidly?", "r": "Почему вы теряете высоту так стремительно?"}, {"s": "Navigation and ATC instructions", "e": "Why didn’t you report passing MIRZO?", "r": "Почему не доложили прохождение MIRZO?"}, {"s": "Navigation and ATC instructions", "e": "Spell position where we shall proceed to.", "r": "Назовите по буквам точку (пункт), куда мы должны следовать.", "n": "Spell a point only when asked or when the name is unclear. Five-letter waypoint names are normally said as one word."}, {"s": "Traffic, separation, TCAS", "e": "Traffic crossing left to right at FL 300.", "r": "Борт пересекает слева направо на эшелоне 300."}, {"s": "Traffic, separation, TCAS", "e": "Traffic same direction 32 miles behind you, moving faster. FL 120.", "r": "Попутный борт на 32 мили позади вас, движется быстрее. Эшелон 120."}, {"s": "Traffic, separation, TCAS", "e": "Longitudinal separation will be 16 miles.", "r": "Продольное эшелонирование составит 16 миль."}, {"s": "Traffic, separation, TCAS", "e": "Lateral separation will be 11 miles.", "r": "Боковое эшелонирование составит 11 миль."}, {"s": "Traffic, separation, TCAS", "e": "Traffic will be climbing through your level, distance 20 miles.", "r": "Борт будет набирать высоту через ваш эшелон, расстояние 20 миль."}, {"s": "Traffic, separation, TCAS", "e": "Traffic 12 o'clock.", "r": "Борт прямо по курсу (12 часов)."}, {"s": "Traffic, separation, TCAS", "e": "Traffic 6 o'clock.", "r": "Борт сзади (6 часов)."}, {"s": "Traffic, separation, TCAS", "e": "Traffic 10 o’clock crossing left to right, height unknown. If not in sight/ negative contact turn left heading 270.", "r": "Борт на 10 часов (60 градусов слева) пересекает слева направо, высота неизвестна. Если борт не наблюдаете, поверните влево курсом 270.", "n": "10 o'clock = 60° left of the nose (each hour = 30°)."}, {"s": "Traffic, separation, TCAS", "e": "Unknown traffic, opposite direction 11 o'clock, 9 miles FL 150.", "r": "Неизвестное воздушное движение, встречное направление, на 11 часов, расстояние 9 миль, эшелон 150."}, {"s": "Traffic, separation, TCAS", "e": "Lose time to arrive at 50.", "r": "Затяните время, чтобы прибыть в точку в 50 минут."}, {"s": "Traffic, separation, TCAS", "e": "Avoiding action: a left turn of 30 degrees will take you well clear.", "r": "Маневр расхождения: левый разворот на 30 градусов обеспечит расхождение."}, {"s": "Traffic, separation, TCAS", "e": "Reduce speed for the benefit of preceding aircraft.", "r": "Уменьшите скорость для создания благоприятных условий следующему впереди самолету."}, {"s": "Traffic, separation, TCAS", "e": "Reduced separation. Cleared to land after the preceding aircraft.", "r": "Сокращенный интервал. Разрешена посадка за предыдущим самолетом."}, {"s": "Traffic, separation, TCAS", "e": "Where are we identified?", "r": "Где мы идентифицированы?"}, {"s": "Traffic, separation, TCAS", "e": "We have just had to dive to avoid colliding with converging traffic. It was a very close thing. I'll check if the passengers are OK.", "r": "Мы только что были вынуждены уйти в снижение (поднырнуть), чтобы избежать столкновения с сближающимся бортом. Это было очень близко. Проверю состояние пассажиров."}, {"s": "Traffic, separation, TCAS", "e": "Unable to comply, TCAS resolution advisory.", "r": "Не можем выполнить, рекомендации TCAS по разрешению угрозы столкновения.", "n": "ICAO standard short form: 'UNABLE, TCAS RA'."}, {"s": "Traffic, separation, TCAS", "e": "TCAS RA (resolution advisory). Clear of traffic. Request climb to FL 150.", "r": "Набрал высоту по TCAS (или снизился), с бортом разошлись. Прошу вернуться на эшелон 150."}, {"s": "Traffic, separation, TCAS", "e": "Now clear of traffic. Resume own navigation.", "r": "С бортом разошлись. Возвращайтесь к самостоятельной навигации."}, {"s": "Traffic, separation, TCAS", "e": "Maintain 10 min separation from Airbus 320.", "r": "Сохраняйте 10 минутный интервал от Airbus 320."}, {"s": "Traffic, separation, TCAS", "e": "We had a near miss with a low-flying fighter.", "r": "У нас было опасное сближение с истребителем, летящим на малой высоте."}, {"s": "Traffic, separation, TCAS", "e": "We have had a dangerous near miss with converging traffic. The safety separation has not been provided. We intend to file an air miss report.", "r": "Произошло опасное сближение с другим бортом. Безопасный интервал не был обеспечен. Планируем подать донесение об опасном сближении."}, {"s": "Traffic, separation, TCAS", "e": "We were forced to dive to avoid colliding with converging traffic.", "r": "Мы были вынуждены уйти в резкое снижение, чтобы избежать столкновения с встречным бортом."}, {"s": "Traffic, separation, TCAS", "e": "An aircraft has just overtaken us. There was no necessary separation.", "r": "Борт только что обогнал нас. Не было необходимого интервала."}, {"s": "Traffic, separation, TCAS", "e": "Could you see identification and type of near-missing aircraft?", "r": "Увидели ли вы идентификацию и тип сближающегося борта?"}, {"s": "Approach and landing", "e": "I'll keep you advised.", "r": "Я буду держать вас в курсе."}, {"s": "Approach and landing", "e": "You are steady on the glide path.", "r": "Вы стабилизировались на глиссаде."}, {"s": "Approach and landing", "e": "Samarkand cannot be used as alternate.", "r": "Самарканд не может использоваться в качестве запасного аэродрома."}, {"s": "Approach and landing", "e": "Why are we directed to alternate?", "r": "Почему нас направляют на запасной?"}, {"s": "Approach and landing", "e": "Do you expect any difficulties on landing?", "r": "Ожидаете ли вы какие-либо трудности при посадке?"}, {"s": "Approach and landing", "e": "Are you familiar with NDB/ILS/VOR DME approach to RWY 08L?", const NW={zero:'0',one:'1',two:'2',three:'3',tree:'3',four:'4',fower:'4',five:'5',fife:'5',six:'6',seven:'7',eight:'8',nine:'9',niner:'9'};

function norm(raw){
  let s=' '+raw.toLowerCase()+' ';
  s=s.replace(/(\d),(?=\d{3}\b)/g,'$1').replace(/[’']/g,'')
   .replace(/\bm\.(\d)/g,'mach .$1')
   .replace(/\bfl\s?(?=\d)/g,'flight level ').replace(/\bfl\b/g,'flight level')
   .replace(/\brwy\s?(?=\d)/g,'runway ').replace(/\brwy\b/g,'runway')
   .replace(/\bhdg\b/g,'heading').replace(/\bft\b/g,'feet').replace(/\bkts?\b/g,'knots').replace(/\btwy\b/g,'taxiway')
   .replace(/\balpha\b/g,'alfa').replace(/\bjuliett\b/g,'juliet').replace(/\bpob\b/g,'persons on board')
   .replace(/(\d{2})l\b/g,'$1 left').replace(/(\d{2})r\b/g,'$1 right').replace(/(\d{2})c\b/g,'$1 centre').replace(/\bcenter\b/g,'centre')

   .replace(/-/g,' ').replace(/[,;:!?]|\.(?!\d)/g,' zzsep ').replace(/[^a-z0-9.\s]/g,' ');

  const out=[];
  const isD=x=>x!==undefined&&(NW[x]!==undefined||/^\d/.test(x));
  for(let k=0;k<toks.length;k++){const t=toks[k];
    const p=out[out.length-1];
    if((t==='decimal'||t==='point')&&isD(toks[k+1])&&(t==='decimal'||(p&&(p.num||p.t==='mach')))){out.push({t:'.',dot:true});continue}

      if(p&&p.num&&!p.big&&/^\d+$/.test(d)){p.t+=d;continue}

    out.push({t:t==='zzsep'?'':t});

}

function pl(x,y,rot,cls='ac',s=.8,d=ACP){return `<g transform="translate(${(+x).toFixed(1)} ${(+y).toFixed(1)}) rotate(${(+rot).toFixed(1)}) scale(${s})">${cls==='ac'&&d===ACP?'<circle class="halo" r="22"/>':''}<path d="${d}" class="${cls}"/></g>`}
function mv(path,end,o={}){const {dur=6,rep='1',cls='ac',s=.8,rot='auto',d=ACP}=o;if(RM)return pl(end[0],end[1],end[2],cls,s,d);
  return `<g>${cls==='ac'&&d===ACP?`<circle class="halo" r="${(22*s).toFixed(1)}"/>`:''}<path d="${d}" class="${cls}" transform="scale(${s})"/><animateMotion dur="${dur}s" repeatCount="${rep}" fill="freeze" rotate="${rot}" path="${path}"/></g>`}
const csShort=()=>S.cs.name.trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase()+S.cs.num.trim();

function tag(x,y,lines,w=96){w=Math.round(Math.max(w*1.15,Math.max(...lines.map(l=>l.length))*7.6+14));x=Math.min(x,592-w);return `<g transform="translate(${x} ${y})"><rect class="tag" width="${w}" height="${lines.length*16+8}" rx="3"/>${lines.map((l,k)=>`<text class="tagt" x="7" y="${17+k*16}">${esc(l)}</text>`).join('')}</g>`}
function banner(x,y,t,cls='warnt',anchor='start'){return `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${esc(t)}</text>`}
function apt(x,y,big){const r=big?13:9;return `<circle class="aptc" cx="${x}" cy="${y}" r="${r}"/><line class="aptr" x1="${x-r+3}" y1="${y+3}" x2="${x+r-3}" y2="${y-3}"/>`}
function fire(x=0,y=0){return `<g transform="translate(${x} ${y})"><circle class="fire flick" r="6"/><circle class="fire2 flick" cx="-5" cy="2" r="4" style="animation-delay:.2s"/></g>`}
function cloud(x,y,s=1,cls='cld'){return `<g transform="translate(${x} ${y}) scale(${s})" class="${cls}"><ellipse cx="0" cy="0" rx="26" ry="9"/><ellipse cx="-12" cy="-6" rx="12" ry="9"/><ellipse cx="6" cy="-9" rx="14" ry="11"/><ellipse cx="18" cy="-3" rx="10" ry="7"/></g>`}

function northArrow(x,y,rot){return `<g transform="translate(${x} ${y})"><circle r="13" class="rose"/><g transform="rotate(${rot})"><path class="narr" d="M0,-11 L4,3 L0,0 L-4,3 Z"/></g><text class="sl" y="27" text-anchor="middle">N</text></g>`}

  g+=`<path class="fir" d="M505,0 C495,80 520,160 500,300"/><text class="firl" transform="translate(512 250) rotate(-86)">FIR BOUNDARY</text>`;
  g+=`<g transform="translate(120 255)"><circle class="vorr" r="24"/>${Array.from({length:36},(_,k)=>`<line class="vort" x1="0" y1="-24" x2="0" y2="${k%9?-21:-18}" transform="rotate(${k*10})"/>`).join('')}<path class="vor" d="M-5,-3 L0,-6 L5,-3 L5,3 L0,6 L-5,3 Z"/><text class="sl" x="30" y="4">VOR/DME 113.4</text></g>`;
  g+=`<polyline class="awy ${o.dev?'faint':''}" points="${WP.map(p=>p.join(',')).join(' ')}"/>`;

  for(let i=0;i<4;i++){const a=WP[i],b=WP[i+1],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,nm=Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])*.42);
    g+=`<g transform="translate(${mx} ${my+(i%2?16:-22)})"><rect class="awb" x="-24" y="-9" width="48" height="14" rx="2"/><text class="awt" x="0" y="2" text-anchor="middle">${AW[i]} ${nm}</text></g>`}
  WP.forEach((p,i)=>{g+=(i===0||i===4)?apt(p[0],p[1],true):wpSym(p[0],p[1],i===1);
    g+=`<text class="wl" x="${Math.min(565,Math.max(38,p[0]))}" y="${p[1]+(i%2?-16:28)}" text-anchor="middle">${esc(names[i].toUpperCase())}</text>`;

function emgScn(e){return e.ref?SCN.find(s=>s.id===e.ref):Object.assign({cls:'s-misc',code:e.sev},e)}
function vEmerg(){
  if(RD.sc&&RD.from==='emergency')return vRadio();
  const sevc={MAYDAY:'sev-m','PAN PAN':'sev-p','7500':'sev-m','NON-ROUTINE':'sev-n'};
  view.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>Emergencies</h1><p class="muted" style="margin-top:6px">Choose a situation and work it with ATC. Each step has its own diagram.</p></div><button class="btn pri" id="erand">Random emergency</button></div>
   <div class="panel eref"><div><span class="lbl">Distress</span><p><b class="mono">MAYDAY ×3</b> grave and imminent danger, immediate assistance needed.</p></div>
    <div><span class="lbl">Urgency</span><p><b class="mono">PAN PAN ×3</b> serious, but no immediate assistance needed.</p></div>
    <div><span class="lbl">Message order</span><p>Station · call sign · nature · intentions · position · level · heading</p></div>
    <div><span class="lbl">Squawk</span><p><b class="mono">7700</b> emergency · <b class="mono">7600</b> radio failure · <b class="mono">7500</b> unlawful interference</p></div></div>
   ${EMG_CATS.map(c=>`<section class="stack" style="gap:8px"><h3>${esc(c)}</h3><div class="egrid">${EMG.filter(e=>e.cat===c).map(e=>{const s=emgScn(e),best=S.stats['radio-'+s.id];return `<button class="ecard" data-e="${e.id}"><span class="sev ${sevc[e.sev]}">${e.sev}</span><b>${esc(e.title)}</b><span class="muted">${esc(e.desc)}</span><span class="emeta mono">${s.steps.length} steps${best!==undefined?' · best '+best+'%':''}</span></button>`}).join('')}</div></section>`).join('')}
  </div>`;
  const start=id=>{const s=emgScn(EMG.find(e=>e.id===id));RD={sc:s,i:0,log:[],tries:0,res:[],fb:'',done:false,st:s.steps[0].st,from:'emergency'};vRadio();speakStep();window.scrollTo(0,0)};
  $$('[data-e]').forEach(b=>b.onclick=()=>start(b.dataset.e));
  $('#erand').onclick=()=>start(pick(EMG).id);
}

function mRwyFor(ad,windDir,r){
  const ds=rwysOf(ad).filter(d=>/^\d{2}[LRC]?$/.test(d));if(!ds.length)return ad.r;
  const diff=d=>{const h=(parseInt(d)||36)*10;let x=Math.abs(((windDir-h)%360+540)%360-180);return x};
  const best=Math.min(...ds.map(diff));const c=ds.filter(d=>diff(d)<=best+1);return mPick(r,c)}
function mAdClone(ad,r,windDir){
  const L=layoutOf(ad);const rw=mRwyFor(ad,windDir,r);
  const stands=(L.std||[]).map(s=>s.n).filter(Boolean);

/* ---------- weather: decode ---------- */
const WXD={MI:'shallow',BC:'patches of',PR:'partial',DR:'low drifting',BL:'blowing',DZ:'drizzle',RA:'rain',SN:'snow',SG:'snow grains',PL:'ice pellets',GR:'hail',GS:'small hail',IC:'ice crystals',UP:'unknown precipitation',BR:'mist',FG:'fog',FU:'smoke',VA:'volcanic ash',DU:'widespread dust',SA:'sand',HZ:'haze',PO:'dust/sand whirls',SQ:'squalls',FC:'funnel cloud',SS:'sandstorm',DS:'duststorm'};

const dh=(d,h,m)=>'day '+d+' '+h+':'+(m||'00')+' UTC';

function decode(str){
  const G=str.trim().toUpperCase().replace(/=+$/,'').split(/\s+/).filter(Boolean);
  const out=[];let sec='main',isTaf=G[0]==='TAF',seenId=false,seenTime=false,rmk=false,prev='',seenValid=false;
  for(const g of G){let c='other',t='Not recognised',m;
    if(rmk){out.push({g,c:'rmk',t:'Remark (national use)',sec:'rmk'});continue}
    if(g==='METAR'||g==='SPECI'||g==='TAF'){c='type';t=g==='TAF'?'Terminal Aerodrome Forecast':g==='SPECI'?'Special weather report':'Routine aerodrome weather report'}
    else if(g==='AMD'){c='type';t='Amended forecast'}else if(g==='COR'){c='type';t='Corrected report'}else if(g==='AUTO'){c='type';t='Fully automated observation'}else if(g==='NIL'){c='type';t='Missing report'}
    else if(!seenId&&/^[A-Z]{4}$/.test(g)){seenId=true;c='id';t='Aerodrome: '+((f=>f?f.n+' ('+g+')':g)(S.ads.find(a=>a.i===g)))}

    else if(m=g.match(/^(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT|MPS)$/)){c='wind';const u=m[4]==='KT'?'kt':'m/s';t=(m[1]==='000'&&+m[2]===0)?'Wind calm':(m[1]==='VRB'?'Wind variable in direction, '+(+m[2])+' '+u:'Wind from '+m[1]+'° at '+(+m[2])+' '+u)+(m[3]?', gusting '+(+m[3])+' '+u:'')}
    else if(m=g.match(/^(\d{3})V(\d{3})$/)){c='windvar';t='Wind direction varying between '+m[1]+'° and '+m[2]+'°'}

    else if(g==='BECMG'){c='change';sec='trend';t='Becoming: gradual, permanent change'}
    else if(g==='TEMPO'){c='change';sec='trend';t='Temporary fluctuations, each under 1 hour, together less than half the period'}

    else if(m=g.match(/^FM(\d{2})(\d{2})(\d{2})$/)){c='fm';sec='trend';t='From '+dh(m[1],m[2],m[3])+': all conditions change'}
    else if(m=g.match(/^(FM|TL|AT)(\d{2})(\d{2})$/)){c='trendtime';t={FM:'From ',TL:'Until ',AT:'At '}[m[1]]+m[2]+':'+m[3]+' UTC'}

    else if(m=g.match(/^(FEW|SCT|BKN|OVC)(\d{3}|\/\/\/)(CB|TCU|\/\/\/)?$/)){c='cloud';t=COV[m[1]]+' at '+(m[2]==='///'?'unknown height':ftxt(m[2]))+(m[3]==='CB'?', cumulonimbus':m[3]==='TCU'?', towering cumulus':'')}

function wGroup(kind){const strong=['ts','dust','windy'].includes(kind);let s=strong?rnd(14,26):rnd(2,13);const d=rnd(1,36)*10;

const KINDS=['fine','fine','windy','shower','fog','mist','ts','snow','dust'];
const tf=v=>(v<0?'M':'')+pad(Math.abs(v));

  const ad=pick(ADS()),id=ad.i,RW=rwysOf(ad),kind=pick(KINDS),w=wGroup(kind),x=wxSet(kind);

function condGroups(kind){const x=wxSet(kind),w=wGroup(kind);return [w.g,...(x.cav?['CAVOK']:[x.vis,...x.wx,...x.cl])]}
function genTaf(){

  const ch=[];let h=rnd(1,4);

function tafChanges(dec){

const TABS=[['home','Home','M3 11l9-7 9 7v9h-6v-6H9v6H3z'],['radio','Radio','M4 14a8 8 0 0 1 16 0M4 14v5h4v-6H4M20 14v5h-4v-6h4'],['emergency','Mayday','M12 3 2 20h20L12 3zM12 10v4M12 17v.5'],['phrases','Phrases','M4 5h16v11H9l-5 4z'],['numbers','Numbers','M9 3 7 21M17 3l-2 18M4 9h17M3 15h17'],['weather','Weather','M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z'],['match','Match','M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z']];
let cur='home';
function go(t,pop){closeFull();closeSheet();document.body.classList.remove('flying');if(!VIEWS[t])t='home';const prev=cur;cur=t;
  if(t!=='phrases'&&PH.ta&&PH.ta.timer){clearInterval(PH.ta.timer);PH.ta=null}
  document.querySelectorAll('.mic.rec').forEach(b=>{try{b._finish&&b._finish()}catch(e){}});$('#nav').innerHTML=TABS.map(([k,l,ic])=>`<button data-t="${k}" title="${l}" aria-current="${k===t}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${ic}"/></svg><span>${l}</span></button>`).join('');view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');$$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));VIEWS[t]();try{if(pop||prev===t||!prev)history.replaceState(null,'','#'+t);else history.pushState(null,'','#'+t)}catch(e){}window.scrollTo(0,0)}
addEventListener('popstate',()=>{if(document.querySelector('.vsheet')){closeSheet();try{history.pushState(null,'','#'+cur)}catch(e){}return}const ff=document.querySelector('body > .scenebox.full');if(ff){const fb=ff.querySelector('[data-z=full]');ff._fromPop=true;if(fb){fb.click();return}}const t=(location.hash||'').slice(1)||'home';if(t!==cur)go(t,true)});
const THEMES=[['auto','◐','Auto theme (follows the phone)'],['light','☀','Day theme'],['dark','☾','Night theme']];
function applyTheme(){const t=S.theme||'auto',r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  const b=document.getElementById('thm');if(b){const x=THEMES.find(q=>q[0]===t)||THEMES[0];b.innerHTML=`<span aria-hidden="true">${x[1]}</span><span class="tl">${t==='auto'?'Auto':t==='light'?'Day':'Night'}</span>`;b.title=x[2]+' · tap to change';b.setAttribute('aria-label',x[2]+'. Tap to change')}
  const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);let m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0D151B':'#E8EDF0'}
document.getElementById('thm').onclick=()=>{const i=THEMES.findIndex(q=>q[0]===(S.theme||'auto'));S.theme=THEMES[(i+1)%3][0];save();applyTheme()};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
applyTheme();
go((location.hash||'').slice(1));
</script>
