<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efefef;--card:#fff;--tx:#111;--mut:#8a8a8e;--pill:#fff;--inp:#f3f3f4;
--g:#2fae66;--o:#f59e2b;--r:#f85151}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e20;--tx:#f2f2f2;--mut:#98989d;--pill:#1e1e20;--inp:#2a2a2d}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e20;--tx:#f2f2f2;--mut:#98989d;--pill:#1e1e20;--inp:#2a2a2d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.25 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.pill{background:var(--pill);border-radius:99px;height:48px;display:flex;align-items:center;padding:0 18px;font-weight:700;font-size:17px;flex:1}
.round{width:48px;height:48px;border-radius:50%;background:var(--pill);border:0;font-size:24px;color:var(--tx);padding:0}
.sum{background:var(--card);border-radius:28px;padding:18px 20px;margin-bottom:14px}
.sum .big{font-size:20px;font-weight:800}
.sum .sub{color:var(--mut);margin-top:4px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{border:0;text-align:left;font:inherit;color:var(--tx);background:var(--card);border-radius:28px;min-height:190px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;width:100%}
.c .t{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut);font-weight:600}
.c .t i{font-style:normal;font-size:22px}
.c .b{font-size:23px;font-weight:800;line-height:1.15}
.c .s{font-size:14px;color:var(--mut);margin-top:6px;font-weight:500}
.c.g,.c.o,.c.r{color:#fff}
.c.g .t,.c.o .t,.c.r .t,.c.g .s,.c.o .s,.c.r .s{color:#fff;opacity:.92}
.c.g{background:var(--g)}.c.o{background:var(--o)}.c.r{background:var(--r)}
.c.add{align-items:center;justify-content:center;color:var(--mut);font-weight:700;background:transparent;border:2px dashed var(--mut);font-size:16px;gap:6px}
.c.add span{font-size:36px;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;font-size:16px;padding:13px;border-radius:14px;border:0;background:var(--inp);color:var(--tx)}
.btn{margin-top:12px;width:100%;padding:14px;border:0;border-radius:16px;font-size:16px;font-weight:700;color:#fff;background:var(--g)}
.btn.sec{background:var(--inp);color:var(--tx)}
.btn.del{background:transparent;color:var(--r)}
.note{color:var(--mut);font-size:13px;margin-top:16px;text-align:center}
.pill{border:0;font:inherit;font-weight:700;font-size:17px;color:var(--tx);text-align:left;gap:8px;overflow:hidden;white-space:nowrap}
.pill span{overflow:hidden;text-overflow:ellipsis;flex:1}
.pill{padding-right:6px}.pill .chev{flex:none;width:38px;height:38px;border-radius:50%;background:var(--inp);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;line-height:1;color:var(--tx)}
.un .nk{display:block;color:var(--g);font-size:14px;font-weight:600;margin-top:1px}
.uv{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;overflow:auto;padding:env(safe-area-inset-top,0px) 14px calc(110px + env(safe-area-inset-bottom,0px))}
.uv.on{display:block}
.uh{display:flex;align-items:center;gap:10px;padding:14px 0;max-width:520px;margin:0 auto}
.uh h1{flex:1;text-align:center;font-size:19px;margin:0 58px 0 0}
.ul{max-width:520px;margin:0 auto}
.u{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:28px;padding:16px;margin-bottom:12px;width:100%;border:2px solid transparent;font:inherit;color:var(--tx);text-align:left}
.u.act{border-color:var(--g)}
.av{width:56px;height:56px;border-radius:18px;background:var(--inp);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.un{flex:1;min-width:0}.un b{display:block;font-size:17px}.un small{color:var(--mut);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.dot.g{background:var(--g)}.dot.o{background:var(--o)}.dot.r{background:var(--r)}
.um{width:44px;height:44px;border-radius:50%;background:var(--inp);border:0;font-size:20px;color:var(--tx);flex:none}
.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.bot .btn{max-width:520px;margin:0 auto;display:block;background:#000;color:#fff;border-radius:22px;padding:18px}
@media (prefers-color-scheme:dark){.bot .btn{background:#f2f2f2;color:#000}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--inp)}
.nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.nav button i{font-style:normal;font-size:24px}
.nav button.on{color:var(--g)}
main{padding-bottom:110px}
.card{background:var(--card);border-radius:28px;padding:18px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:6px 0;color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px;font-weight:800}.stats small{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--inp)}
.fl div{flex:1}.fl small{color:var(--mut);display:block;font-size:13px}.fl b{font-size:17px}
.fl button{border:0;background:var(--inp);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:15px}
.ttl{font-size:22px;font-weight:800;margin:6px 4px 14px}
.lg{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.disp{background:var(--inp);border-radius:20px;padding:14px 16px;margin-bottom:12px;text-align:right;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end}
.disp #ce{font-size:34px;font-weight:800;word-break:break-all}
.disp #cr{color:var(--mut);font-size:18px;min-height:24px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kp button{border:0;border-radius:20px;height:60px;font-size:24px;font-weight:700;background:var(--inp);color:var(--tx)}
.kp .op{background:var(--o);color:#fff}.kp .eq{background:var(--g);color:#fff;grid-column:span 2}
.kp .fn{color:var(--r)}
.nav button.sos{color:var(--r)}.nav button.sos.on{color:var(--r);font-weight:800}
.sosw{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.sosb{flex:1;display:block;background:#d92d2d;color:#fff;border-radius:24px;padding:18px 20px;text-decoration:none;font-weight:800;font-size:21px}
.sosb small{display:block;font-weight:500;font-size:13px;opacity:.9;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sosw .em{width:52px;border:0;border-radius:20px;background:var(--card);color:var(--tx);font-size:20px}
textarea{width:100%;font:inherit;font-size:16px;padding:13px;border-radius:14px;border:0;background:var(--inp);color:var(--tx);min-height:110px;resize:vertical}
.warnr{background:#d92d2d;color:#fff;border-radius:20px;padding:12px 16px;font-size:14px;margin-bottom:12px}
.seg{display:flex;gap:8px}.seg button{flex:1;border:0;border-radius:14px;padding:12px 6px;background:var(--inp);color:var(--tx);font:inherit;font-weight:600;font-size:15px}.seg button.on{background:var(--g);color:#fff}

#intro{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 padding:calc(env(safe-area-inset-top,0px) + 7vh) 20px calc(env(safe-area-inset-bottom,0px) + 4vh);text-align:center;color:#cfe3ff;
 background:radial-gradient(ellipse at 50% 46%,#0b2447 0%,#06142b 45%,#030a16 100%);overflow:hidden;
 font-family:"Bahnschrift","Rajdhani","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;transition:opacity .6s ease,visibility .6s;cursor:pointer}
#intro.out{opacity:0;visibility:hidden}
#intro:before{content:"";position:absolute;inset:0;pointer-events:none;
 background-image:linear-gradient(rgba(80,150,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(80,150,255,.07) 1px,transparent 1px);background-size:34px 34px}
#intro:after{content:"";position:absolute;left:0;right:0;height:22%;top:-22%;pointer-events:none;
 background:linear-gradient(180deg,transparent,rgba(70,170,255,.10),transparent);animation:iscan 3.4s linear infinite}
@keyframes iscan{to{top:110%}}
#intro .cn{position:absolute;width:34px;height:34px;border:2px solid #1e90ff;opacity:.85}
#intro .c1{top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;border-right:0;border-bottom:0}
#intro .c2{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;border-left:0;border-bottom:0}
#intro .c3{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;border-right:0;border-top:0}
#intro .c4{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:14px;border-left:0;border-top:0}
#intro .t1{position:relative;font-weight:800;font-size:clamp(34px,11vw,64px);letter-spacing:.14em;margin-right:-.14em;color:#dce9ff;text-shadow:0 0 22px rgba(60,150,255,.55)}
#intro .t1 b{color:#fff}
#intro .sb{position:relative;display:flex;align-items:center;gap:12px;justify-content:center;margin-top:12px;font-size:clamp(10px,2.6vw,13px);letter-spacing:.42em;color:#6f94c9;font-weight:700}
#intro .sb:before,#intro .sb:after{content:"";height:1px;width:clamp(30px,12vw,90px);background:linear-gradient(90deg,transparent,#2b6fc2)}
#intro .sb:after{transform:scaleX(-1)}
#intro .lg{position:relative;width:min(70vw,330px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;animation:ilg 1s ease-out both}
@keyframes ilg{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
#intro .lg img{width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 0 26px rgba(40,130,255,.55))}
#intro .lg:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(90,170,255,.55);animation:ispin 14s linear infinite}
#intro .lg:after{content:"";position:absolute;inset:-5%;border-radius:50%;border:2px solid transparent;border-top-color:#35a6ff;border-right-color:rgba(53,166,255,.25);animation:ispin 2.6s linear infinite}
@keyframes ispin{to{transform:rotate(360deg)}}
#intro .t2{position:relative;display:inline-block;font-weight:800;font-size:clamp(22px,7.4vw,44px);line-height:1;letter-spacing:.24em;margin-right:-.24em;padding:.35em .3em .35em .54em;white-space:nowrap;color:#35d4ff;text-shadow:0 0 18px rgba(40,200,255,.65);border-top:2px solid #1e90ff;border-bottom:2px solid #1e90ff;background:linear-gradient(90deg,transparent,rgba(30,144,255,.14),transparent)}
#intro .bar{position:relative;display:flex;gap:5px;justify-content:center;margin:16px 0 9px}
#intro .bar i{width:clamp(14px,5vw,24px);height:4px;background:#12305c;animation:iseg .3s ease forwards}
@keyframes iseg{to{background:#2aa4ff;box-shadow:0 0 8px #2aa4ff}}
#intro .sc{position:relative;font-size:10px;letter-spacing:.4em;color:#6f94c9}
#intro .dv{position:relative;margin-top:clamp(14px,3.5vh,30px);font-size:clamp(10px,2.8vw,13px);letter-spacing:.24em;color:#8fb0de}
#intro .dv b{color:#fff;letter-spacing:.24em}
@media (prefers-reduced-motion:reduce){#intro:after,#intro .lg:before,#intro .lg:after{animation:none}}
</style>
</head>

<script>
var WARN=30,S={users:[],active:null},editing=null,editU=null;
function defItems(){return[
{id:"oyap",name:"ОЯП, ОСП R=50,150,300",icon:"📡",months:3,date:""},
{id:"crit",name:"Критический режим",icon:"⚠️",months:6,date:""},
{id:"niao",name:"НИАО",icon:"🧭",months:6,date:""},
{id:"forced",name:"Вынужденное покидание",icon:"🪂",months:6,date:""},
{id:"vlk",name:"ВЛК",icon:"🩺",months:12,date:""},
{id:"umo",name:"УМО",icon:"🎓",months:12,date:""}]}
function load(){
  try{S=JSON.parse(localStorage.getItem("pilot_v3")||"null")}catch(e){S=null}
  if(!S||!S.users||!S.users.length){
    var it=null;try{it=JSON.parse(localStorage.getItem("pilot_items2")||"null")}catch(e){}
    S={users:[{id:"u1",fio:"Пилот",items:it||[]}],active:"u1"};
  }
  if(S.v!==4){
    var map={radius:"oyap",vlk:"vlk"};
    S.users.forEach(function(u){
      var n=defItems(),extra=[];
      (u.items||[]).forEach(function(o){
        var t=map[o.id];
        if(t){n.forEach(function(x){if(x.id===t)x.date=o.date||""})}
        else if(String(o.id).charAt(0)==="x")extra.push(o);
      });
      u.items=n.concat(extra);
    });
    S.v=4;S.n={};save();
  }
  if(!S.n)S.n={};WARN=+S.warn||30;
}
function isNat(){return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())}
function save(){try{localStorage.setItem("pilot_v3",JSON.stringify(S))}catch(e){}scheduleNative()}
function scheduleNative(){
  var LN=isNat()&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!LN)return;
  LN.requestPermissions().then(function(p){
    if(p.display!=="granted")return;
    return LN.getPending().then(function(r){return r.notifications.length?LN.cancel({notifications:r.notifications}):0}).then(function(){
      var list=[],id=1,now=new Date();
      S.users.forEach(function(u){u.items.forEach(function(it){
        if(!it.date)return;
        var due=addM(parse(it.date),+it.months||6),y=due.getFullYear(),m=due.getMonth(),d=due.getDate();
        [[new Date(y,m,d-WARN,9,0),L("dueSoonP")],[new Date(y,m,d,9,0),L("dueNowP")]].forEach(function(x){
          if(x[0]>now)list.push({id:id++,title:L("notifTitle"),body:x[1]+dn(it)+" ("+u.fio+")",schedule:{at:x[0]}});
        });
      })});
      if(list.length)return LN.schedule({notifications:list});
    });
  }).catch(function(){});
}
function cur(){return S.users.filter(function(u){return u.id===S.active})[0]||S.users[0]}

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addM(d,n){var r=new Date(d.getFullYear(),d.getMonth()+n,1),l=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),l));return r}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function st(it){
  if(!it.date)return{cls:"",big:L("noDate"),sub:L("tapSet"),lvl:-1};
  var due=addM(parse(it.date),+it.months||6),t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var d=Math.round((due-t)/864e5),sub=L("until",{s:fmt(due)});
  if(d<0)return{cls:"r",big:L("overdue",{n:-d}),sub:L("wasDue",{s:fmt(due)}),lvl:2};
  if(d===0)return{cls:"r",big:L("dueToday"),sub:L("timeToDo"),lvl:2};
  if(d<=WARN)return{cls:"o",big:L("leftD",{n:d}),sub:sub,lvl:1};
  return{cls:"g",big:d>60?L("leftM",{n:Math.round(d/30.4)}):L("leftD",{n:d}),sub:sub,lvl:0};
}

  '<label>'+L("nick")+'</label><input id="un" value="'+esc(u.nick?"@"+u.nick:"")+'" placeholder="@username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email"><div class="note" id="unE" style="text-align:left;margin-top:6px">'+L("nickHint")+'</div>'+
  '<button class="btn" id="us">'+L("save")+'</button>'+(id!=="new"?'<button class="btn sec" id="pshare">📤 '+L("shareB")+'</button>':'<div class="note" style="margin:14px 0 0">'+L("orOther")+'</div><button class="btn sec" id="pimpo">🔗 '+L("impB")+'</button>')+(id!=="new"&&S.users.length>1?'<button class="btn del" id="ud">'+L("delUser")+'</button>':'')+'<button class="btn sec" id="uc">'+L("close")+'</button>';

function showUsers(on){renderUsers();document.getElementById("uv").classList.toggle("on",on)}
document.addEventListener("click",function(e){
  var m=e.target.closest("[data-um]");if(m){openUser(m.getAttribute("data-um"));return}
  var u=e.target.closest("[data-u]");if(u){S.active=u.getAttribute("data-u");save();render();showUsers(false);return}
  var id=e.target.id;
  if(id==="who"||e.target.closest("#who"))showUsers(true);
  else if(id==="ub")showUsers(false);
  else if(id==="nb"){try{Notification.requestPermission().then(function(){renderN();notify()})}catch(e){}}
  else if(id==="au")openUser("new");
  else if(id==="uc")close();
  else if(id==="us"){var f=document.getElementById("uf").value.trim();if(!f){document.getElementById("uf").focus();return}
    var nk=document.getElementById("un").value.trim().replace(/^@+/,"").toLowerCase(),ne=document.getElementById("unE");
    if(nk&&!/^[a-z0-9_]{3,20}$/.test(nk)){ne.textContent=L("nickBad");ne.style.color="var(--r)";document.getElementById("un").focus();return}
    if(nk&&S.users.some(function(x){return x.id!==editU&&x.nick===nk})){ne.textContent=L("nickTaken");ne.style.color="var(--r)";document.getElementById("un").focus();return}
    if(editU==="new"){var nu={id:"u"+Date.now(),fio:f,nick:nk,items:defItems()};S.users.push(nu);S.active=nu.id;save();render();close();showUsers(false)}
    else{S.users.forEach(function(x){if(x.id===editU){x.fio=f;x.nick=nk}});save();render();renderUsers();close()}}
  else if(id==="ud"){if(confirm(L("delUserQ"))){S.users=S.users.filter(function(x){return x.id!==editU});if(S.active===editU)S.active=S.users[0].id;save();render();renderUsers();close()}}
});
function pad(n){return String(n).padStart(2,"0")}
function hm(m){return Math.floor(m/60)+":"+pad(m%60)}
function tm(v){var p=(v||"").split(":");return p.length==2?(+p[0])*60+(+p[1]):null}
function renderCalc(){
  var u=cur();if(!u.flights)u.flights=[];
  var now=new Date(),ym=iso(now).slice(0,7),y=String(now.getFullYear()),all=0,mo=0,yr=0;
  u.flights.forEach(function(f){all+=f.min;if(f.date.slice(0,7)===ym)mo+=f.min;if(f.date.slice(0,4)===y)yr+=f.min});
  var list=u.flights.map(function(f,i){return{f:f,i:i}}).sort(function(a,b){return a.f.date<b.f.date?1:-1}).slice(0,30).map(function(x){
    return '<div class="fl"><div><b>'+hm(x.f.min)+'</b><small>'+fmt(parse(x.f.date))+(x.f.off?' · '+x.f.off+'–'+x.f.on:'')+'</small></div><button data-fd="'+x.i+'" aria-label="Удалить">✕</button></div>'}).join("");
  document.getElementById("v2").innerHTML='<div class="ttl">'+L("calcT")+'</div>'+
  '<div class="card"><div class="disp"><div id="cr"></div><div id="ce">0</div></div><div class="kp">'+
  [["C","C","fn"],["B","⌫","fn"],["÷","÷","op"],["×","×","op"],["7","7"],["8","8"],["9","9"],["−","−","op"],["4","4"],["5","5"],["6","6"],["+","+","op"],["1","1"],["2","2"],["3","3"],[":",":"],["0","0"],["00","00"],["=","=","eq"]].map(function(k){return '<button data-k="'+k[0]+'" class="'+(k[2]||"")+'">'+k[1]+'</button>'}).join("")+'</div></div>'+
  '<div class="card"><h3>'+L("flightH")+' · '+esc(u.fio)+'</h3><div class="stats"><div><b>'+hm(all)+'</b><small>'+L("total")+'</small></div><div><b>'+hm(mo)+'</b><small>'+L("month")+'</small></div><div><b>'+hm(yr)+'</b><small>'+L("year")+'</small></div></div></div>'+
  '<div class="card"><h3>'+L("addFl")+'</h3><label>'+L("dateL")+'</label><input id="cd" type="date" value="'+iso(now)+'">'+
  '<div class="two"><div><label>'+L("tko")+'</label><input id="co" type="time"></div><div><label>'+L("ldg")+'</label><input id="cn" type="time"></div></div>'+
  '<label>'+L("manual")+'</label><input id="cm" placeholder="1:25" inputmode="numeric">'+
  '<button class="btn" id="cadd">'+L("add")+'</button></div>'+
  '<div class="card"><h3>'+L("lastFl")+'</h3>'+(list||'<p>'+L("noRec")+'</p>')+'</div>';
  updTC();
}
var cx="",cdone=false,OPS="+−×÷";
function numT(t){if(t.indexOf(":")>=0){var p=t.split(":");return{v:(+p[0])*60+(+p[1]),t:true}}return{v:+t,t:false}}
function evalFull(e){
  var tk=e.match(/\d+(?::\d+)?|[+−×÷]/g);if(!tk||!/\d$/.test(e))return null;
  if(OPS.indexOf(tk[0])>=0)tk.unshift("0");
  var a=[numT(tk[0])],ops=[],i,l,b,op,r;
  for(i=1;i<tk.length;i+=2){
    op=tk[i];b=numT(tk[i+1]);
    if(op==="×"||op==="÷"){
      l=a.pop();
      if(op==="×"){if(l.t&&b.t)return null;r={v:l.v*b.v,t:l.t||b.t}}
      else{if(b.v===0||(!l.t&&b.t))return null;r={v:l.v/b.v,t:l.t&&!b.t}}
      a.push(r);
    }else{ops.push(op);a.push(b)}
  }
  var cur0=a[0],j,y;
  for(j=0;j<ops.length;j++){
    var x=cur0.t?cur0.v:cur0.v*60;y=a[j+1].t?a[j+1].v:a[j+1].v*60;
    cur0={v:ops[j]==="+"?x+y:x-y,t:true};
  }
  if(cur0.t){var m=Math.round(cur0.v);return(m<0?"−":"")+hm(Math.abs(m))}
  var n=parseFloat(cur0.v.toFixed(4));return(n<0?"−":"")+Math.abs(n)
}
function updTC(){
  var ce=document.getElementById("ce"),cr=document.getElementById("cr");if(!ce)return;
  ce.textContent=cx||"0";
  var r=(!cdone&&cx.slice(1).search(/[+−×÷]/)>=0)?evalFull(cx):null;
  cr.textContent=r?"= "+r:"";
}
function press(k){
  if(k==="C"){cx="";cdone=false}
  else if(k==="B"){cx=cdone?"":cx.slice(0,-1);cdone=false}
  else if(k==="="){var r=evalFull(cx);if(r!=null){cx=r;cdone=true}}
  else if(OPS.indexOf(k)>=0){
    if(!cx){if(k==="−")cx="−"}
    else if(OPS.indexOf(cx.slice(-1))>=0){if(cx.length>1)cx=cx.slice(0,-1)+k}
    else if(cx.slice(-1)!==":")cx+=k;
    cdone=false;
  }
  else if(k===":"){var n=(cx.match(/[\d:]*$/)||[""])[0];if(n&&n.indexOf(":")<0)cx+=":"}
  else{if(cdone){cx="";cdone=false}cx+=k}
  updTC();
}
document.addEventListener("click",function(e){var k=e.target.closest("[data-k]");if(k)press(k.getAttribute("data-k"))});
function addFlight(){
  var d=document.getElementById("cd").value,o=document.getElementById("co").value,n=document.getElementById("cn").value,m=document.getElementById("cm").value.trim(),min=null;
  if(m){var t=tm(m.replace(/[.,]/g,":"));if(t==null||isNaN(t)){alert(L("fmtErr"));return}min=t}
  else if(o&&n){var a=tm(o),b=tm(n);min=b-a;if(min<0)min+=1440}
  if(!d||!min||min<=0){alert(L("needFl"));return}
  var f={date:d,min:min};if(!m){f.off=o;f.on=n}
  var u=cur();if(!u.flights)u.flights=[];u.flights.push(f);save();renderCalc();
}

/* ---- Profile transfer by @username: QR code or text code, no internet server ---- */
var PX={pending:null,stream:null,raf:0};
function b64e(bytes){var s="";for(var i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64d(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";var s=atob(t),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
function streamBytes(bytes,ts){return new Response(new Blob([bytes]).stream().pipeThrough(ts)).arrayBuffer().then(function(a){return new Uint8Array(a)})}
function packUser(u){
  var o={v:1,f:u.fio,n:u.nick||"",i:(u.items||[]).map(function(x){return[x.id,x.name,x.icon,+x.months||6,x.date||""]}),
    l:(u.flights||[]).map(function(f){return f.off?[f.date,f.min,f.off,f.on]:[f.date,f.min]})};
  var raw=new TextEncoder().encode(JSON.stringify(o)),plain="PH1:"+b64e(raw);
  if(typeof CompressionStream==="undefined")return Promise.resolve(plain);
  return streamBytes(raw,new CompressionStream("deflate")).then(function(z){var c="PH1Z:"+b64e(z);return c.length<plain.length?c:plain}).catch(function(){return plain});
}
function unpackUser(code){
  code=String(code||"").replace(/\s+/g,"");var m=/^PH1(Z?):([A-Za-z0-9_-]+)$/.exec(code);
  if(!m)return Promise.reject(new Error("bad"));
  var bytes;try{bytes=b64d(m[2])}catch(e){return Promise.reject(new Error("bad"))}
  var p;
  if(m[1]){if(typeof DecompressionStream==="undefined")return Promise.reject(new Error("old"));p=streamBytes(bytes,new DecompressionStream("deflate"))}
  else p=Promise.resolve(bytes);
  return p.then(function(b){
    var o=JSON.parse(new TextDecoder().decode(b));if(!o||o.v!==1||!o.f||!Array.isArray(o.i))throw new Error("bad");
    return{fio:String(o.f),nick:String(o.n||"").toLowerCase(),
      items:o.i.map(function(x){return{id:String(x[0]),name:String(x[1]),icon:String(x[2]||""),months:+x[3]||6,date:String(x[4]||"")}}),
      flights:(o.l||[]).map(function(x){var f={date:String(x[0]),min:+x[1]};if(x[2]){f.off=x[2];f.on=x[3]}return f})};
  });
}
function loadScript(src){return new Promise(function(ok,no){if(src==="qr.js"&&window.qrcode||src==="jsqr.js"&&window.jsQR)return ok();var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function sheet(h){document.getElementById("sheet").innerHTML=h;document.getElementById("ov").classList.add("on")}
function shareProfile(id){
  var u=S.users.filter(function(x){return x.id===id})[0];if(!u)return;
  if(!u.nick){var ne=document.getElementById("unE");if(ne){ne.textContent=L("needNick");ne.style.color="var(--r)";document.getElementById("un").focus()}return}
  packUser(u).then(function(code){
    sheet('<h2>'+L("shareT")+' @'+esc(u.nick)+'</h2><div id="qrb" style="background:#fff;border-radius:20px;padding:14px;display:flex;justify-content:center"></div>'+
      '<p class="note" style="text-align:left">'+L("shareHow")+'</p><label>'+L("codeL")+'</label><textarea id="pcode" readonly style="min-height:80px;font-size:13px;word-break:break-all">'+esc(code)+'</textarea>'+
      '<button class="btn" id="pcopy">'+L("copyC")+'</button>'+(navigator.share?'<button class="btn sec" id="psend">'+L("sendC")+'</button>':'')+'<button class="btn sec" id="uc">'+L("close")+'</button>');
    loadScript("qr.js").then(function(){
      var q=null;try{q=qrcode(0,"L");q.addData(code,"Byte");q.make()}catch(e){q=null}
      var box=document.getElementById("qrb");if(!box)return;
      if(!q){box.innerHTML='<div style="color:#111;padding:20px;text-align:center">'+L("qrBig")+'</div>';return}
      box.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});var sv=box.querySelector("svg");if(sv){sv.style.width="100%";sv.style.maxWidth="320px";sv.style.height="auto"}
    }).catch(function(){var box=document.getElementById("qrb");if(box)box.style.display="none"});
  });
}
function importSheet(){
  sheet('<h2>'+L("impT")+'</h2><p class="note" style="text-align:left;margin-top:0">'+L("impHow")+'</p><button class="btn" id="pscan">📷 '+L("scanQ")+'</button>'+
    '<label>'+L("orCode")+'</label><textarea id="pin" placeholder="PH1…" autocapitalize="none" autocorrect="off" spellcheck="false" style="min-height:80px;font-size:13px"></textarea><div class="note" id="pinE" style="text-align:left;margin-top:6px;color:var(--r)"></div>'+
    '<button class="btn" id="pimp">'+L("addC")+'</button><button class="btn sec" id="uc">'+L("close")+'</button>');
}
function applyImport(code){
  return unpackUser(code).then(function(p){
    var ex=p.nick?S.users.filter(function(x){return x.nick===p.nick})[0]:null;
    if(ex){if(!confirm(L("updQ",{n:"@"+p.nick})))return;ex.fio=p.fio;ex.items=p.items;ex.flights=p.flights;S.active=ex.id}
    else{var nu={id:"u"+Date.now(),fio:p.fio,nick:p.nick,items:p.items,flights:p.flights};S.users.push(nu);S.active=nu.id}
    save();render();close();showUsers(false);
  }).catch(function(e){var el=document.getElementById("pinE");var msg=e&&e.message==="old"?L("codeOld"):L("codeBad");if(el)el.textContent=msg;else alert(msg)});
}
function stopScan(){if(PX.raf)cancelAnimationFrame(PX.raf);PX.raf=0;if(PX.stream){PX.stream.getTracks().forEach(function(t){t.stop()});PX.stream=null}var o=document.getElementById("scov");if(o)o.parentNode.removeChild(o)}
function startScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById("pinE").textContent=L("noCam");return}
  var o=document.createElement("div");o.id="scov";o.style.cssText="position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)";
  o.innerHTML='<video id="scv" playsinline muted autoplay style="width:100%;max-width:480px;border-radius:20px"></video><p style="color:#fff;text-align:center;margin:14px 0">'+L("scanHint")+'</p><button class="btn sec" id="scx" style="max-width:480px">'+L("close")+'</button>';
  document.body.appendChild(o);
  loadScript("jsqr.js").then(function(){return navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})}).then(function(st){
    PX.stream=st;var v=document.getElementById("scv");if(!v){stopScan();return}v.srcObject=st;v.play().catch(function(){});
    var c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
    (function tick(){
      if(!PX.stream)return;
      if(v.readyState>=2&&v.videoWidth){var w=Math.min(800,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;x.drawImage(v,0,0,w,h);
        var r=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});
        if(r&&/^PH1Z?:/.test(r.data)){stopScan();var t=document.getElementById("pin");if(t)t.value=r.data;applyImport(r.data);return}}
      PX.raf=requestAnimationFrame(tick);
    })();
  }).catch(function(){stopScan();var e=document.getElementById("pinE");if(e)e.textContent=L("noCam")});
}
document.addEventListener("click",function(e){
  var id=e.target.id;
  if(id==="pshare")shareProfile(editU);
  else if(id==="pimpo")importSheet();
  else if(id==="pscan")startScan();
  else if(id==="scx")stopScan();
  else if(id==="pimp")applyImport(document.getElementById("pin").value);
  else if(id==="pcopy"){var t=document.getElementById("pcode");var done=function(){e.target.textContent=L("copied")};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,function(){t.select();document.execCommand("copy");done()});else{t.select();document.execCommand("copy");done()}}
  else if(id==="psend"){navigator.share({text:document.getElementById("pcode").value}).catch(function(){})}
});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
