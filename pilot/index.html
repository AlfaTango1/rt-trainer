<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efefef;--card:#fff;--tx:#111;--mut:#8a8a8e;--pill:#fff;--inp:#f3f3f4;
--g:#2fae66;--o:#f59e2b;--r:#f85151}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e20;--tx:#f2f2f2;--mut:#98989d;--pill:#1e1e20;--inp:#2a2a2d}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e20;--tx:#f2f2f2;--mut:#98989d;--pill:#1e1e20;--inp:#2a2a2d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.25 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.pill{background:var(--pill);border-radius:99px;height:48px;display:flex;align-items:center;padding:0 18px;font-weight:700;font-size:17px;flex:1}
.round{width:48px;height:48px;border-radius:50%;background:var(--pill);border:0;font-size:24px;color:var(--tx);padding:0}
.sum{background:var(--card);border-radius:28px;padding:18px 20px;margin-bottom:14px}
.sum .big{font-size:20px;font-weight:800}
.sum .sub{color:var(--mut);margin-top:4px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{border:0;text-align:left;font:inherit;color:var(--tx);background:var(--card);border-radius:28px;min-height:190px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;width:100%}
.c .t{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut);font-weight:600}
.c .t i{font-style:normal;font-size:22px}
.c .b{font-size:23px;font-weight:800;line-height:1.15}
.c .s{font-size:14px;color:var(--mut);margin-top:6px;font-weight:500}
.c.g,.c.o,.c.r{color:#fff}
.c.g .t,.c.o .t,.c.r .t,.c.g .s,.c.o .s,.c.r .s{color:#fff;opacity:.92}
.c.g{background:var(--g)}.c.o{background:var(--o)}.c.r{background:var(--r)}
.c.add{align-items:center;justify-content:center;color:var(--mut);font-weight:700;background:transparent;border:2px dashed var(--mut);font-size:16px;gap:6px}
.c.add span{font-size:36px;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;font-size:16px;padding:13px;border-radius:14px;border:0;background:var(--inp);color:var(--tx)}
.btn{margin-top:12px;width:100%;padding:14px;border:0;border-radius:16px;font-size:16px;font-weight:700;color:#fff;background:var(--g)}
.btn.sec{background:var(--inp);color:var(--tx)}
.btn.del{background:transparent;color:var(--r)}
.note{color:var(--mut);font-size:13px;margin-top:16px;text-align:center}
.pill{border:0;font:inherit;font-weight:700;font-size:17px;color:var(--tx);text-align:left;gap:8px;overflow:hidden;white-space:nowrap}
.pill span{overflow:hidden;text-overflow:ellipsis;flex:1}
.uv{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;overflow:auto;padding:env(safe-area-inset-top,0px) 14px calc(110px + env(safe-area-inset-bottom,0px))}
.uv.on{display:block}
.uh{display:flex;align-items:center;gap:10px;padding:14px 0;max-width:520px;margin:0 auto}
.uh h1{flex:1;text-align:center;font-size:19px;margin:0 58px 0 0}
.ul{max-width:520px;margin:0 auto}
.u{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:28px;padding:16px;margin-bottom:12px;width:100%;border:2px solid transparent;font:inherit;color:var(--tx);text-align:left}
.u.act{border-color:var(--g)}
.av{width:56px;height:56px;border-radius:18px;background:var(--inp);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.un{flex:1;min-width:0}.un b{display:block;font-size:17px}.un small{color:var(--mut);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.dot.g{background:var(--g)}.dot.o{background:var(--o)}.dot.r{background:var(--r)}
.um{width:44px;height:44px;border-radius:50%;background:var(--inp);border:0;font-size:20px;color:var(--tx);flex:none}
.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.bot .btn{max-width:520px;margin:0 auto;display:block;background:#000;color:#fff;border-radius:22px;padding:18px}
@media (prefers-color-scheme:dark){.bot .btn{background:#f2f2f2;color:#000}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--inp)}
.nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.nav button i{font-style:normal;font-size:24px}
.nav button.on{color:var(--g)}
main{padding-bottom:110px}
.card{background:var(--card);border-radius:28px;padding:18px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:6px 0;color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px;font-weight:800}.stats small{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--inp)}
.fl div{flex:1}.fl small{color:var(--mut);display:block;font-size:13px}.fl b{font-size:17px}
.fl button{border:0;background:var(--inp);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:15px}
.ttl{font-size:22px;font-weight:800;margin:6px 4px 14px}
.lg{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.disp{background:var(--inp);border-radius:20px;padding:14px 16px;margin-bottom:12px;text-align:right;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end}
.disp #ce{font-size:34px;font-weight:800;word-break:break-all}
.disp #cr{color:var(--mut);font-size:18px;min-height:24px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kp button{border:0;border-radius:20px;height:60px;font-size:24px;font-weight:700;background:var(--inp);color:var(--tx)}
.kp .op{background:var(--o);color:#fff}.kp .eq{background:var(--g);color:#fff;grid-column:span 2}
.kp .fn{color:var(--r)}
.nav button.sos{color:var(--r)}.nav button.sos.on{color:var(--r);font-weight:800}
.sosw{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.sosb{flex:1;display:block;background:#d92d2d;color:#fff;border-radius:24px;padding:18px 20px;text-decoration:none;font-weight:800;font-size:21px}
.sosb small{display:block;font-weight:500;font-size:13px;opacity:.9;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sosw .em{width:52px;border:0;border-radius:20px;background:var(--card);color:var(--tx);font-size:20px}
textarea{width:100%;font:inherit;font-size:16px;padding:13px;border-radius:14px;border:0;background:var(--inp);color:var(--tx);min-height:110px;resize:vertical}
.warnr{background:#d92d2d;color:#fff;border-radius:20px;padding:12px 16px;font-size:14px;margin-bottom:12px}
.seg{display:flex;gap:8px}.seg button{flex:1;border:0;border-radius:14px;padding:12px 6px;background:var(--inp);color:var(--tx);font:inherit;font-weight:600;font-size:15px}.seg button.on{background:var(--g);color:#fff}

#intro{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 padding:calc(env(safe-area-inset-top,0px) + 7vh) 20px calc(env(safe-area-inset-bottom,0px) + 4vh);text-align:center;color:#cfe3ff;
 background:radial-gradient(ellipse at 50% 46%,#0b2447 0%,#06142b 45%,#030a16 100%);overflow:hidden;
 font-family:"Bahnschrift","Rajdhani","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;transition:opacity .6s ease,visibility .6s;cursor:pointer}
#intro.out{opacity:0;visibility:hidden}
#intro:before{content:"";position:absolute;inset:0;pointer-events:none;
 background-image:linear-gradient(rgba(80,150,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(80,150,255,.07) 1px,transparent 1px);background-size:34px 34px}
#intro:after{content:"";position:absolute;left:0;right:0;height:22%;top:-22%;pointer-events:none;
 background:linear-gradient(180deg,transparent,rgba(70,170,255,.10),transparent);animation:iscan 3.4s linear infinite}
@keyframes iscan{to{top:110%}}
#intro .cn{position:absolute;width:34px;height:34px;border:2px solid #1e90ff;opacity:.85}
#intro .c1{top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;border-right:0;border-bottom:0}
#intro .c2{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;border-left:0;border-bottom:0}
#intro .c3{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;border-right:0;border-top:0}
#intro .c4{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:14px;border-left:0;border-top:0}
#intro .t1{position:relative;font-weight:800;font-size:clamp(34px,11vw,64px);letter-spacing:.14em;margin-right:-.14em;color:#dce9ff;text-shadow:0 0 22px rgba(60,150,255,.55)}
#intro .t1 b{color:#fff}
#intro .sb{position:relative;display:flex;align-items:center;gap:12px;justify-content:center;margin-top:12px;font-size:clamp(10px,2.6vw,13px);letter-spacing:.42em;color:#6f94c9;font-weight:700}
#intro .sb:before,#intro .sb:after{content:"";height:1px;width:clamp(30px,12vw,90px);background:linear-gradient(90deg,transparent,#2b6fc2)}
#intro .sb:after{transform:scaleX(-1)}
#intro .lg{position:relative;width:min(70vw,330px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;animation:ilg 1s ease-out both}
@keyframes ilg{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
#intro .lg img{width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 0 26px rgba(40,130,255,.55))}
#intro .lg:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(90,170,255,.55);animation:ispin 14s linear infinite}
#intro .lg:after{content:"";position:absolute;inset:-5%;border-radius:50%;border:2px solid transparent;border-top-color:#35a6ff;border-right-color:rgba(53,166,255,.25);animation:ispin 2.6s linear infinite}
@keyframes ispin{to{transform:rotate(360deg)}}
#intro .t2{position:relative;display:inline-block;font-weight:800;font-size:clamp(22px,7.4vw,44px);line-height:1;letter-spacing:.24em;margin-right:-.24em;padding:.35em .3em .35em .54em;white-space:nowrap;color:#35d4ff;text-shadow:0 0 18px rgba(40,200,255,.65);border-top:2px solid #1e90ff;border-bottom:2px solid #1e90ff;background:linear-gradient(90deg,transparent,rgba(30,144,255,.14),transparent)}
#intro .bar{position:relative;display:flex;gap:5px;justify-content:center;margin:16px 0 9px}
#intro .bar i{width:clamp(14px,5vw,24px);height:4px;background:#12305c;animation:iseg .3s ease forwards}
@keyframes iseg{to{background:#2aa4ff;box-shadow:0 0 8px #2aa4ff}}
#intro .sc{position:relative;font-size:10px;letter-spacing:.4em;color:#6f94c9}
#intro .dv{position:relative;margin-top:clamp(14px,3.5vh,30px);font-size:clamp(10px,2.8vw,13px);letter-spacing:.24em;color:#8fb0de}
#intro .dv b{color:#fff;letter-spacing:.24em}
@media (prefers-reduced-motion:reduce){#intro:after,#intro .lg:before,#intro .lg:after{animation:none}}

select{width:100%;font-size:16px;padding:13px;border-radius:14px;border:0;background:var(--inp);color:var(--tx)}
.kr{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--inp)}
.kr>div{flex:1;min-width:0}.kr small{color:var(--mut);display:block;font-size:13px}
.kr b{overflow-wrap:anywhere}
.kr button{border:0;border-radius:12px;padding:9px 12px;font:inherit;font-weight:600;font-size:14px;background:var(--inp);color:var(--tx);flex:none}
.kr button.ok{background:var(--g);color:#fff}
.kmsg{margin:10px 0 0;font-size:14px;color:var(--mut)}
.kh{margin:18px 0 4px!important}
.nav button{position:relative}
.kb{position:absolute;top:0;left:56%;background:var(--r);color:#fff;font:700 11px/16px sans-serif;min-width:16px;padding:0 4px;border-radius:8px;text-align:center;font-style:normal}

/* pilots drawer: slides in from the left; list scrolls, add-button stays at the bottom */
.uv{display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top,0px) 14px 0;visibility:hidden;transform:translateX(-102%);transition:transform .34s cubic-bezier(.22,.9,.3,1),visibility 0s linear .34s}
.uv.on{display:flex;visibility:visible;transform:none;transition:transform .34s cubic-bezier(.22,.9,.3,1),visibility 0s}
@media (prefers-reduced-motion:reduce){.uv,.uv.on{transition:none}}
.uv .uh{flex:none;width:100%}
.uv .ul{flex:1;min-height:0;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.uv .bot{position:static;flex:none;width:100%;max-width:520px;margin:0 auto;padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));background:none}
/* pilot card */
.pc{position:relative;background:var(--card);border-radius:30px;padding:16px 16px 12px;margin-bottom:12px;border:2px solid transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pc.act{border-color:var(--g)}
.pc .ph{display:flex;align-items:flex-start;gap:14px;padding-right:54px}
.pc .pi{width:56px;height:56px;border-radius:18px;background:var(--inp);display:flex;align-items:center;justify-content:center;flex:none;color:var(--tx)}
.pc .pi svg{width:32px;height:32px}
.pc .pt{flex:1;min-width:0}
.pc .pn{color:var(--tx);font-size:24px;font-weight:700;line-height:1.18}
.pc .pn span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pst{display:flex;align-items:center;margin-top:7px;font-size:18px;font-weight:600;color:var(--tx)}
.pc .pst .dot{width:16px;height:16px;margin-right:8px;flex:none}
.pc .yak{display:block;width:100%;height:auto;margin:8px 0 0}
.pc .pb{position:relative;display:flex;justify-content:center;align-items:center;min-height:56px;margin-top:2px}
.pc .cs{border:2px solid var(--tx);border-radius:10px;padding:5px 14px;font-weight:800;font-size:22px;letter-spacing:1px;max-width:calc(100% - 116px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .cs.no{border-color:var(--mut);color:var(--mut);font-size:15px;font-weight:600;letter-spacing:0}
.pc .um{position:absolute;right:14px;top:14px;margin:0}
.pc .mv{position:absolute;right:0;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;background:var(--inp);border:0;color:var(--tx);padding:0;display:flex;align-items:center;justify-content:center}
.icp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icp button{border:2px solid transparent;border-radius:14px;background:var(--inp);height:50px;color:var(--tx);padding:0;display:flex;align-items:center;justify-content:center}
.icp button svg{width:26px;height:26px}
.icp button.on{border-color:var(--g);color:var(--g)}
.mvg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mvg button{border:2px solid transparent;border-radius:14px;background:var(--inp);height:54px;font:inherit;font-size:20px;font-weight:700;color:var(--tx)}
.mvg button.on{border-color:var(--g);color:var(--g)}
#menuBtn svg{display:block;margin:auto}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.c{min-width:0;overflow:hidden}
.c .t,.c .b,.c .s{min-width:0;overflow-wrap:anywhere}
.pc .rb{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:99px;background:var(--inp);color:var(--mut);font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmn{margin:0 0 6px;color:var(--mut);font-size:15px}.rmn b{color:var(--tx)}
</style>
</head>

var cx="",cdone=false,OPS="+−×÷";
function numT(t){if(t.indexOf(":")>=0){var p=t.split(":");return{v:(+p[0])*60+(+p[1]),t:true}}return{v:+t,t:false}}
function evalFull(e){
  var tk=e.match(/\d+(?::\d+)?|[+−×÷]/g);if(!tk||!/\d$/.test(e))return null;
  if(OPS.indexOf(tk[0])>=0)tk.unshift("0");
  var a=[numT(tk[0])],ops=[],i,l,b,op,r;
  for(i=1;i<tk.length;i+=2){
    op=tk[i];b=numT(tk[i+1]);
    if(op==="×"||op==="÷"){
      l=a.pop();
      if(op==="×"){if(l.t&&b.t)return null;r={v:l.v*b.v,t:l.t||b.t}}
      else{if(b.v===0||(!l.t&&b.t))return null;r={v:l.v/b.v,t:l.t&&!b.t}}
      a.push(r);
    }else{ops.push(op);a.push(b)}
  }
  var cur0=a[0],j,y;
  for(j=0;j<ops.length;j++){
    var x=cur0.t?cur0.v:cur0.v*60;y=a[j+1].t?a[j+1].v:a[j+1].v*60;
    cur0={v:ops[j]==="+"?x+y:x-y,t:true};
  }
  if(cur0.t){var m=Math.round(cur0.v);return(m<0?"−":"")+hm(Math.abs(m))}
  var n=parseFloat(cur0.v.toFixed(4));return(n<0?"−":"")+Math.abs(n)
}
function updTC(){
  var ce=document.getElementById("ce"),cr=document.getElementById("cr");if(!ce)return;
  ce.textContent=cx||"0";
  var r=(!cdone&&cx.slice(1).search(/[+−×÷]/)>=0)?evalFull(cx):null;
  cr.textContent=r?"= "+r:"";
}
function press(k){
  if(k==="C"){cx="";cdone=false}
  else if(k==="B"){cx=cdone?"":cx.slice(0,-1);cdone=false}
  else if(k==="="){var r=evalFull(cx);if(r!=null){cx=r;cdone=true}}
  else if(OPS.indexOf(k)>=0){
    if(!cx){if(k==="−")cx="−"}
    else if(OPS.indexOf(cx.slice(-1))>=0){if(cx.length>1)cx=cx.slice(0,-1)+k}
    else if(cx.slice(-1)!==":")cx+=k;
    cdone=false;
  }
  else if(k===":"){var n=(cx.match(/[\d:]*$/)||[""])[0];if(n&&n.indexOf(":")<0)cx+=":"}
  else{if(cdone){cx="";cdone=false}cx+=k}
  updTC();
}

function nm(id){return K.names[id]||"?"}
function val(id){var e=document.getElementById(id);return e?e.value:""}
function okDate(s){return typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(parse(s))===s}
function okRec(p){
  if(!p||typeof p!=="object")return false;
  if(p.pid!=null&&!(typeof p.pid==="string"&&p.pid.length<=40))return false;
  if(p.k==="flight")return okDate(p.date)&&Number.isInteger(p.min)&&p.min>0&&p.min<=1440;
  if(p.k==="check")return okDate(p.date)&&(CK.indexOf(p.id)>=0||/^x\d{1,16}$/.test(p.id));
  return false;
}
/* local pilot an incoming entry is meant for: the one it names, else the selected local pilot */
function tgt(p){return S.users.filter(function(u){return u.id===p.pid})[0]||curL()}
function recText(p){
  if(p.k==="flight")return L("cl_flight")+" "+hm(p.min)+" · "+fmt(parse(p.date));
  var it=tgt(p).items.filter(function(x){return x.id===p.id})[0];
  return (it?dn(it):L("it_"+p.id))+" — "+fmt(parse(p.date));
}
function pushRec(owner,p,isFlight){
  if(!sb||!K.s){alert(L("cl_off"));return}
  sb.from("user_data").insert({owner_id:owner,added_by:K.s.user.id,payload:p}).then(function(r){
    if(r.error){alert(L("cl_denied"));return}
    close();alert(L("cl_sent"));if(isFlight)renderCalc();
  },function(){alert(L("cl_off"))});
}

/* what other accounts see of us: pilots with checks and flights, no settings */
function pubData(){
  return{v:1,pilots:S.users.map(function(u){return{id:u.id,fio:u.fio,call:u.call||"",ic:+u.ic||0,
    items:u.items.map(function(it){return{id:it.id,name:it.name,icon:it.icon||"",months:+it.months||6,date:it.date||""}}),
    flights:(u.flights||[]).slice(-1000)}})};
}
function schedulePub(){
  if(typeof K==="undefined"||!K||!K.s)return;
  clearTimeout(K.pubT);K.pubT=setTimeout(publish,1500);
}
async function publish(){
  if(!sb||!K.s)return;
  var me=K.s.user.id,shared=K.grants.some(function(g){return g.owner_id===me&&g.status==="accepted"});
  var data=shared?pubData():null,sig=shared?JSON.stringify(data):"none";
  if(sig===K.pubSig)return;
  try{
    var r=shared?await sb.from("shared_state").upsert({owner_id:me,data:data,updated_at:new Date().toISOString()})
                :await sb.from("shared_state").delete().eq("owner_id",me);
    if(!r.error)K.pubSig=sig;
  }catch(e){}
}
/* data from other accounts is untrusted: keep only well-formed fields */
function cleanR(owner,p){
  if(!p||typeof p!=="object"||typeof p.id!=="string"||!Array.isArray(p.items))return null;
  function str(v,n){return typeof v==="string"?v.slice(0,n):""}
  var items=p.items.slice(0,100).filter(function(it){return it&&typeof it.id==="string"&&it.id.length<=40}).map(function(it){
    var m=Math.round(+it.months);return{id:it.id,name:str(it.name,80)||"—",icon:str(it.icon,8),months:m>=1&&m<=60?m:6,date:okDate(it.date)?it.date:""}});
  var fl=(Array.isArray(p.flights)?p.flights:[]).slice(-1000).filter(function(f){return f&&okDate(f.date)&&Number.isInteger(f.min)&&f.min>0&&f.min<=1440}).map(function(f){
    var o={date:f.date,min:f.min};if(/^\d\d:\d\d$/.test(f.off||"")&&/^\d\d:\d\d$/.test(f.on||"")){o.off=f.off;o.on=f.on}return o});
  return{id:"r:"+owner+":"+p.id.slice(0,40),remote:true,owner:owner,uname:nm(owner),pid:p.id.slice(0,40),
    fio:str(p.fio,80)||"?",call:str(p.call,20),ic:Math.max(0,Math.min(ICONS.length-1,Math.round(+p.ic)||0)),items:items,flights:fl};
}
function setRM(rm){
  if(JSON.stringify(rm)===JSON.stringify(RM))return;
  RM=rm;try{localStorage.setItem("pilot_remote",JSON.stringify(RM))}catch(e){}
  if(String(S.active).indexOf("r:")===0&&!RM.some(function(u){return u.id===S.active})){S.active=S.users[0].id;save()}
  render();if(document.getElementById("uv").classList.contains("on"))renderUsers();
  if(!document.getElementById("v2").hidden)renderCalc();
}

async function refreshCloud(force){
  if(!sb||!K.s)return;
  var me=K.s.user.id;
  try{
    var rs=await Promise.all([
      sb.from("profiles").select("id,username"),
      sb.from("access_grants").select("owner_id,grantee_id,status"),
      sb.from("user_data").select("id,owner_id,added_by,payload,created_at").eq("owner_id",me).neq("added_by",me).order("created_at")
    ]);
    for(var i=0;i<rs.length;i++)if(rs[i].error)throw rs[i].error;
    var names={};rs[0].data.forEach(function(p){names[p.id]=p.username});
    K.names=names;K.grants=rs[1].data;K.box=rs[2].data;
    if(K.msg===L("cl_off"))K.msg="";
    var acc={};K.grants.forEach(function(g){if(g.grantee_id===me&&g.status==="accepted")acc[g.owner_id]=1});
    var ss=await sb.from("shared_state").select("owner_id,data");
    if(!ss.error){
      var rm=[];
      ss.data.forEach(function(row){
        if(!acc[row.owner_id]||!row.data||!Array.isArray(row.data.pilots))return;
        row.data.pilots.slice(0,50).forEach(function(p){var x=cleanR(row.owner_id,p);if(x)rm.push(x)});
      });
      setRM(rm);
    }
    publish();
  }catch(e){K.msg=L("cl_off");force=true}
  var sig=JSON.stringify([K.names,K.grants,K.box,K.msg]);
  badge();
  if(force||sig!==K.sig){K.sig=sig;rerenderSet(!!force)}
}

async function doAuth(){
  if(K.busy)return;
  var em=(K.f.k_em||"").trim(),pw=K.f.k_pw||"",un=(K.f.k_un||"").trim().toLowerCase();
  if(!em||!pw){say(L("cl_need"));return}
  if(K.mode==="up"){
    if(!/^[a-z0-9_]{3,20}$/.test(un)){say(L("cl_baduser"));return}
    if(pw.length<8){say(L("cl_shortpw"));return}
  }
  K.busy=true;
  try{
    var r=K.mode==="up"?await sb.auth.signUp({email:em,password:pw,options:{data:{username:un}}}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)say(/database error/i.test(r.error.message)?L("cl_err_user"):r.error.message);
    else if(K.mode==="up"&&!r.data.session){K.mode="in";K.f.k_pw="";say(L("cl_confirm"))}
    else{K.f.k_pw="";K.msg=""}
  }catch(e){say(L("cl_off"))}
  K.busy=false;
}
async function doReq(){
  var u=(K.f.k_rq||"").trim().toLowerCase().replace(/^@/,"");
  if(!/^[a-z0-9_]{3,20}$/.test(u)){say(L("cl_baduser"));return}
  try{
    var r=await sb.rpc("request_access",{p_username:u});
    if(r.error){say(/too many/i.test(r.error.message)?L("cl_many"):L("cl_off"));return}
    K.f.k_rq="";K.msg=L("cl_reqDone");await refreshCloud(true);
  }catch(e){say(L("cl_off"))}
}
async function setGrant(id,status){

  if(K.addType==="flight"){
    var o=val("k_o"),n=val("k_n"),m=val("k_m").trim(),min=null;
    if(m){var t=tm(m.replace(/[.,]/g,":"));if(t==null||isNaN(t)){alert(L("fmtErr"));return}min=t}
    else if(o&&n){var a=tm(o),b=tm(n);min=b-a;if(min<0)min+=1440}
    p={k:"flight",date:d,min:min};if(!m){p.off=o;p.on=n}
  }else p={k:"check",id:val("k_i"),date:d};
  if(!okRec(p)){alert(L(K.addType==="flight"?"needFl":"cl_baddate"));return}
  try{
    var r=await sb.from("user_data").insert({owner_id:K.addTo,added_by:K.s.user.id,payload:p});
    if(r.error){alert(L("cl_denied"));return}
    close();say(L("cl_sent"));
  }catch(e){alert(L("cl_off"))}
}
async function applyRec(id){
  var r=K.box.filter(function(x){return x.id===id})[0];
  if(!r||!okRec(r.payload))return;
  var p=r.payload,u=tgt(p),it=null;
  if(p.k==="check"){it=u.items.filter(function(x){return x.id===p.id})[0];if(!it){alert(L("cl_noitem"));return}}
  try{
    var dl=await sb.from("user_data").delete().eq("id",id);
    if(dl.error)throw dl.error;
  }catch(e){alert(L("cl_off"));return}
  if(p.k==="flight"){
    if(!u.flights)u.flights=[];
    var f={date:p.date,min:p.min};
    if(/^\d\d:\d\d$/.test(p.off||"")&&/^\d\d:\d\d$/.test(p.on||"")){f.off=p.off;f.on=p.on}
    u.flights.push(f);
  }else it.date=p.date;
  save();render();await refreshCloud(true);
}
async function dropRec(id){
  try{var dl=await sb.from("user_data").delete().eq("id",id);if(dl.error)throw dl.error;await refreshCloud(true)}
  catch(e){say(L("cl_off"))}
}

document.addEventListener("input",function(e){var t=e.target;if(t.id&&t.id.indexOf("k_")===0)K.f[t.id]=t.value});
document.addEventListener("change",function(e){if(e.target.id==="k_ty"){K.addType=e.target.value;renderAdd()}});
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-cx]");if(!a)return;
  var x=a.getAttribute("data-cx"),v=a.getAttribute("data-cv");
  if(x==="mode"){K.mode=v;K.msg="";rerenderSet(true)}
  else if(x==="auth")doAuth();
  else if(x==="out"){sb.auth.signOut()}
  else if(x==="req")doReq();
  else if(x==="acc")setGrant(v,"accepted");
  else if(x==="rev")setGrant(v,"revoked");
  else if(x==="dec")dropGrant(v,true);
  else if(x==="cancel")dropGrant(v,false);
  else if(x==="add")openAdd(v);
  else if(x==="apply")applyRec(+v);
  else if(x==="drop")dropRec(+v);
  else if(x==="sendk")sendRec();
  else if(x==="kclose")close();
  else if(x==="rsend")sendRemoteItem(v==="today");
});
function initCloud(){
  if(!window.supabase||!supabase.createClient)return;
  try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){sb=null;return}
  sb.auth.onAuthStateChange(function(ev,s){
    K.s=s;K.sig="";
    setTimeout(function(){
      if(s)refreshCloud(true);
      else{K.names={};K.grants=[];K.box=[];K.pubSig="";setRM([]);badge();rerenderSet(true)}
    },0);
  });
  setInterval(function(){if(!document.hidden)refreshCloud(false)},60000);
}

load();applyTheme();applyL();render();renderN();notify();scheduleNative();initCloud();(function(){var mb=document.getElementById("menuBtn");if(mb)mb.setAttribute("aria-label",L("pilotsBtn"))})();
</script>
