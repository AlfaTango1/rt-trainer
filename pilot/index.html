<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efefef;--card:#fff;--tx:#111;--mut:#8a8a8e;--pill:#fff;--inp:#f3f3f4;
--g:#2fae66;--o:#f59e2b;--r:#f85151}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e20;--tx:#f2f2f2;--mut:#98989d;--pill:#1e1e20;--inp:#2a2a2d}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e20;--tx:#f2f2f2;--mut:#98989d;--pill:#1e1e20;--inp:#2a2a2d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.25 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.pill{background:var(--pill);border-radius:99px;height:48px;display:flex;align-items:center;padding:0 18px;font-weight:700;font-size:17px;flex:1}
.round{width:48px;height:48px;border-radius:50%;background:var(--pill);border:0;font-size:24px;color:var(--tx);padding:0}
.sum{background:var(--card);border-radius:28px;padding:18px 20px;margin-bottom:14px}
.sum .big{font-size:20px;font-weight:800}
.sum .sub{color:var(--mut);margin-top:4px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{border:0;text-align:left;font:inherit;color:var(--tx);background:var(--card);border-radius:28px;min-height:190px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;width:100%}
.c .t{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut);font-weight:600}
.c .t i{font-style:normal;font-size:22px}
.c .b{font-size:23px;font-weight:800;line-height:1.15}
.c .s{font-size:14px;color:var(--mut);margin-top:6px;font-weight:500}
.c.g,.c.o,.c.r{color:#fff}
.c.g .t,.c.o .t,.c.r .t,.c.g .s,.c.o .s,.c.r .s{color:#fff;opacity:.92}
.c.g{background:var(--g)}.c.o{background:var(--o)}.c.r{background:var(--r)}
.c.add{align-items:center;justify-content:center;color:var(--mut);font-weight:700;background:transparent;border:2px dashed var(--mut);font-size:16px;gap:6px}
.c.add span{font-size:36px;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;font-size:16px;padding:13px;border-radius:14px;border:0;background:var(--inp);color:var(--tx)}
.btn{margin-top:12px;width:100%;padding:14px;border:0;border-radius:16px;font-size:16px;font-weight:700;color:#fff;background:var(--g)}
.btn.sec{background:var(--inp);color:var(--tx)}
.btn.del{background:transparent;color:var(--r)}
.note{color:var(--mut);font-size:13px;margin-top:16px;text-align:center}
.pill{border:0;font:inherit;font-weight:700;font-size:17px;color:var(--tx);text-align:left;gap:8px;overflow:hidden;white-space:nowrap}
.pill span{overflow:hidden;text-overflow:ellipsis;flex:1}
.uv{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;overflow:auto;padding:env(safe-area-inset-top,0px) 14px calc(110px + env(safe-area-inset-bottom,0px))}
.uv.on{display:block}
.uh{display:flex;align-items:center;gap:10px;padding:14px 0;max-width:520px;margin:0 auto}
.uh h1{flex:1;text-align:center;font-size:19px;margin:0}
.smw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px 8px;padding:0 4px}
.smt{border-collapse:separate;border-spacing:3px;font-size:13px;min-width:100%}
.smt th{color:var(--mut);font-weight:600;padding:4px 2px;white-space:nowrap}
.smt td{background:var(--inp);border-radius:8px;padding:7px 4px;text-align:center;white-space:nowrap;font-weight:600}
.smt td.smn{text-align:left;background:none;font-weight:700;white-space:normal;min-width:110px;position:sticky;left:0;background:var(--card)}
.smt td small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.ul{max-width:520px;margin:0 auto}
.u{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:28px;padding:16px;margin-bottom:12px;width:100%;border:2px solid transparent;font:inherit;color:var(--tx);text-align:left}
.u.act{border-color:var(--g)}
.av{width:56px;height:56px;border-radius:18px;background:var(--inp);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.un{flex:1;min-width:0}.un b{display:block;font-size:17px}.un small{color:var(--mut);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.dot.g{background:var(--g)}.dot.o{background:var(--o)}.dot.r{background:var(--r)}
.um{width:44px;height:44px;border-radius:50%;background:var(--inp);border:0;font-size:20px;color:var(--tx);flex:none}
.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.bot .btn{max-width:520px;margin:0 auto;display:block;background:#000;color:#fff;border-radius:22px;padding:18px}
:root[data-theme="dark"] .bot .btn{background:#f2f2f2;color:#000}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--inp)}

.nav button i{font-style:normal;font-size:24px}
.nav button.on{color:var(--g)}
main{padding-bottom:110px}
.card{background:var(--card);border-radius:28px;padding:18px;margin-bottom:12px}

.cpy .rt{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
.cpy .by{margin-top:9px;font-size:14px;font-style:italic;font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.cpy .nm{display:block;white-space:nowrap;font-size:17px;margin-top:3px;letter-spacing:.02em;font-style:normal;font-weight:600;background:linear-gradient(90deg,#a87a32,#e3bf74 50%,#a87a32);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h3{margin:0 0 6px;font-size:17px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px;font-weight:800}.stats small{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--inp)}
.fl div{flex:1}.fl small{color:var(--mut);display:block;font-size:13px}.fl b{font-size:17px}
.fl button{border:0;background:var(--inp);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:15px}
.ttl{font-size:22px;font-weight:800;margin:6px 4px 14px}
.lg{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
/* time calculator: iOS-calculator look, always dark */
.calc{position:relative;background:#000;color:#fff;border-radius:30px;padding:14px 14px 18px;margin-bottom:12px}
/* history button sits in the display corner, as on iOS, so the keypad keeps the height */
.calc .ch{position:absolute;left:14px;top:14px;z-index:1}
.calc .ib{width:46px;height:46px;border-radius:50%;border:0;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.calc .ib.on{background:#3a3a3c}
.disp{text-align:right;min-height:132px;padding:6px 8px 10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.disp #cr{color:#8e8e93;font-size:24px;min-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disp #ce{font-size:64px;font-weight:300;line-height:1.1;white-space:nowrap;letter-spacing:-1px}
.disp #ce i{font-style:normal;opacity:.35}
.chist{max-height:132px;overflow:auto;padding:2px 8px 8px 56px;text-align:right}
.chist button{display:block;width:100%;border:0;background:none;color:#8e8e93;font:inherit;font-size:17px;text-align:right;padding:6px 0;border-bottom:1px solid #1c1c1e}
.chist button b{color:#fff;font-weight:500}
/* key size --k: from the width here; fitKeys() also caps it by the height left above the tab bar */
.kp{--k:calc((min(100vw,520px) - 92px)/4);display:grid;grid-template-columns:repeat(4,var(--k));justify-content:space-between;row-gap:12px}

.kp button{border:0;border-radius:50%;aspect-ratio:1;width:var(--k);padding:0;font:inherit;font-size:calc(var(--k)*.42);font-weight:400;color:#fff;
 background:linear-gradient(#3b3b3d,#2a2a2c);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kp .fn{background:linear-gradient(#77777b,#5a5a5e)}
.kp .op{background:linear-gradient(#ffaa2b,#ff9500);font-size:calc(var(--k)*.5)}

:root[data-theme="light"] .calc{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08)}
:root[data-theme="light"] .calc .ib{background:#ececf0;color:#111}:root[data-theme="light"] .calc .ib.on{background:#d9d9de}

:root[data-theme="light"] .kp .fn{background:linear-gradient(#d6d6db,#c4c4ca)}
:root[data-theme="light"] .kp .op{color:#fff;background:linear-gradient(#ffaa2b,#ff9500)}

.warnr{background:#d92d2d;color:#fff;border-radius:20px;padding:12px 16px;font-size:14px;margin-bottom:12px}
.seg{display:flex;gap:8px}.seg button{flex:1;border:0;border-radius:14px;padding:12px 6px;background:var(--inp);color:var(--tx);font:inherit;font-weight:600;font-size:15px}.seg button.on{background:var(--g);color:#fff}

#intro:before{content:"";position:absolute;inset:0;pointer-events:none;

 background:linear-gradient(180deg,transparent,rgba(70,170,255,.10),transparent);animation:iscan 3.4s linear infinite}

#intro .cn{position:absolute;width:34px;height:34px;border:2px solid #1e90ff;opacity:.85}
#intro .c1{top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;border-right:0;border-bottom:0}
#intro .c2{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;border-left:0;border-bottom:0}
#intro .c3{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;border-right:0;border-top:0}
#intro .c4{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:14px;border-left:0;border-top:0}
#intro .t1{position:relative;font-weight:800;font-size:clamp(34px,11vw,64px);letter-spacing:.14em;margin-right:-.14em;color:#dce9ff;text-shadow:0 0 22px rgba(60,150,255,.55)}

#intro .sb{position:relative;display:flex;align-items:center;gap:12px;justify-content:center;margin-top:12px;font-size:clamp(10px,2.6vw,13px);letter-spacing:.42em;color:#6f94c9;font-weight:700}
#intro .sb:before,#intro .sb:after{content:"";height:1px;width:clamp(30px,12vw,90px);background:linear-gradient(90deg,transparent,#2b6fc2)}

#intro .lg{position:relative;width:min(70vw,330px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;animation:ilg 1s ease-out both}

#intro .lg img{width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 0 26px rgba(40,130,255,.55))}
#intro .lg:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(90,170,255,.55);animation:ispin 14s linear infinite}
#intro .lg:after{content:"";position:absolute;inset:-5%;border-radius:50%;border:2px solid transparent;border-top-color:#35a6ff;border-right-color:rgba(53,166,255,.25);animation:ispin 2.6s linear infinite}
@keyframes ispin{to{transform:rotate(360deg)}}
#intro .t2{position:relative;display:inline-block;font-weight:800;font-size:clamp(22px,7.4vw,44px);line-height:1;letter-spacing:.24em;margin-right:-.24em;padding:.35em .3em .35em .54em;white-space:nowrap;color:#35d4ff;text-shadow:0 0 18px rgba(40,200,255,.65);border-top:2px solid #1e90ff;border-bottom:2px solid #1e90ff;background:linear-gradient(90deg,transparent,rgba(30,144,255,.14),transparent)}
#intro .bar{position:relative;display:flex;gap:5px;justify-content:center;margin:16px 0 9px}
#intro .bar i{width:clamp(14px,5vw,24px);height:4px;background:#12305c;animation:iseg .3s ease forwards}
@keyframes iseg{to{background:#2aa4ff;box-shadow:0 0 8px #2aa4ff}}
#intro .sc{position:relative;font-size:10px;letter-spacing:.4em;color:#6f94c9}

function st(it){

  var due=addM(parse(it.date),+it.months||6),t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var d=Math.round((due-t)/864e5),sub=L("until",{s:fmt(due)});

var cx="",cdone=false,OPS="+−×÷",cerr=false;
/* "h:m" is a time; one digit after ":" is tens of minutes as on a clock (0:1 = 0:10). Plain numbers are hours in +/− and factors in ×/÷. */
function numT(t){
  if(t.indexOf(":")>=0){var p=t.split(":"),ms=p[1]||"";return{v:(+p[0]||0)*60+(ms.length===1?+ms*10:+ms||0),t:true}}
  return{v:parseFloat(t.replace(",","."))||0,t:false}
}
function evalFull(e){
  var tk=e.match(/\d+(?:,\d*)?(?::\d{0,2})?|[+−×÷]/g);if(!tk||OPS.indexOf(e.slice(-1))>=0)return null;
  if(OPS.indexOf(tk[0])>=0)tk.unshift("0");
  var a=[numT(tk[0])],ops=[],i,l,b,op,r;
  for(i=1;i<tk.length;i+=2){
    op=tk[i];b=numT(tk[i+1]);
    if(op==="×"||op==="÷"){
      l=a.pop();
      if(op==="×"){if(l.t&&b.t)return null;r={v:l.v*b.v,t:l.t||b.t}}
      else{if(b.v===0||(!l.t&&b.t))return null;r={v:l.v/b.v,t:l.t&&!b.t}}
      a.push(r);
    }else{ops.push(op);a.push(b)}
  }
  var cur0=a[0],j,y;
  for(j=0;j<ops.length;j++){
    var x=cur0.t?cur0.v:cur0.v*60;y=a[j+1].t?a[j+1].v:a[j+1].v*60;
    cur0={v:ops[j]==="+"?x+y:x-y,t:true};
  }
  if(!isFinite(cur0.v))return null;
  if(cur0.t){var m=Math.round(cur0.v);return(m<0?"−":"")+hm(Math.abs(m))}
  var n=parseFloat(cur0.v.toFixed(4));return(n<0?"−":"")+String(Math.abs(n)).replace(".",",")
}

function press(k){
  cerr=false;
  if(k==="C"){cx="";cdone=false}
  else if(k==="B"){cx=cdone?"":cx.slice(0,-1);cdone=false}
  else if(k==="="){
    var r=evalFull(cx);
    if(r==null){if(cx)cerr=true}
    else if(r!==cx){CH.unshift({e:cx,r:r});CH=CH.slice(0,30);try{localStorage.setItem("pilot_calc_h",JSON.stringify(CH))}catch(e){}cx=r;cdone=true}
  }
  else if(OPS.indexOf(k)>=0){
    var last=cx.slice(-1);
    if(last===",")cx=cx.slice(0,-1),last=cx.slice(-1);
    if(!cx){if(k==="−")cx="−"}
    else if(OPS.indexOf(last)>=0){if(cx.length>1)cx=cx.slice(0,-1)+k}
    else cx+=k;
    cdone=false;
  }
  else if(k===":"){if(cdone&&cx.indexOf(":")>=0)cx="",cdone=false;var n=seg();if(n.indexOf(":")<0&&n.indexOf(",")<0)cx+=(n?"":"0")+":";cdone=false}
  else if(k===","){if(cdone)cx="",cdone=false;var n2=seg();if(n2.indexOf(":")<0&&n2.indexOf(",")<0)cx+=(n2?"":"0")+","}
  else if(k==="00"){press("0");press("0");return}
  else{
    if(cdone){cx="";cdone=false}
    var s=seg(),c=s.indexOf(":");
    if(c>=0){var mm=s.slice(c+1);if(mm.length>=2||(mm.length===0&&+k>5))return updTC()}

function okDate(s){return typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(parse(s))===s}
function okRec(p){
  if(!p||typeof p!=="object")return false;
  if(p.pid!=null&&!(typeof p.pid==="string"&&p.pid.length<=40))return false;
  if(p.k==="flight")return okDate(p.date)&&Number.isInteger(p.min)&&p.min>0&&p.min<=1440;
  if(p.k==="check")return okDate(p.date)&&(CK.indexOf(p.id)>=0||/^x\d{1,16}$/.test(p.id));
  return false;
}

function tgt(p){return S.users.filter(function(u){return u.id===p.pid})[0]||curL()}
function recText(p){
  if(p.k==="flight")return L("cl_flight")+" "+hm(p.min)+" · "+fmt(parse(p.date));
  var it=tgt(p).items.filter(function(x){return x.id===p.id})[0];
  return (it?dn(it):L("it_"+p.id))+" — "+fmt(parse(p.date));
}
function pushRec(owner,p,isFlight){

    close();alert(L("cl_sent"));if(isFlight)renderCalc();
  },function(){alert(L("cl_off"))});
}

/* ---------- private cloud backup of this phone's data (table backups, owner only) ---------- */
function bakData(){return{v:1,users:S.users,warn:S.warn||30,per:S.per||{}}}
async function backup(){
  if(!sb||!K.s||!K.bakChecked)return;
  var data=bakData(),sig=JSON.stringify(data);if(sig===K.bakSig)return;
  try{
    var r=await sb.from("backups").upsert({owner_id:K.s.user.id,data:data,updated_at:new Date().toISOString()});
    if(!r.error){K.bakSig=sig;K.bakAt=new Date().toISOString();rerenderSet(false)}

/* untouched phone: one default pilot, no dates, no own checks */
function pristine(){
  return S.users.length===1&&S.users[0].fio==="Пилот"&&S.users[0].items.every(function(it){return !it.date&&CK.indexOf(it.id)>=0});
}
async function fetchBackup(){
  var r=await sb.from("backups").select("data,updated_at").eq("owner_id",K.s.user.id).maybeSingle();
  if(r.error)throw r.error;return r.data;
}
function applyBackup(row){
  var d=row&&row.data;if(!d||!Array.isArray(d.users)||!d.users.length)return false;
  S.users=d.users.filter(function(u){return u&&typeof u.id==="string"&&Array.isArray(u.items)});
  if(!S.users.length)return false;
  S.warn=+d.warn||30;WARN=S.warn;S.per=d.per&&typeof d.per==="object"?d.per:{};S.active=S.users[0].id;
  save();render();renderUsers();return true;

/* after sign-in: offer the cloud copy on an empty phone, otherwise start keeping one */
async function checkBackup(){
  if(K.bakChecked||!sb||!K.s)return;
  try{var row=await fetchBackup()}catch(e){return}
  K.bakChecked=true;K.bakAt=row&&row.updated_at;
  if(row&&pristine()&&Array.isArray(row.data&&row.data.users)){
    ask(L("bakFound",{d:fmt(new Date(row.updated_at)),n:row.data.users.length}),L("bakRestore"),function(){applyBackup(row);rerenderSet(true)});
  }else backup();
  rerenderSet(true);

async function restoreNow(){

  if(!row){alert(L("bakNone"));return}

async function publish(){
  if(!sb||!K.s)return;
  var me=K.s.user.id,shared=K.grants.some(function(g){return g.owner_id===me&&g.status==="accepted"});
  var data=shared?pubData():null,sig=shared?JSON.stringify(data):"none";
  if(sig===K.pubSig)return;
  try{
    var r=shared?await sb.from("shared_state").upsert({owner_id:me,data:data,updated_at:new Date().toISOString()})
                :await sb.from("shared_state").delete().eq("owner_id",me);
    if(!r.error)K.pubSig=sig;
  }catch(e){}
}
/* data from other accounts is untrusted: keep only well-formed fields */
function cleanR(owner,p){
  if(!p||typeof p!=="object"||typeof p.id!=="string"||!Array.isArray(p.items))return null;
  function str(v,n){return typeof v==="string"?v.slice(0,n):""}
  var items=p.items.slice(0,100).filter(function(it){return it&&typeof it.id==="string"&&it.id.length<=40}).map(function(it){
    var m=Math.round(+it.months);return{id:it.id,name:str(it.name,80)||"—",icon:str(it.icon,8),months:m>=1&&m<=60?m:6,date:okDate(it.date)?it.date:""}});
  var fl=(Array.isArray(p.flights)?p.flights:[]).slice(-1000).filter(function(f){return f&&okDate(f.date)&&Number.isInteger(f.min)&&f.min>0&&f.min<=1440}).map(function(f){
    var o={date:f.date,min:f.min};if(/^\d\d:\d\d$/.test(f.off||"")&&/^\d\d:\d\d$/.test(f.on||"")){o.off=f.off;o.on=f.on}return o});
  return{id:"r:"+owner+":"+p.id.slice(0,40),remote:true,owner:owner,uname:nm(owner),pid:p.id.slice(0,40),
    fio:str(p.fio,80)||"?",call:str(p.call,20),ic:Math.max(0,Math.min(ICONS.length-1,Math.round(+p.ic)||0)),ac:acOk(p.ac),items:items,flights:fl};
}

async function refreshCloud(force){
  if(!sb||!K.s)return;
  var me=K.s.user.id;
  try{
    var rs=await Promise.all([
      sb.from("profiles").select("id,username"),
      sb.from("access_grants").select("owner_id,grantee_id,status"),
      sb.from("user_data").select("id,owner_id,added_by,payload,created_at").eq("owner_id",me).neq("added_by",me).order("created_at")
    ]);
    for(var i=0;i<rs.length;i++)if(rs[i].error)throw rs[i].error;
    var names={};rs[0].data.forEach(function(p){names[p.id]=p.username});
    K.names=names;K.grants=rs[1].data;K.box=rs[2].data;
    if(K.msg===L("cl_off"))K.msg="";
    var acc={};K.grants.forEach(function(g){if(g.grantee_id===me&&g.status==="accepted")acc[g.owner_id]=1});
    var ss=await sb.from("shared_state").select("owner_id,data");
    if(!ss.error){
      var rm=[];
      ss.data.forEach(function(row){
        if(!acc[row.owner_id]||!row.data||!Array.isArray(row.data.pilots))return;
        row.data.pilots.slice(0,50).forEach(function(p){var x=cleanR(row.owner_id,p);if(x)rm.push(x)});
      });
      setRM(rm);
    }
    publish();
  }catch(e){K.msg=L("cl_off");force=true}
  var sig=JSON.stringify([K.names,K.grants,K.box,K.msg]);
  badge();
  if(force||sig!==K.sig){K.sig=sig;rerenderSet(!!force)}
}

/* Supabase auth errors come in English; show the common ones in the app language */
function authErr(m){
  var map=[[/duplicate|unique/i,"cl_taken"],[/database error/i,"cl_err_user"],[/not authori[sz]ed/i,"cl_err_mail"],[/rate limit|too many/i,"cl_err_rate"],[/already (registered|exists)/i,"cl_err_exists"],
    [/invalid login credentials/i,"cl_err_login"],[/not confirmed/i,"cl_err_unconf"],[/invalid.*email|email.*invalid/i,"cl_err_email"],[/password/i,"cl_shortpw"]];
  for(var i=0;i<map.length;i++)if(map[i][0].test(m))return L(map[i][1]);
  return m;
}
async function doAuth(){
  if(K.busy)return;
  /* read the fields themselves: phone autofill and keyboards may skip the input event */
  ["k_em","k_pw","k_un"].forEach(function(id){var e=document.getElementById(id);if(e)K.f[id]=e.value});
  var em=(K.f.k_em||"").trim().toLowerCase(),pw=K.f.k_pw||"",un=(K.f.k_un||"").trim().toLowerCase().replace(/^@/,"");
  if(!em||!pw){say(L("cl_need"));return}
  if(K.mode==="up"){
    if(!/^[a-z0-9_]{3,20}$/.test(un)){say(L("cl_baduser"));return}
    if(pw.length<8){say(L("cl_shortpw"));return}
  }
  K.busy=true;
  try{
    /* one username = one account; the unique index in the database is the real guard, this only answers early */
    if(K.mode==="up"){
      var av=await sb.rpc("username_available",{p_username:un});
      if(!av.error&&av.data===false){say(L("cl_taken"));K.busy=false;return}
    }
    var r=K.mode==="up"?await sb.auth.signUp({email:em,password:pw,options:{data:{username:un},emailRedirectTo:"https://alfatango1.github.io/rt-trainer/pilot/"}}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)say(authErr(r.error.message||""));
    else if(K.mode==="up"&&!r.data.session){K.mode="in";K.f.k_pw="";say(L("cl_confirm"))}
    else{K.f.k_pw="";K.msg=""}
  }catch(e){say(L("cl_off"))}
  K.busy=false;
}
async function doReq(){
  var u=(K.f.k_rq||"").trim().toLowerCase().replace(/^@/,"");
  if(!/^[a-z0-9_]{3,20}$/.test(u)){say(L("cl_baduser"));return}
  try{
    var r=await sb.rpc("request_access",{p_username:u});
    if(r.error){say(/too many/i.test(r.error.message)?L("cl_many"):L("cl_off"));return}
    K.f.k_rq="";K.msg=L("cl_reqDone");await refreshCloud(true);

async function sendRec(){

    if(m){var t=tm(m.replace(/[.,]/g,":"));if(t==null||isNaN(t)){alert(L("fmtErr"));return}min=t}

function daysLeft(it){if(!it||!it.date)return null;var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((addM(parse(it.date),+it.months||6)-t)/864e5)}

  return S.users.concat(RM).map(function(u){
    var cells=CK.map(function(id){var it=u.items.filter(function(x){return x.id===id})[0];var d=daysLeft(it);
      return{d:d,lvl:d==null?-1:d<=0?2:d<=WARN?1:0,due:it&&it.date?addM(parse(it.date),+it.months||6):null}});
    var worst=Math.max.apply(null,cells.map(function(c){return c.lvl})),minD=Math.min.apply(null,cells.map(function(c){return c.d==null?1e9:c.d}));
    return{u:u,cells:cells,worst:worst,minD:minD};
  }).sort(function(a,b){return b.worst-a.worst||a.minD-b.minD});
}
function cellTxt(c){return c.d==null?"—":c.d<0?L("sumOver",{n:-c.d}):L("sumDays",{n:c.d})}
function sumTable(rows,print){
  var col=["#2fae66","#f59e2b","#f85151"];
  return '<table class="smt"><thead><tr><th>'+L("user")+'</th>'+CK.map(function(id){return '<th>'+esc(shortN(id))+'</th>'}).join("")+'</tr></thead><tbody>'+
    rows.map(function(r){return '<tr><td class="smn">'+esc(r.u.fio)+(r.u.call?'<small>'+esc(r.u.call)+'</small>':'')+(r.u.remote?'<small>☁️ @'+esc(r.u.uname)+'</small>':'')+'</td>'+
      r.cells.map(function(c){return '<td'+(c.lvl>=0?' style="background:'+col[c.lvl]+';color:#fff"':'')+'>'+cellTxt(c)+(print&&c.due?'<small>'+fmt(c.due)+'</small>':'')+'</td>'}).join("")+'</tr>'}).join("")+
    '</tbody></table>';
}
function openSummary(){
  var rows=sumRows(),red=rows.filter(function(r){return r.worst===2}).length,or=rows.filter(function(r){return r.worst===1}).length;
  document.getElementById("sheet").innerHTML='<h2>'+L("sumT")+'</h2><p class="rmn">'+fmt(new Date())+' · '+L("sumCount",{n:rows.length,r:red,o:or})+'</p>'+
    '<div class="smw">'+sumTable(rows,false)+'</div>'+
    '<div class="two" style="margin-top:4px"><button class="btn" id="smpdf">'+L("sumPdf")+'</button><button class="btn" id="smcsv">'+L("sumCsv")+'</button></div>'+
    '<button class="btn sec" id="uc">'+L("close")+'</button>';
  document.getElementById("ov").classList.add("on");
}
function printSummary(){
  var html='<!doctype html><html lang="'+(S.lang||"ru")+'"><head><meta charset="utf-8"><title>'+esc(L("sumT"))+'</title><style>'+
    'body{font:12px -apple-system,Segoe UI,Roboto,sans-serif;color:#111;margin:16px}h1{font-size:18px;margin:0 0 4px}p{margin:0 0 12px;color:#555}'+
    'table{border-collapse:collapse;width:100%}th,td{border:1px solid #bbb;padding:6px;text-align:center;vertical-align:top}td small{display:block;font-size:10px;opacity:.85}'+
    'td:first-child{text-align:left;font-weight:600}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body>'+
    '<h1>'+esc(L("sumT"))+'</h1><p>'+fmt(new Date())+'</p>'+sumTable(sumRows(),true)+'</body></html>';
  var f=document.createElement("iframe");f.style.cssText="position:fixed;width:0;height:0;border:0;right:0;bottom:0";document.body.appendChild(f);
  var d=f.contentWindow.document;d.open();d.write(html);d.close();
  setTimeout(function(){try{f.contentWindow.focus();f.contentWindow.print()}catch(e){}setTimeout(function(){f.remove()},60000)},300);
}
function csvSummary(){
  function q(s){s=String(s==null?"":s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
  var head=[L("user"),L("callL")].concat(CK.map(function(id){return L("it_"+id)+" — "+L("sumDue")}),CK.map(function(id){return L("it_"+id)+" — "+L("sumLeft")}));
  var lines=[head.map(q).join(";")].concat(sumRows().map(function(r){
    var dd=r.cells.map(function(c){return c.due?iso(c.due).split("-").reverse().join("."):""}),ll=r.cells.map(function(c){return c.d==null?"":c.d});
    return [r.u.fio+(r.u.remote?" (@"+r.u.uname+")":""),r.u.call||""].concat(dd,ll).map(q).join(";");
  }));
  var b=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="pilots-"+iso(new Date())+".csv";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
document.addEventListener("click",function(e){
  var id=e.target.closest&&e.target.closest("#smb,#smpdf,#smcsv");if(!id)return;
  if(id.id==="smb")openSummary();else if(id.id==="smpdf")printSummary();else csvSummary();
});

load();applyTheme();applyL();render();renderN();notify();scheduleNative();initCloud();(function(){var mb=document.getElementById("menuBtn");if(mb)mb.setAttribute("aria-label",L("pilotsBtn"))})();
