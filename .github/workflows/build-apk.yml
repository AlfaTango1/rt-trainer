name: Build APK

# Run it from the Actions tab ("Run workflow"), or automatically when index.html changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare the app files
        run: |
          mkdir -p app/www app/assets
          cp index.html app/www/index.html
          cp icon-192.png icon-512.png app/www/ 2>/dev/null || true
          cp icon-512.png app/assets/logo.png

      - name: Create the Android project
        working-directory: app
        run: |
          npm init -y > /dev/null
          npm install --legacy-peer-deps \
            @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 \
            @capacitor-community/speech-recognition@7 \
            @capacitor-community/text-to-speech@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "io.github.alfatango1.rttrainer",
            "appName": "RT Trainer",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "auto" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Allow the microphone
        working-directory: app/android/app/src/main
        run: |
          python3 - <<'PY'
          p = 'AndroidManifest.xml'
          s = open(p).read()
          add = ''
          if 'RECORD_AUDIO' not in s:
              add += ' <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'RecognitionService' not in s:
              add += (' <queries>\n'
                      ' <intent><action android:name="android.speech.RecognitionService" /></intent>\n'
                      ' <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n'
                      ' </queries>\n')
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w').write(s)
          print(s)
          PY

      - name: App icon
        working-directory: app
        continue-on-error: true
        run: |
          npx --yes @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#13202A' --iconBackgroundColorDark '#13202A' \
            --splashBackgroundColor '#13202A' --splashBackgroundColorDark '#13202A'

      - name: Version number
        working-directory: app/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -n "version" build.gradle

      - name: Use the same signing key every time
        working-directory: app/android/app
        run: |
          python3 - <<'PY'
          p = 'build.gradle'
          s = open(p).read()
          block = '''android { signingConfigs { debug { storeFile file("../../../debug.keystore") storePassword "android" keyAlias "androiddebugkey" keyPassword "android" } } '''
          if 'debug.keystore' not in s:
              s = s.replace('android {', block, 1)
          open(p, 'w').write(s)
          PY
          head -30 build.gradle

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../RT-Trainer.apk

      - name: Save the APK (Actions → this run → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: RT-Trainer-APK
          path: RT-Trainer.apk

      - name: Publish the APK (Releases, easy download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RT Trainer 1.0.${{ github.run_number }}
          body: Download RT-Trainer.apk below and open it on your Android phone.
          files: RT-Trainer.apk
