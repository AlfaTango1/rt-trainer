name: Keep Supabase awake

# Free Supabase projects pause after 7 days without database activity, which
# would stop sign-in and shared pilots. One tiny read a day keeps the Pilot
# project active. The key is the public (anon) key the app already ships.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ask the database one question
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            'https://cblwqdejctpowcczkpic.supabase.co/rest/v1/rpc/username_available' \
            -H 'apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNibHdxZGVqY3Rwb3djY3prcGljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NjQwMTcsImV4cCI6MjEwOTA0MDAxN30.PiHZ-GGdX7D1uJe0L4rSN5409uYTDhkSN_Obwv-sH3A' \
            -H 'Content-Type: application/json' \
            -d '{"p_username":"keepalive_ping"}')
          echo "HTTP $code: $(cat /tmp/out)"
          test "$code" = 200
