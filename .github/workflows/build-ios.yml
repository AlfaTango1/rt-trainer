name: Build iOS

# Run from the Actions tab: "Build iOS" -> "Run workflow".
# Without signing secrets it builds an UNSIGNED .ipa (install it with Sideloadly or AltStore using your Apple ID).
# With the four IOS_* secrets (paid Apple Developer account) it builds a SIGNED .ipa you can install directly.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID != '' && secrets.IOS_BUNDLE_ID || 'io.github.alfatango1.rttrainer' }}
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create the iOS project
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cp icon-192.png icon-512.png app/www/ 2>/dev/null || true
          cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund --legacy-peer-deps \
            @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 \
            @capacitor-community/speech-recognition@7 \
            @capacitor-community/text-to-speech@6 \
            @capacitor/keyboard@7
          cat > capacitor.config.json <<JSON
          {
            "appId": "${BUNDLE_ID}",
            "appName": "RT Trainer",
            "webDir": "www",
            "ios": { "contentInset": "always", "backgroundColor": "#13202A" },
            "plugins": { "Keyboard": { "resize": "native", "resizeOnFullScreen": true } }
          }
          JSON
          npx cap add ios
          npx cap sync ios

      - name: Microphone and speech permissions, app name
        run: |
          P=app/ios/App/App/Info.plist
          set_key() { /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$P"; }
          set_key NSMicrophoneUsageDescription string "RT Trainer listens to your radio calls so it can check your readback."
          set_key NSSpeechRecognitionUsageDescription string "RT Trainer turns your radio calls into text to check them."
          set_key CFBundleDisplayName string "RT Trainer"
          set_key ITSAppUsesNonExemptEncryption bool false
          /usr/libexec/PlistBuddy -c "Print" "$P" | head -60

      - name: App icon
        run: |
          ICON_DIR=app/ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls "$ICON_DIR" || true
          TARGET=$(ls "$ICON_DIR"/*.png 2>/dev/null | head -1)
          if [ -n "$TARGET" ] && [ -f icon-512.png ]; then
            sips -s format png -z 1024 1024 icon-512.png --out "$TARGET" && echo "Icon replaced: $TARGET"
          else
            echo "::warning::Kept the default Capacitor icon."
          fi

      - name: Signing certificate and profile (only when the secrets exist)
        if: env.HAS_SIGNING == 'true'
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db; KCP=$(uuidgen)
          echo "$P12_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "$PROFILE_B64" | base64 --decode > $RUNNER_TEMP/app.mobileprovision
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC" > /dev/null
          security list-keychain -d user -s "$KC" login.keychain
          security cms -D -i $RUNNER_TEMP/app.mobileprovision > $RUNNER_TEMP/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/profile.plist)
          PNAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp $RUNNER_TEMP/app.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PNAME" >> $GITHUB_ENV
          echo "Profile: $PNAME ($UUID)"

      - name: Build
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD != '' && secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          cd app/ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          LOG=$GITHUB_WORKSPACE/xcode.log
          if [ "$HAS_SIGNING" = "true" ]; then
            set -o pipefail
            xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
              -archivePath "$PWD/build/App.xcarchive" archive \
              CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CODE_SIGN_IDENTITY="Apple Distribution" \
              PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" 2>&1 | tee "$LOG" | tail -60
            cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string></dict>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" \
              -exportOptionsPlist build/ExportOptions.plist -exportPath "$PWD/build/ipa" 2>&1 | tail -40
            cp build/ipa/*.ipa "$GITHUB_WORKSPACE/RT-Trainer.ipa"
            echo "NOTE=Signed build ($EXPORT_METHOD). Install it on the iPhones registered in your provisioning profile." >> $GITHUB_ENV
          else
            set -o pipefail
            xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
              -archivePath "$PWD/build/App.xcarchive" archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee "$LOG" | tail -60
            APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
            [ -n "$APP" ] || { echo "::error::No .app was produced"; grep -m20 "error:" "$LOG" | while read -r l; do echo "::error::$l"; done; exit 1; }
            rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
            zip -qry "$GITHUB_WORKSPACE/RT-Trainer-unsigned.ipa" Payload
            echo "NOTE=Unsigned build. Install it with Sideloadly or AltStore using your Apple ID." >> $GITHUB_ENV
          fi
          ls -la $GITHUB_WORKSPACE/*.ipa

      - name: Show errors if the build failed
        if: failure()
        run: |
          [ -f xcode.log ] && grep -m40 -E "error:|\*\* ARCHIVE FAILED" xcode.log | tee -a $GITHUB_STEP_SUMMARY || true

      - name: Save the IPA (Actions -> this run -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: RT-Trainer-iOS
          path: '*.ipa'

      - name: Publish the IPA (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-1.0.${{ github.run_number }}
          name: RT Trainer iOS 1.0.${{ github.run_number }}
          body: |
            ${{ env.NOTE }}
          files: '*.ipa'
